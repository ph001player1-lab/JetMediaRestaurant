<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Menu</title>
<link rel="icon" href="/favicon.svg">
<!-- Пишем под старый WebView на Android 11: без ?., ??, aspect-ratio, inset и flex-gap -->
<style>
  :root { --bg: #f7f3ee; --card: #fff; --ink: #1f1a17; --muted: #8a7f76; --accent: #c8553d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans Thai", "Noto Sans SC", sans-serif; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; padding: 14px 16px; background: var(--card); }
  header h1 { font-size: 26px; margin: 0; flex: 1; }
  .langs button { border: 1px solid #ddd; background: none; border-radius: 10px; padding: 10px 14px; font-size: 18px; margin-left: 8px; color: var(--ink); }
  .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* Категории — горизонтальная лента */
  #cats { white-space: nowrap; overflow-x: auto; padding: 10px 12px; background: var(--card); box-shadow: 0 1px 0 rgba(0,0,0,.06); flex: none; }
  #cats button { display: inline-block; border: 1px solid #e3d9cf; background: var(--bg); color: var(--ink); border-radius: 24px; padding: 12px 18px; font-size: 18px; margin-right: 8px; }
  #cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; }
  #items { flex: 1; overflow-y: auto; padding: 8px; }
  /* Карточки — flex-wrap вместо grid: старый WebView сжимает строки grid по высоте экрана */
  .grid { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .item { flex: none; width: calc(50% - 16px); margin: 8px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .item img, .ph { width: 100%; height: 260px; object-fit: cover; background: #eee4da; display: block; }
  .item .b { padding: 12px 14px 14px; }
  .item .n { font-weight: 600; font-size: 21px; line-height: 1.25; margin-bottom: 6px; }
  .item .d { color: var(--muted); font-size: 15px; line-height: 1.3; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .price { font-weight: 700; font-size: 22px; }
  .add { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  @media (min-width: 1000px) { .item { width: calc(33.333% - 16px); } }
  footer { display: flex; padding: 12px 16px; background: var(--card); box-shadow: 0 -1px 0 rgba(0,0,0,.06); flex: none; }
  footer button { flex: 1; border: 0; border-radius: 14px; font-size: 20px; font-weight: 600; padding: 22px 8px; margin-left: 12px; background: #efe7df; color: var(--ink); }
  footer button:first-child { margin-left: 0; }
  footer #cartBtn { background: var(--accent); color: #fff; }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 4; }
  .overlay.show { display: flex; }
  .sheet { background: var(--card); width: 680px; max-width: 100%; max-height: 85%; overflow: auto; border-radius: 20px 20px 0 0; padding: 22px; font-size: 18px; }
  .line { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .line .n { flex: 1; padding-right: 10px; }
  .qty { white-space: nowrap; margin-right: 12px; }
  .qty button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid #ddd; background: none; font-size: 22px; color: var(--ink); }
  .big { width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 600; background: var(--accent); color: #fff; margin-top: 14px; }
  .big.ghost { background: #efe7df; color: var(--ink); }
  .status { font-size: 15px; color: var(--muted); }
  #toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 16px 24px; border-radius: 14px; font-size: 20px; display: none; z-index: 30; text-align: center; }
  /* Экран простоя: акции и реклама, крупные кнопки и выбор языка */
  #attract { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; display: none; z-index: 10; color: #fff; }
  #attract img { width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  #attract .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 32px 150px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  #attract .cap b { display: block; font-size: 38px; line-height: 1.2; }
  #attract .cap span { display: block; font-size: 22px; opacity: .9; margin-top: 8px; }
  #attract .acts { position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; }
  #attract .abtn { flex: 1; margin: 0 8px; border: 0; border-radius: 18px; padding: 28px 12px; font-size: 24px; font-weight: 700; background: rgba(255,255,255,.94); color: var(--ink); }
  #attract .abtn.main { background: var(--accent); color: #fff; }
  #attract .alangs { position: absolute; top: 20px; right: 16px; }
  #attract .alangs button { font-size: 20px; padding: 12px 16px; margin-left: 8px; border-radius: 12px; border: 0; background: rgba(255,255,255,.88); color: var(--ink); }
  #attract .alangs button.on { background: var(--accent); color: #fff; }
  #attract .tag { position: absolute; top: 24px; left: 20px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 8px; font-size: 15px; display: none; }
  #msg { display: none; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; line-height: 1.6; }
</style>
</head>
<body>
<div id="msg"></div>
<div id="app" style="display:none">
  <header><h1 id="title"></h1><div class="langs" id="langs"></div></header>
  <nav id="cats"></nav>
  <main><section id="items"></section></main>
  <footer><button id="callBtn"></button><button id="billBtn"></button><button id="cartBtn"></button></footer>
</div>
<div class="overlay" id="cart"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="attract">
  <img id="aImg" alt="">
  <span class="tag" id="aTag"></span>
  <div class="alangs" id="aLangs"></div>
  <div class="cap"><b id="aName"></b><span id="aText"></span></div>
  <div class="acts"><button class="abtn" id="aCall"></button><button class="abtn main" id="aMenu"></button></div>
</div>
<script>
var T = {
  en: { call: 'Call waiter', bill: 'Bill, please', cart: 'Order', send: 'Send to waiter', empty: 'Your order is empty', total: 'Total',
        sent: 'Order sent. A waiter will come to confirm it.', called: 'The waiter has been called', coming: 'The waiter is on the way',
        confirmed: 'Order confirmed', touch: 'Touch to see the menu', add: 'Add', close: 'Close', ordered: 'Ordered',
        pending: 'awaiting confirmation', rejected: 'cancelled', day: '★ Dish of the day', menu: 'Open menu', ad: 'Advertisement' },
  ru: { call: 'Вызвать официанта', bill: 'Счёт', cart: 'Заказ', send: 'Отправить официанту', empty: 'Заказ пуст', total: 'Итого',
        sent: 'Заказ отправлен. Официант подойдёт подтвердить.', called: 'Официант вызван', coming: 'Официант идёт',
        confirmed: 'Заказ подтверждён', touch: 'Коснитесь, чтобы открыть меню', add: 'Добавить', close: 'Закрыть', ordered: 'Заказано',
        pending: 'ждёт подтверждения', rejected: 'отменён', day: '★ Блюдо дня', menu: 'Открыть меню', ad: 'Реклама' },
  th: { call: 'เรียกพนักงาน', bill: 'เช็คบิล', cart: 'รายการสั่ง', send: 'ส่งให้พนักงาน', empty: 'ยังไม่มีรายการ', total: 'รวม',
        sent: 'ส่งรายการแล้ว พนักงานจะมายืนยัน', called: 'เรียกพนักงานแล้ว', coming: 'พนักงานกำลังมา',
        confirmed: 'ยืนยันรายการแล้ว', touch: 'แตะเพื่อดูเมนู', add: 'เพิ่ม', close: 'ปิด', ordered: 'สั่งแล้ว',
        pending: 'รอยืนยัน', rejected: 'ยกเลิกแล้ว', day: '★ เมนูแนะนำประจำวัน', menu: 'ดูเมนู', ad: 'โฆษณา' },
  zh: { call: '呼叫服务员', bill: '结账', cart: '订单', send: '发送给服务员', empty: '订单为空', total: '合计',
        sent: '订单已发送，服务员将前来确认', called: '已呼叫服务员', coming: '服务员马上就来',
        confirmed: '订单已确认', touch: '点击查看菜单', add: '添加', close: '关闭', ordered: '已点',
        pending: '待确认', rejected: '已取消', day: '★ 今日推荐', menu: '查看菜单', ad: '广告' }
};
var LANG_NAMES = { en: 'EN', th: 'ไทย', ru: 'RU', zh: '中文' };
var IDLE_ATTRACT_MS = 60000, IDLE_RESET_MS = 180000, DAY = '\u2605day';

var D = new URLSearchParams(location.search).get('d') || '';
var lang = null, state = null, cart = {}, cat = null, lastTouch = Date.now(), slide = 0, menuSig = '', seen = {}, sending = false;
// cart: ключ «id» или «id|вариант» → количество; MENU: id → блюдо; BUILD: версия интерфейса
var MENU = {}, BUILD = null, sheetMode = 'cart', slideAt = 0;

function $(id) { return document.getElementById(id); }
function t(k) { return (T[lang] || T.en)[k] || T.en[k]; }
function tr(o) { if (!o) return ''; if (typeof o === 'string') return o; return o[lang] || o.en || o[Object.keys(o)[0]] || ''; }
function money(n) { return '฿' + Number(n || 0).toLocaleString('en'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function defLang() { return (state.restaurant.langs || ['en'])[0]; }
function show(el, on) { $(el).style.display = on ? (el === 'msg' ? 'flex' : '') : 'none'; }

function toast(text) {
  $('toast').textContent = text;
  $('toast').style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { $('toast').style.display = 'none'; }, 4000);
}

function post(path, body) {
  body.d = D;
  return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}

function load() {
  return fetch('/api/guest/state?d=' + encodeURIComponent(D)).then(function (r) { return r.json(); }).then(function (s) {
    if (s.unassigned) {
      show('app', false); show('msg', true);
      $('msg').innerHTML = 'JET MEDIA<br>Устройство не привязано к столу<br>Device is not assigned to a table<br><small>' + esc(D) + '</small>';
      return;
    }
    show('msg', false); show('app', true);
    // Вышла новая версия интерфейса — перезагружаемся, но не посреди заказа
    if (BUILD && s.build && s.build !== BUILD && !cartCount() && Date.now() - lastTouch > 30000) { location.reload(); return; }
    BUILD = BUILD || s.build;
    var first = !state;
    state = s;
    if (!lang) lang = defLang();
    notifyChanges(first);
    var sig = JSON.stringify(s.menu) + s.restaurant.name;
    if (sig !== menuSig) {
      menuSig = sig;
      MENU = {};
      s.menu.forEach(function (i) { MENU[i.id] = i; });
      renderAll();
    } else renderFooter();
    if (sheetMode === 'cart' && $('cart').className.indexOf('show') >= 0) renderCart();
  }).catch(function () { /* нет сети — пробуем снова через 5 с */ });
}

// Гостю показываем, когда официант нажал «Иду» или подтвердил заказ
function notifyChanges(first) {
  state.calls.concat(state.orders).forEach(function (x) {
    var prev = seen[x.id];
    seen[x.id] = x.status;
    if (first || prev === x.status) return;
    if (x.status === 'ack') toast(t('coming'));
    if (x.status === 'confirmed') toast(t('confirmed'));
  });
}

function categories() {
  var known = {}, out = state.menu.some(function (i) { return i.dayDish; }) ? [DAY] : [];
  state.menu.forEach(function (i) { var c = tr(i.cat) || '—'; if (!known[c]) { known[c] = 1; out.push(c); } });
  return out;
}

function renderAll() {
  $('title').textContent = state.restaurant.name;
  $('langs').innerHTML = (state.restaurant.langs || ['en']).map(function (l) {
    return '<button data-lang="' + l + '" class="' + (l === lang ? 'on' : '') + '">' + (LANG_NAMES[l] || l) + '</button>';
  }).join('');
  var list = categories();
  if (list.indexOf(cat) < 0) cat = list[0];
  $('cats').innerHTML = list.map(function (c) {
    return '<button data-cat="' + esc(c) + '" class="' + (c === cat ? 'on' : '') + '">' + esc(c === DAY ? t('day') : c) + '</button>';
  }).join('');
  $('items').innerHTML = '<div class="grid">' + state.menu.filter(function (i) { return cat === DAY ? i.dayDish : (tr(i.cat) || '—') === cat; }).map(function (i) {
    return '<div class="item">' + (i.photo ? '<img src="' + esc(i.photo) + '" alt="">' : '<div class="ph"></div>') +
      '<div class="b"><div class="n">' + esc(tr(i.name)) + '</div><div class="d">' + esc(tr(i.desc)) + '</div>' +
      '<div class="row"><span class="price">' + priceLabel(i) + '</span>' +
      '<button class="add" data-add="' + esc(i.id) + '">' + t('add') + (inCart(i.id) ? ' · ' + inCart(i.id) : '') + '</button></div></div></div>';
  }).join('') + '</div>';
  renderAttractTexts();
  renderFooter();
}

function renderAttractTexts() {
  $('aCall').textContent = t('call');
  $('aMenu').textContent = t('menu');
  $('aTag').textContent = t('ad');
  $('aLangs').innerHTML = (state.restaurant.langs || ['en']).map(function (l) {
    return '<button data-alang="' + l + '" class="' + (l === lang ? 'on' : '') + '">' + (LANG_NAMES[l] || l) + '</button>';
  }).join('');
}

// Оформление подписи слайда из настроек менеджера
function styleCaption(ds) {
  var hex = /^#[0-9a-f]{6}$/i.test(ds.bgColor) ? ds.bgColor : '#000000';
  var rgb = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(',');
  var cap = document.querySelector('#attract .cap');
  cap.style.color = ds.textColor || '#fff';
  cap.style.background = 'linear-gradient(rgba(' + rgb + ',0), rgba(' + rgb + ',.88) 45%)';
  $('aName').style.fontSize = (ds.titleSize || 38) + 'px';
  $('aText').style.fontSize = (ds.textSize || 22) + 'px';
}

function hideAttract() {
  $('attract').style.display = 'none';
  lastTouch = Date.now();
}

function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
function inCart(id) { var n = 0; for (var k in cart) if (k.split('|')[0] === id) n += cart[k]; return n; }
// Строка корзины: блюдо, выбранный вариант, цена и название
function lineOf(key) {
  var p = key.split('|'), i = MENU[p[0]];
  if (!i) return null;
  var o = p[1] ? (i.options || []).filter(function (x) { return x.key === p[1]; })[0] : null;
  if (p[1] && !o) return null;
  return { price: Number(o ? o.price : i.price) || 0, name: tr(i.name) + (o ? ' · ' + tr(o.label) : '') };
}
function cartTotal() {
  return Object.keys(cart).reduce(function (s, k) { var l = lineOf(k); return s + (l ? l.price * cart[k] : 0); }, 0);
}
function priceLabel(i) {
  var prices = (i.options || []).map(function (o) { return Number(o.price) || 0; }).filter(Boolean);
  if (!prices.length) return i.price ? money(i.price) : '';
  var min = Math.min.apply(null, prices);
  return money(min) + (Math.max.apply(null, prices) > min ? '+' : '');
}
function openOptions(id) {
  var i = MENU[id];
  sheetMode = 'opts';
  $('sheet').innerHTML = '<h2>' + esc(tr(i.name)) + '</h2>' + i.options.map(function (o) {
    return '<button class="big ghost" data-opt="' + esc(id + '|' + o.key) + '">' + esc(tr(o.label)) + ' · ' + money(o.price) + '</button>';
  }).join('') + '<button class="big ghost" data-close="1">' + t('close') + '</button>';
  $('cart').className = 'overlay show';
}

function renderFooter() {
  $('callBtn').textContent = t('call');
  $('billBtn').textContent = t('bill');
  var n = cartCount();
  $('cartBtn').textContent = t('cart') + (n ? ' (' + n + ') · ' + money(cartTotal()) : '');
}

function renderCart() {
  sheetMode = 'cart';
  var lines = Object.keys(cart).filter(function (k) { return lineOf(k); }).map(function (k) {
    var l = lineOf(k);
    return '<div class="line"><span class="n">' + esc(l.name) + '</span>' +
      '<span class="qty"><button data-dec="' + esc(k) + '">−</button> ' + cart[k] + ' <button data-inc="' + esc(k) + '">+</button></span>' +
      '<span class="price">' + money(l.price * cart[k]) + '</span></div>';
  }).join('');
  var ordered = state.orders.map(function (o) {
    return '<div class="line"><span class="n">' + o.items.map(function (i) { return i.qty + ' × ' + esc(tr(i.name)); }).join(', ') +
      '</span><span class="status">' + t(o.status) + '</span></div>';
  }).join('');
  $('sheet').innerHTML = '<h2>' + t('cart') + '</h2>' + (lines || '<p class="status">' + t('empty') + '</p>') +
    (lines ? '<p><b>' + t('total') + ': ' + money(cartTotal()) + '</b></p><button class="big" data-send="1">' + t('send') + '</button>' : '') +
    (ordered ? '<h3>' + t('ordered') + '</h3>' + ordered : '') +
    '<button class="big ghost" data-close="1">' + t('close') + '</button>';
}

function sendOrder() {
  if (sending) return;
  sending = true;
  var items = Object.keys(cart).map(function (k) { var p = k.split('|'); return { id: p[0], opt: p[1] || '', qty: cart[k] }; });
  post('/api/guest/order', { items: items }).then(function (o) {
    if (!o.id) return;
    cart = {};
    seen[o.id] = o.status;
    $('cart').className = 'overlay';
    toast(t('sent'));
    renderAll();
    load();
  }).catch(function () {}).then(function () { sending = false; });
}

function call(type) {
  post('/api/guest/call', { type: type }).then(function (c) {
    if (c.id) { seen[c.id] = c.status; toast(t('called')); }
  }).catch(function () {});
}

document.addEventListener('click', function (e) {
  // Экран простоя: язык, вызов официанта или переход к меню; касание в любом другом месте — тоже к меню
  if (e.target.closest('#attract')) {
    var a = e.target.closest('button');
    if (a && a.dataset.alang) { lang = a.dataset.alang; renderAll(); return; }
    hideAttract();
    if (a && a.id === 'aCall') call('waiter');
    return;
  }
  var b = e.target.closest('button');
  if (!b || !state) return;
  var d = b.dataset;
  if (d.lang) { lang = d.lang; renderAll(); }
  else if (d.cat) { cat = d.cat; renderAll(); }
  else if (d.add) { if ((MENU[d.add].options || []).length) openOptions(d.add); else { cart[d.add] = (cart[d.add] || 0) + 1; renderAll(); } }
  else if (d.opt) { cart[d.opt] = (cart[d.opt] || 0) + 1; $('cart').className = 'overlay'; renderAll(); }
  else if (d.inc) { cart[d.inc]++; renderCart(); renderAll(); }
  else if (d.dec) { if (--cart[d.dec] <= 0) delete cart[d.dec]; renderCart(); renderAll(); }
  else if (d.send) sendOrder();
  else if (d.close) $('cart').className = 'overlay';
  else if (b.id === 'cartBtn') { renderCart(); $('cart').className = 'overlay show'; }
  else if (b.id === 'callBtn') call('waiter');
  else if (b.id === 'billBtn') call('bill');
});

document.addEventListener('pointerdown', function () { lastTouch = Date.now(); }, true);

// Простой: через минуту — карусель акций, через 3 минуты — сброс языка и неотправленной корзины
setInterval(function () {
  if (!state) return;
  var idle = Date.now() - lastTouch;
  if (idle > IDLE_RESET_MS && (cartCount() || lang !== defLang())) {
    cart = {};
    lang = defLang();
    $('cart').className = 'overlay';
    renderAll();
  }
  var slides = state.slides || [], ds = state.display || {};
  if (idle > (ds.idleSec || 60) * 1000 && slides.length) {
    var a = $('attract');
    if (a.style.display !== 'block' || Date.now() - slideAt >= (ds.slideSec || 7) * 1000) {
      slideAt = Date.now();
      styleCaption(ds);
      var p = slides[slide++ % slides.length];
      $('aImg').src = p.image;
      $('aName').textContent = tr(p.title) + (p.price ? ' · ' + money(p.price) : '');
      $('aText').textContent = tr(p.text) || t('touch');
      $('aTag').style.display = p.type === 'ad' ? 'block' : 'none';
      if (p.type === 'ad') post('/api/guest/impression', { id: p.id }).catch(function () {});
    }
    a.style.display = 'block';
  }
}, 1000);

load();
setInterval(load, 5000);
</script>
</body>
</html>
