<!-- Пишем под старый WebView на Android 11: var и function, без ?., ??, aspect-ratio, inset, flex-gap и CSS grid -->
<style>
  :root { --bg: #f7f3ee; --card: #fff; --ink: #1f1a17; --muted: #8a7f76; --accent: #c8553d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans Thai", "Noto Sans SC", sans-serif; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; padding: 14px 16px; background: var(--card); }
  header h1 { font-size: 26px; margin: 0; flex: 1; }
  /* Круглая кнопка чата с ИИ-персонажем — между кнопками внизу */
  .avchat { flex: none !important; width: 72px; height: 72px; border-radius: 50% !important; padding: 0 !important; overflow: hidden; background: #f9e7d2 !important; border: 3px solid var(--accent) !important; align-self: center; }
  .avchat img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  #attract .avchat { width: 11vw; height: 11vw; margin: 0 1vw; }
  .langs button { border: 1px solid #ddd; background: none; border-radius: 10px; padding: 10px 14px; font-size: 18px; margin-left: 8px; color: var(--ink); }
  .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #cats { white-space: nowrap; overflow-x: auto; padding: 10px 12px; background: var(--card); box-shadow: 0 1px 0 rgba(0,0,0,.06); flex: none; }
  #cats button { display: inline-block; border: 1px solid #e3d9cf; background: var(--bg); color: var(--ink); border-radius: 24px; padding: 12px 18px; font-size: 18px; margin-right: 8px; }
  #cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; }
  #items { flex: 1; overflow-y: auto; padding: 8px; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .item { flex: none; width: calc(50% - 16px); margin: 8px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .item img, .ph { width: 100%; height: 260px; object-fit: cover; background: #eee4da; display: block; }
  .item .b { padding: 12px 14px 14px; }
  .item .n { font-weight: 600; font-size: 21px; line-height: 1.25; margin-bottom: 6px; }
  .item .d { color: var(--muted); font-size: 15px; line-height: 1.3; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; min-height: 48px; }
  .price { font-weight: 700; font-size: 22px; white-space: nowrap; }
  .add { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  @media (min-width: 1000px) { .item { width: calc(33.333% - 16px); } }
  footer { display: flex; padding: 12px 16px; background: var(--card); box-shadow: 0 -1px 0 rgba(0,0,0,.06); flex: none; }
  footer button { flex: 1; border: 0; border-radius: 14px; font-size: 20px; font-weight: 600; padding: 22px 8px; margin-left: 12px; background: #efe7df; color: var(--ink); }
  footer button:first-child { margin-left: 0; }
  footer .main { background: var(--accent); color: #fff; }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 4; }
  .overlay.show { display: flex; }
  .sheet { background: var(--card); width: 680px; max-width: 100%; max-height: 88%; overflow: auto; border-radius: 20px 20px 0 0; padding: 22px; font-size: 18px; }
  .sheet h2 { margin: 0 0 8px; }
  .line { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .line .n { flex: 1; padding-right: 10px; }
  .qty { white-space: nowrap; margin-right: 12px; }
  .qty button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid #ddd; background: none; font-size: 22px; color: var(--ink); }
  .order { background: var(--bg); border-radius: 14px; padding: 6px 14px 12px; margin-top: 12px; }
  .order .line { border-color: #e6ddd3; }
  .ohead { display: flex; justify-content: space-between; padding: 10px 0 4px; color: var(--muted); font-size: 16px; }
  .total { display: flex; justify-content: space-between; font-weight: 700; padding-top: 10px; }
  .grand { display: flex; justify-content: space-between; font-weight: 700; font-size: 22px; padding: 16px 2px 0; }
  .big { width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 600; background: var(--accent); color: #fff; margin-top: 14px; }
  .big.ghost { background: #efe7df; color: var(--ink); }
  .status { font-size: 15px; color: var(--muted); }
  #toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 16px 24px; border-radius: 14px; font-size: 20px; display: none; z-index: 30; text-align: center; max-width: 90%; }
  #offline { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: #c62828; color: #fff; text-align: center; padding: 10px; font-size: 18px; display: none; }
  #msg { display: none; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; line-height: 1.6; }

  /* Экран простоя: тёмные планки сверху (название, языки) и снизу (точки, кнопки), между ними — карусель.
     Размеры в долях экрана (1vw = 8 px при ширине 800), поэтому на любом планшете и в предпросмотре всё одинаково. */
  #attract { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #141110; display: none; z-index: 10; color: #fff; overflow: hidden; }
  .atop { position: absolute; top: 0; left: 0; right: 0; height: 8vh; display: flex; align-items: center; padding: 0 2.5vw; }
  .atop b { flex: 1; font-size: 3.2vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #aLangs button { font-size: 2.4vw; padding: 1.2vw 2vw; margin-left: 1vw; border-radius: 1.5vw; border: 0; background: rgba(255,255,255,.14); color: #fff; }
  #aLangs button.on { background: var(--accent); }
  .astage { position: absolute; top: 8vh; bottom: 15vh; left: 0; right: 0; overflow: hidden; background: #000; }
  #ctrack { position: absolute; top: 0; bottom: 0; left: 0; width: 300%; display: flex; }
  .slide { position: relative; width: 33.3333%; height: 100%; overflow: hidden; flex: none; }
  .slide .bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Поля вокруг картинки («показать целиком», сдвиг, уменьшение) — её же размытая копия */
  .slide .bgblur { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; -webkit-filter: blur(3vw) brightness(.55); filter: blur(3vw) brightness(.55); transform: scale(1.15); }
  .slide .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 12vw 4vw 4vw; }
  .slide .cap b { display: block; line-height: 1.2; }
  .slide .cap span { display: block; margin-top: 1vw; opacity: .92; }
  .slide .tag { position: absolute; top: 2vw; left: 2.5vw; background: rgba(0,0,0,.55); padding: .8vw 1.5vw; border-radius: 1vw; font-size: 1.9vw; z-index: 1; }
  /* Блок с QR-кодом и телефоном: 4 ряда по вертикали × 3 столбца */
  .contact { position: absolute; background: #fff; color: var(--ink); border-radius: 2vw; padding: 1.5vw; text-align: center; max-width: 40vw; }
  .contact.row-top { top: 3%; } .contact.row-upper { top: 27%; } .contact.row-lower { top: 51%; } .contact.row-bottom { bottom: 4%; }
  .contact.col-left { left: 3vw; } .contact.col-right { right: 3vw; } .contact.col-center { left: 50%; transform: translateX(-50%); }
  .contact.row-upper.col-left, .contact.row-lower.col-left { left: 11vw; }
  .contact.row-upper.col-right, .contact.row-lower.col-right { right: 11vw; }
  .contact .qr svg { width: 24.5vw; height: 24.5vw; display: block; margin: 0 auto; }
  .contact.size-s .qr svg { width: 16vw; height: 16vw; } .contact.size-l .qr svg { width: 32.5vw; height: 32.5vw; }
  .contact .small { font-size: 1.9vw; margin-top: .5vw; }
  .contact .phone { font-size: 2.75vw; font-weight: 700; margin-top: 1vw; white-space: nowrap; }
  .contact.size-s .phone { font-size: 2.1vw; }
  .arrow { position: absolute; top: 50%; margin-top: -4vw; width: 8vw; height: 8vw; border-radius: 4vw; border: 0; background: rgba(0,0,0,.3); color: #fff; font-size: 5vw; line-height: 7.5vw; padding: 0; z-index: 2; }
  .arrow.left { left: 1.5vw; } .arrow.right { right: 1.5vw; }
  .abottom { position: absolute; left: 0; right: 0; bottom: 0; height: 15vh; padding: 0 2vw; display: flex; flex-direction: column; justify-content: center; }
  #cdots { text-align: center; height: 1.25vw; margin-bottom: 1.8vh; }
  #cdots i { display: inline-block; width: 1.25vw; height: 1.25vw; border-radius: .7vw; background: rgba(255,255,255,.35); margin: 0 .5vw; vertical-align: top; }
  #cdots i.on { background: #fff; width: 3.25vw; }
  #attract .acts { display: flex; }
  #attract .abtn { flex: 1; margin: 0 1vw; border: 0; border-radius: 2.25vw; padding: 2.6vh 1.5vw; font-size: 3vw; font-weight: 700; background: #fff; color: var(--ink); }
  #attract .abtn.main { background: var(--accent); color: #fff; }

  /* ИИ-персонаж: картинка и «пузырь» с репликой, как в комиксе */
  .avatar { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(#f9e7d2, #f2c9a5); color: var(--ink); }
  .avatar .char { position: absolute; left: 50%; bottom: 0; height: 64%; transform: translateX(-50%); }
  .bubble { position: absolute; left: 3vw; right: 3vw; top: 3%; background: #fff; border-radius: 3.25vw; padding: 2.75vw 3vw; box-shadow: 0 .75vw 2.5vw rgba(0,0,0,.15); }
  .bubble:after { content: ''; position: absolute; left: 50%; bottom: -2.75vw; margin-left: -2.25vw; border: 2.25vw solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble .say { font-size: 3.25vw; line-height: 1.35; margin: 0 0 .75vw; }
  .bubble .who { color: var(--accent); font-weight: 700; font-size: 2.25vw; }
  .bubble button { display: inline-block; border: 0; border-radius: 2.75vw; background: #efe7df; color: var(--ink); padding: 1.75vw 2.25vw; font-size: 2.4vw; margin: 1vw 1vw 0 0; }
</style>

function request(path, options) {
  return new Promise(function (resolve, reject) {
    var timer = setTimeout(function () { setOnline(false); reject(new Error('timeout')); }, 8000);
    fetch(path, options).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(timer); setOnline(true); resolve(j); },
      function (e) { clearTimeout(timer); setOnline(false); reject(e); });
  });
}

function post(path, body) {
  body.d = D;
  return request(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
}

function setOnline(on) {
  online = on;
  $('offline').textContent = t('offlineBar');
  $('offline').style.display = on ? 'none' : 'block';
}

function load() {
  return request('/api/guest/state?d=' + encodeURIComponent(D)).then(function (s) {
    if (s.unassigned) {
      show('app', false); show('msg', true);
      $('msg').innerHTML = 'JET MEDIA<br>Устройство не привязано к столу<br>Device is not assigned to a table<br><small>' + esc(D) + '</small>';
      return;
    }
    show('msg', false); show('app', true);
    // Вышла новая версия интерфейса — перезагружаемся, но не посреди заказа
    if (BUILD && s.build && s.build !== BUILD && !cartCount() && Date.now() - lastTouch > 30000) { location.reload(); return; }
    BUILD = BUILD || s.build;
    var first = !state;
    state = s;
    state.calls = s.calls || [];
    state.orders = s.orders || [];
    if (!lang) lang = defLang();
    notifyChanges(first);
    var sig = JSON.stringify(s.menu) + s.restaurant.name + s.mode;
    if (sig !== menuSig) {
      menuSig = sig;
      MENU = {};
      s.menu.forEach(function (i) { MENU[i.id] = i; });
      renderAll();
    } else renderFooter();
    if (sheetMode === 'cart' && $('cart').className.indexOf('show') >= 0) renderCart();
    if (first && isEntrance()) showAttract();
  }).catch(function () { /* нет сети — пробуем снова через 5 с */ });
}

// Гостю показываем, когда официант идёт, подтвердил или изменил заказ
function notifyChanges(first) {
  state.calls.concat(state.orders).forEach(function (x) {
    var prev = seen[x.id] || '';
    var now = x.status + '|' + (x.editedAt || '');
    seen[x.id] = now;
    if (first || prev === now) return;
    if (prev.split('|')[1] !== String(x.editedAt || '') && x.editedAt) toast(t('edited'));
    else if (x.status === 'ack') toast(t('coming'));
    else if (x.status === 'confirmed') toast(t('confirmed'));
  });
}

// ---------- Меню

function categories() {
  var known = {}, out = state.menu.some(function (i) { return i.dayDish; }) ? [DAY] : [];
  state.menu.forEach(function (i) { var c = tr(i.cat) || '—'; if (!known[c]) { known[c] = 1; out.push(c); } });
  return out;
}

function renderAll() {
  $('title').textContent = state.restaurant.name;
  $('langs').innerHTML = (state.restaurant.langs || ['en']).map(function (l) {
    return '<button data-lang="' + l + '" class="' + (l === lang ? 'on' : '') + '">' + (LANG_NAMES[l] || l) + '</button>';
  }).join('');
  var list = categories();
  if (list.indexOf(cat) < 0) cat = list[0];
  $('cats').innerHTML = list.map(function (c) {
    return '<button data-cat="' + esc(c) + '" class="' + (c === cat ? 'on' : '') + '">' + esc(c === DAY ? t('day') : c) + '</button>';
  }).join('');
  $('items').innerHTML = '<div class="grid">' + state.menu.filter(function (i) { return cat === DAY ? i.dayDish : (tr(i.cat) || '—') === cat; }).map(function (i) {
    return '<div class="item">' + (i.photo ? '<img src="' + esc(i.photo) + '" alt="">' : '<div class="ph"></div>') +
      '<div class="b"><div class="n">' + esc(tr(i.name)) + '</div><div class="d">' + esc(tr(i.desc)) + '</div>' +
      '<div class="row"><span class="price">' + priceLabel(i) + '</span>' +
      (isEntrance() ? '' : '<button class="add" data-add="' + esc(i.id) + '">' + t('add') + (inCart(i.id) ? ' · ' + inCart(i.id) : '') + '</button>') +
      '</div></div></div>';
  }).join('') + '</div>';
  renderFooter();
  if ($('attract').style.display === 'block') renderAttract();
}

function avatarChatBtn() {
  var a = state.avatar;
  return a ? '<button class="avchat" data-avchat="1" title="' + esc(tr(a.name)) + '"><img src="' + esc(a.images.idle) + '" alt=""></button>' : '';
}

function renderFooter() {
  if (isEntrance()) {
    $('foot').innerHTML = '<button class="main" id="backBtn">' + t('back') + '</button>' + avatarChatBtn();
    return;
  }
  var n = cartCount();
  $('foot').innerHTML = '<button id="callBtn">' + t('call') + '</button><button id="billBtn">' + t('bill') + '</button>' +
    avatarChatBtn() + '<button class="main" id="cartBtn">' + t('cart') + (n ? ' (' + n + ') · ' + money(cartTotal()) : '') + '</button>';
}

function priceLabel(i) {
  var prices = (i.options || []).map(function (o) { return Number(o.price) || 0; }).filter(Boolean);
  if (!prices.length) return i.price ? money(i.price) : '';
  var min = Math.min.apply(null, prices);
  return money(min) + (Math.max.apply(null, prices) > min ? '+' : '');
}

// ---------- Корзина и заказы

function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
function inCart(id) { var n = 0; for (var k in cart) if (k.split('|')[0] === id) n += cart[k]; return n; }

function lineOf(key) {
  var p = key.split('|'), i = MENU[p[0]];
  if (!i) return null;
  var o = p[1] ? (i.options || []).filter(function (x) { return x.key === p[1]; })[0] : null;
  if (p[1] && !o) return null;
  return { price: Number(o ? o.price : i.price) || 0, name: tr(i.name) + (o ? ' · ' + tr(o.label) : '') };
}

function cartTotal() {
  return Object.keys(cart).reduce(function (s, k) { var l = lineOf(k); return s + (l ? l.price * cart[k] : 0); }, 0);
}

function openOptions(id) {
  var i = MENU[id];
  sheetMode = 'opts';
  $('sheet').innerHTML = '<h2>' + esc(tr(i.name)) + '</h2>' + i.options.map(function (o) {
    return '<button class="big ghost" data-opt="' + esc(id + '|' + o.key) + '">' + esc(tr(o.label)) + ' · ' + money(o.price) + '</button>';
  }).join('') + '<button class="big ghost" data-close="1">' + t('close') + '</button>';
  $('cart').className = 'overlay show';
}

function renderCart() {
  sheetMode = 'cart';
  var lines = Object.keys(cart).filter(function (k) { return lineOf(k); }).map(function (k) {
    var l = lineOf(k);
    return '<div class="line"><span class="n">' + esc(l.name) + '</span>' +
      '<span class="qty"><button data-dec="' + esc(k) + '">−</button> ' + cart[k] + ' <button data-inc="' + esc(k) + '">+</button></span>' +
      '<span class="price">' + money(l.price * cart[k]) + '</span></div>';
  }).join('');
  // Уже отправленные заказы: каждое блюдо отдельной строкой с ценой, итог заказа и итог по столу
  var active = state.orders.filter(function (o) { return o.status !== 'rejected'; });
  var grand = active.reduce(function (s, o) { return s + o.total; }, 0);
  var ordered = state.orders.map(function (o, n) {
    return '<div class="order"><div class="ohead"><span>' + t('order') + ' ' + (n + 1) + '</span><span>' + t(o.status) + '</span></div>' +
      o.items.map(function (i) {
        return '<div class="line"><span class="n">' + i.qty + ' × ' + esc(tr(i.name)) + '</span><span class="price">' + money(i.price * i.qty) + '</span></div>';
      }).join('') +
      '<div class="total"><span>' + t('total') + '</span><span>' + money(o.total) + '</span></div></div>';
  }).join('');
  $('sheet').innerHTML = '<h2>' + t('cart') + '</h2>' + (lines || '<p class="status">' + t('empty') + '</p>') +
    (lines ? '<div class="total"><span>' + t('total') + '</span><span>' + money(cartTotal()) + '</span></div><button class="big" data-send="1">' + t('send') + '</button>' : '') +
    (ordered ? '<h3>' + t('ordered') + '</h3>' + ordered + '<div class="grand"><span>' + t('tableTotal') + '</span><span>' + money(grand) + '</span></div>' : '') +
    '<button class="big ghost" data-close="1">' + t('close') + '</button>';
}

function sendOrder() {
  if (sending) return;
  sending = true;
  var items = Object.keys(cart).map(function (k) { var p = k.split('|'); return { id: p[0], opt: p[1] || '', qty: cart[k] }; });
  post('/api/guest/order', { items: items }).then(function (o) {
    if (!o.id) return;
    cart = {};
    seen[o.id] = o.status + '|';
    $('cart').className = 'overlay';
    toast(t('sent'));
    renderAll();
    load();
  }).catch(function () { toast(t('offline')); }).then(function () { sending = false; });
}

function call(type) {
  if (isEntrance() || PREVIEW) return;
  if (!online) toast(t('offline'));
  post('/api/guest/call', { type: type }).then(function (c) {
    if (c.id) { seen[c.id] = c.status + '|'; toast(t('called')); }
  }).catch(function () { toast(t('offline')); });
}

// ---------- Карусель акций, рекламы и ИИ-персонажа

function slides() { return (state && state.slides) || []; }
function width() { return $('attract').clientWidth; }

function qrSvg(text) {
  try {
    var q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createSvgTag(4, 8);
  } catch (e) { return ''; }
}

function slideHtml(s, current) {
  if (!s) return '';
  if (s.type === 'avatar') return avatarHtml(current);
  return frameHtml(s) +
    (s.type === 'ad' ? '<span class="tag">' + t('ad') + '</span>' : '') +
    (s.qr || s.phone ? '<div class="contact ' + qrClass(s.qrPos) + ' size-' + (s.qrSize || 'm') + '">' +
      (s.qr ? '<div class="qr">' + qrSvg(s.qr) + '</div><div class="small">' + t('scan') + '</div>' : '') +
      (s.phone ? '<div class="phone">📞 ' + esc(s.phone) + '</div>' : '') + '</div>' : '') +
    (tr(s.title) || tr(s.text) ? '<div class="cap"><b>' + esc(tr(s.title)) + (s.price ? ' · ' + money(s.price) : '') + '</b><span>' + esc(tr(s.text)) + '</span></div>' : '');
}

// Картинка слайда с кадром из настроек: режим, сдвиг по вертикали, масштаб
// Сдвиг выбирает, какую часть исходной картинки показать (вниз — открывается верх картинки),
// масштаб увеличивает или уменьшает вокруг этой точки
function frameHtml(s) {
  var y = 50 - (Number(s.imgY) || 0), scale = (Number(s.imgScale) || 100) / 100;
  var fit = s.fit === 'contain' ? 'contain' : 'cover';
  var style = 'object-fit:' + fit + ';object-position:50% ' + y + '%;-webkit-transform-origin:50% ' + y + '%;transform-origin:50% ' + y + '%;' +
    '-webkit-transform:scale(' + scale + ');transform:scale(' + scale + ')';
  // Размытая подложка нужна, только если картинка не закрывает область целиком — так дешевле для планшета
  var gaps = fit === 'contain' || scale < 1;
  return (gaps ? '<img class="bgblur" src="' + esc(s.image) + '" alt="">' : '') +
    '<img class="bg" src="' + esc(s.image) + '" alt="" style="' + style + '">';
}

// «top-right» → ряд top, столбец right; старые «middle-…» — это ряд «выше центра»
function qrClass(pos) {
  var p = String(pos || 'top-right').replace('middle', 'upper').split('-');
  return 'row-' + p[0] + ' col-' + (p[1] || 'right');
}

// Слева — следующий слайд, справа — предыдущий: показ «переезжает» слева направо
function renderCarousel() {
  var list = slides(), n = list.length;
  if (!n && !state.avatar) return;
  if (!state.avatar) avShowing = false;
  if (!n) avShowing = true;
  if (n) cIdx = ((cIdx % n) + n) % n;
  var cur = avShowing ? AV : list[cIdx];
  // Слева — следующий слайд (или персонаж, если подошло его время), справа — предыдущий: показ едет слева направо
  cNext = avatarDue() ? AV : n ? list[(cIdx + 1) % n] : null;
  cPrev = n ? (avShowing ? list[cIdx] : list[(cIdx - 1 + n) % n]) : null;
  if (cNext === cur) cNext = null;
  if (cPrev === cur) cPrev = null;
  $('ctrack').innerHTML = '<div class="slide">' + slideHtml(cNext) + '</div>' +
    '<div class="slide" id="curSlide">' + slideHtml(cur, true) + '</div>' +
    '<div class="slide">' + slideHtml(cPrev) + '</div>';
  setTrack(0, false);
  $('cdots').innerHTML = n > 1 ? list.map(function (s, i) { return '<i class="' + (!avShowing && i === cIdx ? 'on' : '') + '"></i>'; }).join('') : '';
  styleCaptions(state.display || {});
  onSlideShown(cur);
}

function avatarDue() {
  var a = state.avatar;
  return avatarAuto() && !avShowing && Date.now() - lastAvatarAt >= (a.everyMin || 3) * 60000;
}

// Сам по расписанию персонаж приходит, пока стол ничего не заказал и гость не ответил «уже заказали»
// (через 45 минут после такого ответа — снова, это уже могут быть другие гости). По кнопке чата — всегда.
var avDismissedAt = 0;
function avatarAuto() {
  return !!state.avatar && !(state.orders || []).length && Date.now() - avDismissedAt > 45 * 60000;
}

function setTrack(dx, animate) {
  var tk = $('ctrack');
  tk.style.transition = animate ? 'transform .6s ease' : 'none';
  tk.style.transform = 'translateX(' + (dx - width()) + 'px)';
}

// dir = 1 — следующий (лента уезжает вправо), -1 — предыдущий
function slideGo(dir) {
  if (cBusy) return;
  // Время персонажа подошло, пока показывался текущий слайд, — подставляем его следующим
  if (dir > 0 && avatarDue() && cNext !== AV) {
    cNext = AV;
    $('ctrack').firstChild.innerHTML = slideHtml(AV);
  }
  var target = dir > 0 ? cNext : cPrev;
  if (!target) { setTrack(0, true); return; }
  cBusy = true;
  stopSpeech();
  setTrack(dir > 0 ? width() : -width(), true);
  setTimeout(function () {
    var n = slides().length;
    if (target === AV) avShowing = true;
    else if (dir > 0) { if (n) cIdx = avShowing && target === slides()[cIdx] ? cIdx : (cIdx + 1) % n; avShowing = false; }
    else if (avShowing) avShowing = false;
    else if (n) cIdx = (cIdx - 1 + n) % n;
    cBusy = false;
    renderCarousel();
  }, 620);
}

function onSlideShown(s) {
  slideAt = Date.now();
  if (s.type === 'ad' && !PREVIEW) post('/api/guest/impression', { id: s.id }).catch(function () {});
  if (s.type === 'avatar') {
    lastAvatarAt = Date.now();
    holdUntil = Math.max(holdUntil, Date.now() + (state.avatar.durationSec || 20) * 1000);
    avatarStart();
  }
}

// Оформление подписей слайдов из настроек менеджера
function styleCaptions(ds) {
  var hex = /^#[0-9a-f]{6}$/i.test(ds.bgColor) ? ds.bgColor : '#000000';
  var rgb = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(',');
  var caps = document.querySelectorAll('#ctrack .cap');
  for (var i = 0; i < caps.length; i++) {
    caps[i].style.color = ds.textColor || '#fff';
    caps[i].style.background = 'linear-gradient(rgba(' + rgb + ',0), rgba(' + rgb + ',.88) 45%)';
    caps[i].querySelector('b').style.fontSize = (ds.titleSize || 38) / 8 + 'vw';
    caps[i].querySelector('span').style.fontSize = (ds.textSize || 22) / 8 + 'vw';
  }
}

function renderAttract() {
  $('aTitle').textContent = state.restaurant.name;
  $('acts').innerHTML = (isEntrance() ? '' : '<button class="abtn" id="aCall">' + t('call') + '</button>') +
    avatarChatBtn() + '<button class="abtn main" id="aMenu">' + t('menu') + '</button>';
  $('aLangs').innerHTML = (state.restaurant.langs || ['en']).map(function (l) {
    return '<button data-alang="' + l + '" class="' + (l === lang ? 'on' : '') + '">' + (LANG_NAMES[l] || l) + '</button>';
  }).join('');
  renderCarousel();
}

// index — номер слайда или 'avatar'; без него — обычный старт показа (с персонажа, если так настроено)
function showAttract(index) {
  var a = state.avatar;
  if (!slides().length && !a) return;
  if (index === 'avatar') avShowing = true;
  else if (index !== undefined) { cIdx = index; avShowing = false; }
  else {
    avShowing = !!(a && a.startWith && avatarAuto());
    if (a && !avShowing) lastAvatarAt = Date.now();
  }
  $('attract').style.display = 'block';
  holdUntil = 0;
  renderAttract();
}

function hideAttract() {
  if (PREVIEW) return;
  stopSpeech();
  $('attract').style.display = 'none';
  lastTouch = Date.now();
}

// Листание пальцем: вправо — следующий слайд, влево — предыдущий
$('attract').addEventListener('touchstart', function (e) {
  if (e.target.closest('button')) return;
  cDrag = { x: e.touches[0].clientX, dx: 0 };
}, { passive: true });
$('attract').addEventListener('touchmove', function (e) {
  if (!cDrag || cBusy) return;
  cDrag.dx = e.touches[0].clientX - cDrag.x;
  if (Math.abs(cDrag.dx) > 10) setTrack(cDrag.dx, false);
}, { passive: true });
$('attract').addEventListener('touchend', function () {
  if (!cDrag) return;
  var dx = cDrag.dx;
  cDrag = null;
  holdUntil = Date.now() + HOLD_AFTER_SWIPE_MS;
  if (dx > 60) slideGo(1);
  else if (dx < -60) slideGo(-1);
  else setTrack(0, true);
});

// ---------- ИИ-персонаж: говорит голосом через динамик и дублирует реплику в «пузыре»; гость отвечает кнопками

var avNode = null, avTalkTimer = null, avDoneTimer = null;

// У соседних (уезжающих) слайдов персонаж без id: управляем только текущим
function avatarHtml(current) {
  var a = state.avatar, id = function (name) { return current ? ' id="' + name + '"' : ''; };
  return '<div class="avatar"><img class="char"' + id('avImg') + ' src="' + esc(a.images.idle) + '" alt="">' +
    '<div class="bubble"><div class="who">' + esc(tr(a.name)) + '</div><p class="say"' + id('avSay') + '>' +
    (current ? '' : esc(tr(a.greeting))) + '</p><div' + id('avOpts') + '></div></div></div>';
}

function avatarStart() {
  var d = state.avatar.dialog || {};
  avatarShow((d.nodes || {})[d.start] ? d.start : 'hello', true);
}

// Узел сценария: { say: {ru, en…}, buttons: [{ label: {…}, go: 'узел' | 'recommend' | 'menu' | 'waiter' | 'dish:<id>' }] }
// Узел сценария: { say: {ru, en…}, buttons: [{ label: {…}, go: 'узел' | 'recommend' | 'diet' | 'tag:<отметка>' | 'menu' | 'waiter' | 'dish:<id>' }] }
function avatarShow(id, greet) {
  var a = state.avatar, nodes = (a.dialog || {}).nodes || {}, node;
  if (id === 'recommend') node = recommendNode();
  else if (id.indexOf('tag:') === 0) node = recommendNode(id.slice(4));
  else if (id === 'diet') node = dietNode();
  else if (id === 'orderedReply') node = { say: t('needMe'), buttons: [{ label: t('menu'), go: 'menu' }] };
  else node = nodes[id];
  if (!node) {
    node = {
      say: a.greeting,
      buttons: [{ label: t('askRec'), go: 'recommend' }, { label: t('call'), go: 'waiter' }, { label: t('menu'), go: 'menu' }],
    };
  }
  var buttons = (node.buttons || []).slice();
  // Приветствие: случайная фраза менеджера; плюс кнопка особых пожеланий, если они включены
  var say = tr(node.say);
  if (greet) {
    avSuggested = [];
    if ((a.greetings || []).length) say = tr(a.greetings[Math.floor(Math.random() * a.greetings.length)]) || say;
    if ((a.filters || []).length) buttons.splice(1, 0, { label: t('diet'), go: 'diet' });
    if (!isEntrance()) buttons.push({ label: t('alreadyOrdered'), go: 'ordered' });
  }
  avNode = { buttons: buttons.filter(function (b) { return !(isEntrance() && b.go === 'waiter'); }) };
  if (!$('avSay')) return;
  $('avSay').textContent = say;
  $('avOpts').innerHTML = avNode.buttons.map(function (b, i) {
    return '<button data-av="' + i + '">' + esc(tr(b.label)) + '</button>';
  }).join('');
  speak(say);
}

function dietNode() {
  return {
    say: t('dietAsk'),
    buttons: (state.avatar.filters || []).map(function (f) { return { label: TAGS[f], go: 'tag:' + f }; })
      .concat([{ label: t('prev'), go: 'hello' }]),
  };
}

// Совет из меню: по отметке (без глютена, веганское…) или сначала блюда дня, потом случайные блюда.
// Уже предложенные в этом разговоре пропускаем; когда всё перебрали — начинаем заново.
function recommendNode(tag) {
  var pick = function () {
    var fresh = function (i) { return avSuggested.indexOf(i.id) < 0; };
    if (tag) return { list: state.menu.filter(function (i) { return (i.tags || []).indexOf(tag) >= 0 && fresh(i); }) };
    var day = state.menu.filter(function (i) { return i.dayDish && fresh(i); });
    if (day.length) return { list: day, day: true };
    var any = state.menu.filter(function (i) { return i.photo && fresh(i); });
    return { list: any.length ? any : state.menu.filter(fresh) };
  };
  var p = pick();
  if (!p.list.length && avSuggested.length) { avSuggested = []; p = pick(); }
  var dish = p.list[Math.floor(Math.random() * p.list.length)];
  if (!dish) return { say: t('noDish'), buttons: [{ label: t('call'), go: 'waiter' }, { label: t('prev'), go: 'hello' }] };
  avSuggested.push(dish.id);
  var lead = p.day ? t('dayRec') : t('recommend') + (tag ? ' (' + tr(TAGS[tag]) + ')' : '');
  return {
    say: lead + ': ' + tr(dish.name) + (dish.price ? ' — ' + money(dish.price) : '') + '!',
    buttons: [{ label: t('showDish'), go: 'dish:' + dish.id }, { label: t('another'), go: tag ? 'tag:' + tag : 'recommend' }, { label: t('menu'), go: 'menu' }],
  };
}

function avatarAction(go) {
  holdUntil = Date.now() + 30000;
  if (go === 'ordered') {
    avDismissedAt = Date.now();
    holdUntil = Date.now() + 8000; // договорит и уступит место карусели
    return avatarShow('orderedReply');
  }
  if (go === 'menu') return hideAttract();
  if (go === 'waiter') { call('waiter'); return; }
  if (go.indexOf('dish:') === 0) {
    var dish = MENU[go.slice(5)];
    hideAttract();
    if (dish) { cat = dish.dayDish ? DAY : tr(dish.cat) || '—'; renderAll(); }
    return;
  }
  avatarShow(go, go === ((state.avatar.dialog || {}).start || 'hello'));
}

function speak(text) {
  var a = state.avatar;
  if (!a || !a.speak || !text) return;
  var v = a.voice || {};
  talking(true);
  clearTimeout(avDoneTimer);
  // страховка: если окончание речи не пришло, через расчётное время закрываем рот
  avDoneTimer = setTimeout(function () { talking(false); }, Math.min(20000, 800 + text.length * 80));
  if (window.JetAgent && window.JetAgent.speak) {
    window.JetAgent.speak(text, SPEECH_LANG[lang] || 'en-US', v.pitch || 1, v.rate || 1);
  } else if (window.speechSynthesis) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LANG[lang] || 'en-US';
    u.pitch = v.pitch || 1;
    u.rate = v.rate || 1;
    u.onend = function () { talking(false); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}

// Агент на планшете сообщает, что фраза произнесена
window.jetSpeechDone = function () { talking(false); };

function stopSpeech() {
  talking(false);
  if (window.JetAgent && window.JetAgent.stop) window.JetAgent.stop();
  else if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// Пока персонаж говорит — меняем картинки «рот закрыт / открыт»
function talking(on) {
  clearInterval(avTalkTimer);
  var img = $('avImg'), a = state && state.avatar;
  if (!img || !a) return;
  img.src = a.images.idle;
  if (!on) return;
  var open = false;
  avTalkTimer = setInterval(function () {
    open = !open;
    if ($('avImg')) $('avImg').src = open ? a.images.talk : a.images.idle;
  }, 180);
}

// ---------- Касания

document.addEventListener('click', function (e) {
  if (!state) return;
  if (e.target.closest('#attract')) {
    var a = e.target.closest('button');
    holdUntil = Date.now() + HOLD_AFTER_SWIPE_MS;
    if (!a) return;
    if (a.dataset.alang) { lang = a.dataset.alang; renderAll(); }
    else if (a.dataset.cgo) slideGo(Number(a.dataset.cgo));
    else if (a.dataset.av !== undefined && avNode) avatarAction(avNode.buttons[Number(a.dataset.av)].go);
    else if (a.dataset.avchat) { if (!avShowing) { avShowing = true; renderCarousel(); } }
    else if (a.id === 'aMenu') hideAttract();
    else if (a.id === 'aCall') { hideAttract(); call('waiter'); }
    return;
  }
  var b = e.target.closest('button');
  if (!b) return;
  var d = b.dataset;
  if (d.lang) { lang = d.lang; renderAll(); }
  else if (d.cat) { cat = d.cat; renderAll(); }
  else if (d.add) { if ((MENU[d.add].options || []).length) openOptions(d.add); else { cart[d.add] = (cart[d.add] || 0) + 1; renderAll(); } }
  else if (d.opt) { cart[d.opt] = (cart[d.opt] || 0) + 1; $('cart').className = 'overlay'; renderAll(); }
  else if (d.inc) { cart[d.inc]++; renderCart(); renderAll(); }
  else if (d.dec) { if (--cart[d.dec] <= 0) delete cart[d.dec]; renderCart(); renderAll(); }
  else if (d.send) sendOrder();
  else if (d.close) $('cart').className = 'overlay';
  else if (b.id === 'cartBtn') { renderCart(); $('cart').className = 'overlay show'; }
  else if (b.id === 'callBtn') call('waiter');
  else if (b.id === 'billBtn') call('bill');
  else if (b.id === 'backBtn') showAttract();
  else if (d.avchat) showAttract('avatar');
});

document.addEventListener('pointerdown', function () { lastTouch = Date.now(); }, true);

// Простой: карусель после заданной паузы (у входа — всегда), автоперелистывание, сброс корзины и языка через 3 минуты
setInterval(function () {
  if (!state) return;
  var now = Date.now(), idle = now - lastTouch, ds = state.display || {};
  if (idle > IDLE_RESET_MS && (cartCount() || lang !== defLang())) {
    cart = {};
    lang = defLang();
    $('cart').className = 'overlay';
    renderAll();
  }
  var visible = $('attract').style.display === 'block';
  if (!visible && idle > (ds.idleSec || 60) * 1000 && slides().length) showAttract();
  else if (visible && now > holdUntil && now - slideAt >= (ds.slideSec || 7) * 1000) slideGo(1);
}, 1000);

if (PREVIEW) {
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.slide) return;
    var d = e.data;
    state = {
      restaurant: { name: '', langs: d.langs || ['ru', 'en', 'th', 'zh'] }, mode: 'table', menu: [], calls: [], orders: [],
      slides: [d.slide], display: d.display || {}, avatar: null,
    };
    lang = d.lang || state.restaurant.langs[0];
    show('msg', false);
    holdUntil = Date.now() + 3600000; // в предпросмотре слайд не листается сам
    showAttract(0);
    holdUntil = Date.now() + 3600000;
  });
} else {
  load();
  setInterval(load, 5000);
}
</script>
