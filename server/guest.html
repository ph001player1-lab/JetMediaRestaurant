<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Menu</title>
<link rel="icon" href="/favicon.svg">
<!-- Пишем под старый WebView на Android 11: var и function, без ?., ??, aspect-ratio, inset, flex-gap и CSS grid -->
<style>
  /* Цвета — из темы ресторана (вкладка «Дизайн» в ЛК менеджера), здесь — тема «Терракота» */
  :root { --bg: #f7f3ee; --card: #fff; --ink: #1f1a17; --muted: #8a7f76; --line: #e3d9cf; --soft: #efe7df; --accent: #c8553d; --accent-ink: #fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans Thai", "Noto Sans SC", sans-serif; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; padding: 14px 16px; background: var(--card); }
  header h1 { font-size: 26px; margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; }

  .atop .tno { color: #fff; font-size: 3.8vw; }
  .tno { flex: none; font-size: 30px; font-weight: 800; line-height: 1.2; white-space: nowrap; color: var(--ink); }
  /* номер стола на планшете — кнопка «О системе», оформлена как кнопки языков */
  button.tno { border: 1px solid var(--line); background: none; border-radius: 12px; padding: 6px 18px; font-family: inherit; cursor: pointer; }
  .atop button.tno { border: 0; background: rgba(255,255,255,.14); border-radius: 1.5vw; padding: 1.2vw 2.8vw; color: #fff; }
  .join .jt { font-size: 22px; font-weight: 700; }
  /* Круглая кнопка чата с ИИ-персонажем — между кнопками внизу */
  .avchat { flex: none !important; width: 72px; height: 72px; border-radius: 50% !important; padding: 0 !important; overflow: hidden; background: var(--soft) !important; border: 3px solid var(--accent) !important; align-self: center; }
  .avchat img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  #attract .avchat { width: 11vw; height: 11vw; margin: 0 1vw; }
  .langs button { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 10px 14px; font-size: 18px; margin-left: 8px; color: var(--ink); }
  .langs button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  /* Шапка меню на планшете — те же размеры и шрифты, что на заставке с рекламой (в долях экрана, а не в пикселях):
     на любом планшете номер стола, «Заказ с телефона» и языки помещаются в строку одинаково во всех видах меню */
  header { padding: 1.5vw 2.5vw; flex: none; } /* по высоте — по содержимому, поля сверху и снизу небольшие */
  header .tno { font-size: 3.8vw; } header button.tno { padding: 1.2vw 2.8vw; border-radius: 1.5vw; }
  .langs button { font-size: 2.4vw; padding: 1.2vw 2vw; margin-left: 1vw; border-radius: 1.5vw; }
  .langs .qrbtn { padding: 1vw 2vw; border-width: .3vw !important; }
  #cats { white-space: nowrap; overflow-x: auto; padding: 10px 12px; background: var(--card); box-shadow: 0 1px 0 rgba(0,0,0,.06); flex: none; }
  #cats button { display: inline-block; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 24px; padding: 12px 18px; font-size: 18px; margin-right: 8px; }
  #cats button.on { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; }
  #items { flex: 1; overflow-y: auto; padding: 8px; position: relative; }
  .mcat { margin: 14px 8px 2px; font-size: 22px; }
  .msec:first-child .mcat { margin-top: 4px; }
  body.phone .mcat { font-size: 18px; margin: 10px 6px 0; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .item { flex: none; width: calc(50% - 16px); margin: 8px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .item img, .ph { width: 100%; height: 260px; object-fit: cover; background: var(--soft); display: block; }
  .item .b { padding: 12px 14px 14px; }
  .item .n { font-weight: 600; font-size: 21px; line-height: 1.25; margin-bottom: 6px; }
  .item .d { color: var(--muted); font-size: 15px; line-height: 1.3; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; min-height: 48px; }
  .price { font-weight: 700; font-size: 22px; white-space: nowrap; }
  .add { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  @media (min-width: 1000px) { .item { width: calc(33.333% - 16px); } }
  footer { display: flex; padding: 12px 16px; background: var(--card); box-shadow: 0 -1px 0 rgba(0,0,0,.06); flex: none; }
  footer button { flex: 1; border: 0; border-radius: 14px; font-size: 20px; font-weight: 600; padding: 22px 8px; margin-left: 12px; background: var(--soft); color: var(--ink); }
  footer button:first-child { margin-left: 0; }
  footer .main { background: var(--accent); color: var(--accent-ink); }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 4; }
  .overlay.show { display: flex; }
  .sheet { background: var(--card); width: 680px; max-width: 100%; max-height: 88%; overflow: auto; border-radius: 20px 20px 0 0; padding: 22px; font-size: 18px; }
  .sheet h2 { margin: 0 0 8px; }
  .line { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line .n { flex: 1; padding-right: 10px; }
  .ltags { display: block; margin-top: 3px; font-size: 14px; color: var(--accent); }
  .ltags i { font-style: normal; margin-right: 10px; white-space: nowrap; }
  .qty { white-space: nowrap; margin-right: 12px; }
  .qty button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: none; font-size: 22px; color: var(--ink); }
  .order { background: var(--bg); border-radius: 14px; padding: 6px 14px 12px; margin-top: 12px; }
  .order .line { border-color: var(--line); }
  .ohead { display: flex; justify-content: space-between; padding: 10px 0 4px; color: var(--muted); font-size: 16px; }
  .total { display: flex; justify-content: space-between; font-weight: 700; padding-top: 10px; }
  .grand { display: flex; justify-content: space-between; font-weight: 700; font-size: 22px; padding: 16px 2px 0; }
  .big { width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 600; background: var(--accent); color: var(--accent-ink); margin-top: 14px; }
  .big.ghost { background: var(--soft); color: var(--ink); }
  /* блюдо с заказом через официанта: «Цена у официанта», кнопка «Спросить официанта» */
  .pask { font-size: .72em; font-weight: 600; color: var(--muted); white-space: normal; } .add.askw { white-space: normal; }
  .psku { margin: 6px 0 2px; font-size: 13px; color: var(--muted); }
  .paskh { margin: 8px 0 4px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 17px; }
  /* Особые пожелания: кнопка в ленте категорий и окно с вариантами */
  #cats button.diet { background: var(--soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
  #cats button.diet.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dietgrid { display: flex; flex-wrap: wrap; margin: 0 -6px; }
  .dietgrid button { flex: none; width: calc(50% - 12px); margin: 6px; text-align: left; border: 0; border-radius: 14px; padding: 16px; font-size: 19px; background: var(--soft); color: var(--ink); }
  .dietgrid button small { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .dietgrid button:disabled { background: var(--bg); color: var(--muted); opacity: .6; }
  .dietgrid button:disabled small { color: var(--muted); }
  .status { font-size: 15px; color: var(--muted); }
  /* Статус вызова — яркая полоса вверху экрана (и в меню, и на заставке); кнопки вызова — красные */
  #callBar { position: fixed; top: 0; left: 0; right: 0; height: 64px; line-height: 64px; z-index: 35; display: none; text-align: center;
    background: #e53935; color: #fff; font-size: 28px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 16px;
    box-shadow: 0 3px 14px rgba(0,0,0,.35); -webkit-animation: cbPulse 1.4s infinite; animation: cbPulse 1.4s infinite; }
  #callBar.go { background: #2e7d32; -webkit-animation: none; animation: none; }
  @-webkit-keyframes cbPulse { 50% { background: #ff1744; } }
  @keyframes cbPulse { 50% { background: #ff1744; } }
  body.calling #app { padding-top: 64px; }
  body.calling .atop { top: 64px; }
  body.calling .astage { top: calc(8vh + 64px); }
  /* неподанный заказ: янтарный — ждёт / готовится, зелёный — готово, несут; точка медленно мигает */
  footer button.ost-pending, footer button.ost-cooking, #attract .abtn.ost-pending, #attract .abtn.ost-cooking { background: #f5a623 !important; color: #1f1a17 !important; }
  footer button.ost-ready, #attract .abtn.ost-ready { background: #2e7d32 !important; color: #fff !important; }
  footer button.ost-served, #attract .abtn.ost-served { background: #1e88e5 !important; color: #fff !important; }
  footer button.ost-paid, #attract .abtn.ost-paid { background: #00796b !important; color: #fff !important; }
  footer button.ost-void, #attract .abtn.ost-void { background: #9e9e9e !important; color: #fff !important; }
  .ost:not(.ostsub)::before, .ostsub .osub::before { content: ''; display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: currentColor; margin-right: .45em; vertical-align: middle;
    -webkit-animation: ostp 1.6s ease-in-out infinite; animation: ostp 1.6s ease-in-out infinite; }
  @-webkit-keyframes ostp { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @keyframes ostp { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .osub { display: block; font-size: .62em; font-weight: 600; opacity: .9; margin-bottom: 2px; }
  footer button.alarm, #attract .abtn.alarm { background: #e53935 !important; color: #fff !important; box-shadow: 0 0 0 3px rgba(229,57,53,.35); }
  /* QR-код «Заказ с телефона»: кнопка вверху, крупный код на весь экран, подсказка в углу при первом касании */
  .qrbtn { border: 2px solid var(--accent) !important; color: var(--accent) !important; font-weight: 700; }
  /* на заставке — та же кнопка, что в меню: фон карточки, рамка и текст цвета темы */
  #aLangs .qrbtn { background: var(--card) !important; border: .3vw solid var(--accent) !important; color: var(--accent) !important; padding: 1vw 2vw; font-weight: 700; }
  #qrBox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 37; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; }
  #qrBox.show { display: flex; }
  .qrc { background: #fff; color: #1f1a17; border-radius: 24px; padding: 28px 28px 20px; width: 560px; max-width: 92%; text-align: center; font-size: 20px; line-height: 1.4; }
  .qrc h2 { margin: 0 0 6px; font-size: 30px; }
  .qrc svg { width: 340px; height: 340px; max-width: 70vw; max-height: 70vw; display: block; margin: 12px auto; }
  .qrc .muted { color: #8a7f76; font-size: 17px; }
  .qrc button { border: 0; border-radius: 14px; background: #1f1a17; color: #fff; font-size: 20px; padding: 16px 40px; margin-top: 14px; }
  /* кнопка мигает 5 раз после того, как в неё «залетел» QR-код */
  @-webkit-keyframes qrBlink { 50% { -webkit-transform: scale(1.12); transform: scale(1.12); box-shadow: 0 0 0 6px var(--accent); } }
  @keyframes qrBlink { 50% { -webkit-transform: scale(1.12); transform: scale(1.12); box-shadow: 0 0 0 6px var(--accent); } }
  .qrbtn.blink { -webkit-animation: qrBlink .6s ease-in-out 5; animation: qrBlink .6s ease-in-out 5; }
  /* Телефон гостя: экран «Как вас зовут?», компактное меню */
  .join { max-width: 420px; width: 100%; }
  .join h2 { margin: 0 0 4px; }
  .join input { width: 100%; font-size: 20px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); margin: 14px 0 10px; background: var(--card); color: var(--ink); }
  .join button { width: 100%; border: 0; border-radius: 14px; font-size: 19px; font-weight: 600; padding: 16px; margin-top: 8px; background: var(--accent); color: var(--accent-ink); }
  .join button.ghost { background: var(--soft); color: var(--ink); }
  body.phone header { padding: 10px 12px; }
  body.phone header h1 { font-size: 20px; }
  body.phone .tno { font-size: 22px; }
  body.phone .langs button { padding: 7px 9px; font-size: 14px; margin-left: 4px; border-radius: 10px; }
  body.phone #cats button { padding: 9px 13px; font-size: 15px; }
  body.phone .item { width: calc(50% - 10px); margin: 5px; }
  body.phone .item img, body.phone .ph { height: 150px; }
  body.phone .item .n { font-size: 16px; }
  body.phone .item .b { padding: 8px 10px 10px; }
  body.phone .price { font-size: 17px; }
  body.phone .add { padding: 10px 12px; font-size: 15px; }
  body.phone footer { padding: 8px; }
  body.phone footer button { font-size: 15px; padding: 16px 4px; margin-left: 6px; }
  body.phone #callBar { height: 46px; line-height: 46px; padding: 0 6px; }
  body.phone.calling #app { padding-top: 46px; }
  .gsum .line { padding: 6px 0; }
  .lmods { display: block; font-size: 15px; color: var(--muted); margin-top: 2px; }
  /* ---- Вид меню «Плитки» и «Каталог» (ЛК → Дизайн): разделы плиткой слева, поиск, группы. Классический — как раньше */
  #side, #mtop { display: none; }
  body.lay-tiles #side, body.lay-catalog #side { display: flex; flex-direction: column; gap: 10px; flex: none; padding: 12px 10px 0 14px; background: var(--card); border-right: 1px solid var(--line); min-height: 0; }
  /* колонка разделов — в одну плитку шириной; поиск и группы — строкой над меню; прокрутка только вертикальная */
  body.lay-tiles #side, body.lay-catalog #side { width: 128px; min-width: 0; overflow: hidden; padding: 10px 8px 0 10px; }
  body.lay-tiles #cats, body.lay-catalog #cats { display: grid; grid-template-columns: minmax(0, 1fr); white-space: normal; overflow-y: auto; overflow-x: hidden; padding: 2px 2px 14px; box-shadow: none; background: transparent; gap: 8px; align-content: start; grid-auto-rows: max-content; flex: 1; min-height: 0; min-width: 0; }
  body.lay-tiles #mtop, body.lay-catalog #mtop { display: flex; align-items: center; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
  body.lay-tiles #msearch, body.lay-catalog #msearch { flex: 1; min-width: 0; margin-right: 10px; }
  body.lay-tiles .mgroups, body.lay-catalog .mgroups { flex-wrap: nowrap; } body.lay-tiles .mgroups button, body.lay-catalog .mgroups button { margin: 0 0 0 6px; }
  #cats .ct { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 8px 4px; border-radius: 16px; border: 2px solid transparent; background: var(--bg); color: var(--ink); position: relative; min-height: 92px; min-width: 0; overflow: hidden; font-size: 13px; }
  #cats .ct .ic { font-size: 30px; line-height: 1; margin-bottom: 5px; }
  #cats .ct .nm { font-weight: 700; line-height: 1.15; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; max-width: 100%; word-break: normal; overflow-wrap: normal; }
  #cats .ct .nm.brk { overflow-wrap: anywhere; word-break: break-word; }
  #cats .ct .cn { position: absolute; top: 5px; right: 8px; font-size: 11px; color: var(--muted); font-weight: 700; }

  #cats .ct.wide.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .msrch { display: flex; align-items: center; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 0 8px 0 12px; height: 52px; }
  .msrch input { border: 0; outline: 0; background: transparent; font-size: 18px; flex: 1; min-width: 0; width: 100%; color: var(--ink); margin-left: 8px; -webkit-appearance: none; }

  .mgroups button.on { background: var(--ink); color: var(--card); }
  .mfound { margin: 8px 8px 0; font-size: 22px; font-weight: 700; } .mfound small { color: var(--muted); font-size: 16px; font-weight: 600; margin-left: 6px; }
  .mnone { color: var(--muted); font-size: 20px; text-align: center; padding: 40px 16px; }
  body.lay-tiles .item { width: calc(50% - 16px); }
  body.lay-tiles .item img, body.lay-tiles .ph { height: 200px; }

  #kbd { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); box-shadow: 0 -6px 24px rgba(0,0,0,.25); padding: 10px 8px 14px; }

  /* Экран простоя: тёмные планки сверху (название, языки) и снизу (точки, кнопки), между ними — карусель.

  if (qrFlashing) qrFly();
  else $('qrBox').className = '';
}
function qrFly() {
  clearTimeout(qrOpen.timer);
  var box = $('qrBox'), c = box.querySelector('.qrc');
  if (!qrFlashing || !c || box.className !== 'show') return;
  qrFlashing = false;
  var btn = document.querySelector(($('attract').style.display === 'block' ? '#aLangs' : '#langs') + ' [data-qr]');
  if (!btn) { box.className = ''; return; }
  var a = c.getBoundingClientRect(), b = btn.getBoundingClientRect();
  var dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  c.style.transition = 'transform .8s ease-in-out, opacity .8s ease-in';
  c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.06)';
  c.style.opacity = '.2';
  box.style.transition = 'background .8s';
  box.style.background = 'rgba(0,0,0,0)';
  setTimeout(function () {
    box.className = '';
    box.style.transition = box.style.background = '';
    btn.classList.remove('blink');
    void btn.offsetWidth; // перезапуск анимации, если кнопка уже мигала
    btn.classList.add('blink');
    setTimeout(function () { btn.classList.remove('blink'); }, 3200);
  }, 820);
}

// Гостю показываем, когда официант идёт, подтвердил или изменил заказ
function notifyChanges(first) {
  state.calls.concat(state.orders).forEach(function (x) {
    var prev = seen[x.id] || '';
    var now = x.status + '|' + (x.editedAt || '');
    seen[x.id] = now;
    if (first || prev === now) return;
    if (prev.split('|')[1] !== String(x.editedAt || '') && x.editedAt) toast(t('edited'));
    else if (x.status === 'ack') toast(t('coming'));
    else if (x.status === 'confirmed') toast(t('confirmed'));
  });
}

// ---------- Меню

// ---------- Вид меню (ЛК → «Дизайн»): classic — разделы строкой сверху (как раньше); tiles — плитки разделов слева,
// блюда карточками; catalog — сетка разделов, блюда списком. В новых видах — поиск и группы Кухня / Бар / Сладкое.
// Иконка и группа раздела подбираются по его названию (русскому и английскому), менеджер может заменить в ЛК
var mq = '', mgroup = '';
var GROUP_ICONS = { food: '🍽', bar: '🍷', sweet: '🍰' };
function menuView() { var v = MVIEW || (state && state.display && state.display.menuView); return v === 'tiles' || v === 'catalog' ? v : 'classic'; }
function catObj(c) { for (var k = 0; k < state.menu.length; k++) if ((tr(state.menu[k].cat) || '—') === c) return state.menu[k].cat || {}; return {}; }
function catKey(o) { return typeof o === 'string' ? o : o.ru || o.en || o[Object.keys(o)[0]] || ''; }
function catInfo(c) {
  if (c === DAY) return { icon: '⭐', group: 'top' };
  var o = catObj(c), ov = (state.menuCats || {})[catKey(o)] || {};
  var auto = JetMenuCats.info(typeof o === 'string' ? [o] : [o.ru, o.en, c]);
  return { icon: ov.icon || auto.icon, group: ov.group || auto.group };
}
// Разделы, которые сейчас слева: сверху — акции и блюдо дня, дальше — выбранная группа
function shownCats(list) {
  var g = { food: [], bar: [], sweet: [], top: [] };
  list.forEach(function (c) { g[catInfo(c).group].push(c); });
  var real = ['food', 'bar', 'sweet'].filter(function (k) { return g[k].length; });
  if (real.indexOf(mgroup) < 0) mgroup = real[0] || 'food';
  return { cats: g.top.concat(g[mgroup] || []), groups: real };
}
// Поиск: по названию и описанию на всех языках меню; «#острое» — по отметке
function searchHits(q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return null;
  var all = function (o) { return !o ? '' : typeof o === 'string' ? o : Object.keys(o).map(function (k) { return o[k]; }).join(' '); };
  var tq = q.charAt(0) === '#' ? q.slice(1) : '';
  return state.menu.filter(function (i) {
    if (tq) return (i.tags || []).some(function (tg) { return TAGS[tg] && all(TAGS[tg]).toLowerCase().split(' ').some(function (w) { return w.indexOf(tq) === 0; }); });
    return (all(i.name) + ' ' + all(i.desc) + ' ' + (i.sku || '')).toLowerCase().indexOf(q) >= 0;
  });
}
// ---------- Своя клавиатура поиска на планшете: язык гостя (рус / англ / тайский; китайский — латиницей: поиск ищет
// по всем языкам меню). Системная клавиатура не появляется (inputmode="none"). На телефонах гостей — их клавиатура

  ru: [['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'], ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э'], ['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю', 'ъ']],
  en: [['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'], ['z', 'x', 'c', 'v', 'b', 'n', 'm']],
  th: [['ภ', 'ถ', 'ุ', 'ึ', 'ค', 'ต', 'จ', 'ข', 'ช'], ['ๆ', 'ไ', 'ำ', 'พ', 'ะ', 'ั', 'ี', 'ร', 'น', 'ย', 'บ', 'ล'], ['ฟ', 'ห', 'ก', 'ด', 'เ', '้', '่', 'า', 'ส', 'ว', 'ง'], ['ผ', 'ป', 'แ', 'อ', 'ิ', 'ื', 'ท', 'ม', 'ใ', 'ฝ']],
  th2: [['ู', '฿', 'ฎ', 'ฑ', 'ธ', 'ํ', '๊', 'ณ', 'ฯ', 'ญ', 'ฐ'], ['ฤ', 'ฆ', 'ฏ', 'โ', 'ฌ', '็', '๋', 'ษ', 'ศ', 'ซ', 'ฉ'], ['ฮ', 'ฺ', '์', 'ฒ', 'ฬ', 'ฦ', 'ฃ', 'ฅ']]
};
var kbdLang = '', kbdShift = false;
function kbdLangs() { var l = (state.restaurant.langs || ['en']).filter(function (x) { return KB[x]; }); return l.length ? l : ['en']; }
function kbdOpen() {
  if (PHONE || !$('mq')) return;

  var rows = kbdLang === 'th' && kbdShift ? KB.th2 : KB[kbdLang];

function kbdClose() { if ($('kbd').hidden) return; $('kbd').hidden = true; document.body.classList.remove('kbd-on'); if ($('mq')) $('mq').blur(); }
function kbdType(v) { mq = v; $('mq').value = v; lastTouch = Date.now(); renderAll(); }

// Поиск и группы: на планшете — в колонке разделов слева, на телефоне — строкой над меню
function placeMenuParts(v) {
  var side = $('side'), top = $('mtop'), cats = $('cats');
  if (v === 'classic') { if (cats.parentNode !== $('app')) $('app').insertBefore(cats, $('mtop')); return; }
  if (!$('msearch')) {
    var box = document.createElement('div');
    box.id = 'msearch';
    box.innerHTML = '<label class="msrch"><span>🔍</span><input id="mq" type="search" autocomplete="off" autocorrect="off" spellcheck="false"><button class="mqx" data-mqx="1" hidden>✕</button></label>';
    var gr = document.createElement('div');
    gr.id = 'mgroups';
    gr.className = 'mgroups';
    $('mtop').appendChild(box);
    $('mtop').appendChild(gr);
    $('mq').addEventListener('input', function () { mq = this.value; lastTouch = Date.now(); renderAll(); });
    if (!PHONE) { $('mq').setAttribute('inputmode', 'none'); $('mq').addEventListener('focus', function () { kbdLang = ''; kbdShift = false; kbdOpen(); }); }
  }
  var host = top; // строкой над меню: на планшете колонка разделов узкая — в одну плитку
  if ($('msearch').parentNode !== host) { host.insertBefore($('mgroups'), host.firstChild); host.insertBefore($('msearch'), host.firstChild); }
  if (cats.parentNode !== side) side.appendChild(cats);
  $('mq').placeholder = t('mSearch');
  document.querySelector('[data-mqx]').hidden = !mq;
}

function categories() {
  var known = {}, out = state.menu.some(function (i) { return i.dayDish; }) ? [DAY] : [];
  state.menu.forEach(function (i) { var c = tr(i.cat) || '—'; if (!known[c]) { known[c] = 1; out.push(c); } });
  return out;
}

function renderAll() {
  // Название ресторана и стол: «Стол 5», а если стол назван словами («VIP», «Терраса 2») — как назван
  setHtml($('title'), tableBadge()); // вверху слева — только стол, крупно
  $('langs').innerHTML = (state.join && !PHONE ? '<button class="qrbtn" data-qr="1">📱 ' + esc(t('phoneOrder')) + '</button>' : '') + (state.restaurant.langs || ['en']).map(function (l) {
    return '<button data-lang="' + l + '" class="' + (l === lang ? 'on' : '') + '">' + (LANG_NAMES[l] || l) + '</button>';
  }).join('');
  var list = categories();
  // cat — категория, которая сейчас на экране, или «tag:…» — подбор по особому пожеланию (пока такие блюда есть)
  var tag = String(cat || '').indexOf('tag:') === 0 ? cat.slice(4) : '';
  var V = menuView();
  document.body.classList.toggle('lay-tiles', V === 'tiles');
  document.body.classList.toggle('lay-catalog', V === 'catalog');
  placeMenuParts(V);
  if (V !== 'classic') {
    // плитки разделов выбранной группы; лента — тоже только эта группа
    var sc = shownCats(list);
    if (!tag && sc.cats.indexOf(cat) < 0) cat = sc.cats[0];
    list = sc.cats;
    $('mgroups').innerHTML = sc.groups.length > 1 ? sc.groups.map(function (g) {
      return '<button data-mgroup="' + g + '" class="' + (g === mgroup ? 'on' : '') + '">' + GROUP_ICONS[g] + ' ' + esc(t('mg_' + g)) + '</button>';
    }).join('') : '';
  }
  if (tag ? !tagCount(tag) : list.indexOf(cat) < 0) { cat = list[0]; tag = ''; }
  $('cats').innerHTML = V !== 'classic'
    ? '<button data-diet="1" class="ct wide diet' + (tag ? ' on' : '') + '">' + (tag ? TAG_ICONS[tag] + ' ' + esc(tr(TAGS[tag])) : '🌿 ' + t('diet')) + '</button>' +
      list.map(function (c) {
        var n = c === DAY ? state.menu.filter(function (i) { return i.dayDish; }).length : state.menu.filter(function (i) { return (tr(i.cat) || '—') === c; }).length;
        return '<button data-cat="' + esc(c) + '" class="ct' + (!tag && !mq && c === cat ? ' on' : '') + '"><span class="cn">' + n + '</span><span class="ic">' + catInfo(c).icon + '</span><span class="nm">' + esc(c === DAY ? t('day').replace(/^★\s*/, '') : c) + '</span></button>';
      }).join('')
    : '<button data-diet="1" class="diet' + (tag ? ' on' : '') + '">' +
      (tag ? TAG_ICONS[tag] + ' ' + esc(tr(TAGS[tag])) : '🌿 ' + t('diet')) + '</button>' +
    list.map(function (c) {
      return '<button data-cat="' + esc(c) + '" class="' + (!tag && c === cat ? 'on' : '') + '">' + esc(c === DAY ? t('day') : c) + '</button>';
    }).join('');
  if (V !== 'classic') fitCats();
  // Меню — одной лентой: все категории подряд, заголовок над каждой; листаешь — категория вверху меняется сама.
  // Ленту строим заново, только когда сменились меню, язык или подбор, — иначе страница не прыгает при добавлении блюда
  var sig = menuSig + '|' + lang + '|' + tag + '|' + isEntrance() + '|' + V + '|' + mgroup + '|' + mq + '|' + JSON.stringify(state.menuCats || {});
  // на экране слайдов меню не видно — перестраиваем его не сразу (смена языка — мгновенно), а в паузе
  if (sig !== feedSig && $('attract').style.display === 'block') {
    clearTimeout(feedTimer);
    feedTimer = setTimeout(function () { if ($('attract').style.display === 'block') buildFeed(list, tag, sig); }, 1500);
  } else if (sig !== feedSig) buildFeed(list, tag, sig);
  updateAddButtons();
  renderFooter();
  if ($('attract').style.display === 'block') renderAttract();
}

// Название раздела в плитке — без переноса посреди слова: длинное слово уменьшаем шрифтом (до 9px), размер запоминаем
var fitMemo = {};
function fitCats() {
  var l = document.querySelectorAll('#cats .ct .nm'), w = $('cats').clientWidth;
  if (!w) return;
  for (var i = 0; i < l.length; i++) {
    var e = l[i], k = w + '|' + e.textContent, m = fitMemo[k];
    if (m === undefined) {
      var fs = 13;
      while (e.scrollWidth > e.clientWidth + 1 && fs > 9) { fs--; e.style.fontSize = fs + 'px'; }
      m = fitMemo[k] = e.scrollWidth > e.clientWidth + 1 ? -fs : fs;
    }
    if (Math.abs(m) !== 13) e.style.fontSize = Math.abs(m) + 'px';
    if (m < 0) e.className += ' brk';
  }
}

var feedTimer = null;
function buildFeed(list, tag, sig) {
  if (sig !== feedSig) {
    feedSig = sig;
    var V = menuView(), hits = V !== 'classic' ? searchHits(mq) : null;
    var head = function (c) { return '<h3 class="mcat">' + (V !== 'classic' ? catInfo(c).icon + ' ' + esc(c === DAY ? t('day').replace(/^★\s*/, '') : c) : esc(c === DAY ? t('day') : c)) + '</h3>'; };
    if (hits) {
      var byCat = {}, order = [];
      hits.forEach(function (i) { var c = tr(i.cat) || '—'; if (!byCat[c]) { byCat[c] = []; order.push(c); } byCat[c].push(i); });
      $('items').innerHTML = '<div class="mfound">🔍 «' + esc(mq.trim()) + '»<small>' + t('mFound') + ': ' + hits.length + '</small></div>' +
        (hits.length ? order.map(function (c) { return '<section class="msec" data-sec="' + esc(c) + '">' + head(c) + '<div class="grid">' + byCat[c].map(cardHtml).join('') + '</div></section>'; }).join('')
          : '<div class="mnone">' + esc(t('mNone')) + '</div>');
      $('items').scrollTop = 0;
      updateAddButtons();
      return;
    }
    $('items').innerHTML = tag
      ? '<div class="grid">' + state.menu.filter(function (i) { return (i.tags || []).indexOf(tag) >= 0; }).map(cardHtml).join('') + '</div>'
      : list.map(function (c) {
        return '<section class="msec" data-sec="' + esc(c) + '">' + head(c) + '<div class="grid">' +
          state.menu.filter(function (i) { return c === DAY ? i.dayDish : (tr(i.cat) || '—') === c; }).map(cardHtml).join('') + '</div></section>';
      }).join('');
    updateAddButtons();
  }
}

var feedSig = '';
// Кнопка у блюда: «Добавить», а у блюда с заказом через официанта (вино в ассортименте, цена ฿0) — «Спросить официанта»
function addBtn(i) {
  if (isEntrance()) return '';
  return i.ask ? '<button class="add askw" data-askw="' + esc(i.id) + '">' + esc(t('askBtn')) + '</button>' : '<button class="add" data-add="' + esc(i.id) + '"></button>';
}
function cardHtml(i) {
  if (menuView() === 'catalog') {
    return '<div class="item irow" data-dish="' + esc(i.id) + '">' + (i.photo ? '<img src="' + esc(i.photo) + '" loading="lazy" alt="">' : '<div class="ph"></div>') +
      '<div class="b"><div class="n">' + esc(tr(i.name)) + '</div><div class="d">' + esc(tr(i.desc)) + '</div><div class="ip price">' + priceLabel(i) + '</div></div><span class="price op1">' + priceLabel(i) + '</span>' +
      addBtn(i) + '</div>';
  }
  return '<div class="item" data-dish="' + esc(i.id) + '">' + (i.photo ? '<img src="' + esc(i.photo) + '" loading="lazy" alt="">' : '<div class="ph"></div>') +
    '<div class="b"><div class="n">' + esc(tr(i.name)) + '</div><div class="d">' + esc(tr(i.desc)) + '</div>' +
    '<div class="row"><span class="price">' + priceLabel(i) + '</span>' + addBtn(i) + '</div></div></div>';
}
// «Добавить · 2» на карточках — без перестройки ленты
function updateAddButtons() {
  var b = document.querySelectorAll('#items [data-add]');
  for (var k = 0; k < b.length; k++) { var n = inCart(b[k].dataset.add); b[k].textContent = t('add') + (n ? ' · ' + n : ''); }
}
// Перейти к категории в ленте (кнопка категории вверху, «Показать блюдо» у персонажа)
function goCat(c) {
  if (mq) { mq = ''; if ($('mq')) $('mq').value = ''; cat = c; renderAll(); }
  if (String(cat || '').indexOf('tag:') === 0) { cat = c; renderAll(); }
  cat = c;
  markCat();
  var sec = document.querySelector('#items [data-sec="' + (window.CSS && CSS.escape ? CSS.escape(c) : c) + '"]');
  if (!sec) return;
  // к соседней категории — плавно, к далёкой — сразу (долгая прокрутка через всё меню только мешает)
  var it = $('items'), top = sec.offsetTop - 4, near = Math.abs(top - it.scrollTop) < it.clientHeight * 2;
  scrollLock = Date.now() + (near ? 700 : 150);
  if (near && it.scrollTo) it.scrollTo({ top: top, behavior: 'smooth' }); else it.scrollTop = top;
}
// Подсветка категории, которая сейчас на экране, и прокрутка полосы категорий к ней
function markCat() {
  var on = null, b = document.querySelectorAll('#cats [data-cat]');
  for (var k = 0; k < b.length; k++) { var is = b[k].dataset.cat === cat && !mq; b[k].classList.toggle('on', is); if (is) on = b[k]; }
  if (!on) return;
  var bar = $('cats');
  if (menuView() === 'classic') bar.scrollLeft = on.offsetLeft - bar.clientWidth / 2 + on.offsetWidth / 2;
  else if (on.offsetTop < bar.scrollTop || on.offsetTop + on.offsetHeight > bar.scrollTop + bar.clientHeight) bar.scrollTop = on.offsetTop - bar.clientHeight / 3;
}
var scrollLock = 0, spyQueued = false;
$('items').addEventListener('scroll', function () {
  if (spyQueued || String(cat || '').indexOf('tag:') === 0) return;
  spyQueued = true;
  requestAnimationFrame(function () {
    spyQueued = false;
    var secs = document.querySelectorAll('#items .msec'), top = $('items').scrollTop + 40, cur = null;
    for (var k = 0; k < secs.length; k++) { if (secs[k].offsetTop <= top) cur = secs[k].dataset.sec; else break; }
    // долистали до конца — последняя категория
    var it = $('items');
    if (it.scrollTop + it.clientHeight >= it.scrollHeight - 4 && secs.length) cur = secs[secs.length - 1].dataset.sec;
    if (cur && cur !== cat && Date.now() > scrollLock) { cat = cur; markCat(); }
  });
}, { passive: true });

function avatarChatBtn() {
  var a = state.avatar;
  return a ? '<button class="avchat" data-avchat="1" title="' + esc(tr(a.name)) + '"><img src="' + esc(a.images.idle) + '" alt=""></button>' : '';
}

// «1 блюдо», «2 блюда», «5 блюд»; «1 dish», «2 dishes»
function dishCount(n) {
  if (lang === 'ru') {
    var m10 = n % 10, m100 = n % 100;
    return n + ' ' + (m10 === 1 && m100 !== 11 ? 'блюдо' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'блюда' : 'блюд');
  }
  return n + ' ' + ({ th: 'เมนู', zh: '道菜' }[lang] || (n === 1 ? 'dish' : 'dishes'));
}

function tagCount(tag) {
  return state.menu.filter(function (i) { return (i.tags || []).indexOf(tag) >= 0; }).length;
}

// Окно «Особые пожелания»: варианты без подходящих блюд неактивны

  sheetMode = 'diet';
  $('sheet').innerHTML = '<h2>🌿 ' + t('diet') + '</h2><p class="status">' + t('dietAsk') + '</p><div class="dietgrid">' +

        '<small>' + (n ? dishCount(n) : t('noneYet')) + '</small></button>';
    }).join('') + '</div>' +
    (String(cat).indexOf('tag:') === 0 ? '<button class="big ghost" data-tagf="">' + t('allMenu') + '</button>' : '') +
    '<button class="big ghost" data-close="1">' + t('close') + '</button>';
  $('cart').className = 'overlay show';
}

// Цветовая тема ресторана: переменные CSS, которыми окрашен весь интерфейс
var themeSig = '';
function applyTheme(ds) {
  var p = ds.palette || {}, sig = JSON.stringify(p);
  if (sig === themeSig) return;
  themeSig = sig;
  var vars = { bg: p.bg, card: p.card, ink: p.ink, muted: p.muted, line: p.line, soft: p.soft, accent: p.accent, 'accent-ink': p.accentInk };
  for (var k in vars) {
    if (/^#[0-9a-f]{6}$/i.test(vars[k] || '')) document.documentElement.style.setProperty('--' + k, vars[k]);
  }
}

// Плашка стола в шапке меню и на экране рекламы. Слово «Стол» — на языке гостя (Table, โต๊ะ, 桌),
// номер или буква — как написал менеджер; название без этого слова («VIP-зал») — как есть
function tableName(n) {
  var m = String(n || '').match(/^(?:стол|table|โต๊ะ|桌)\s+(.+)$/i);
  return !n ? '' : /^\d+$/.test(n) ? t('table') + ' ' + n : m ? t('table') + ' ' + m[1] : n;
}
// На планшете стол — кнопка: открывает «О системе»; на телефоне гостя — просто надпись
function tableBadge() {
  if (!state.table) return '';
  var n = esc(tableName(state.table));
  return PHONE ? '<span class="tno">' + n + '</span>' : '<button class="tno" data-info="1">' + n + '</button>';
}
// Перерисовываем, только если изменилось: иначе кнопка, которую как раз нажимают, подменяется новой и нажатие теряется
function setHtml(el, html) {
  if (el._html === html) return;
  el._html = html;
  el.innerHTML = html;
}

// ---------- Корзина переживает перезапуск страницы (обновление агента, сбой): тот же визит стола и не дольше срока
// очистки корзины. Агенту сообщаем, что гость занят планшетом, — обновление подождёт
var CART_KEY = 'jmCart:' + (KEY || D), cartSaved = '';
function saveCart() {
  var v = JSON.stringify(cart);
  if (v === cartSaved) return;
  cartSaved = v;
  try { localStorage[CART_KEY] = JSON.stringify({ visit: (state && state.visit) || 0, at: Date.now(), cart: cart }); } catch (e) { /* без хранилища */ }
  agentActivity();
}
function restoreCart(s) {
  try {
    var x = JSON.parse(localStorage[CART_KEY] || 'null');
    if (!x || x.visit !== (s.visit || 0) || Date.now() - x.at > ((s.timers || {}).cartMin || 15) * 60000) return;
    Object.keys(x.cart || {}).forEach(function (k) { if (MENU[k.split('|')[0]] && x.cart[k] > 0) cart[k] = x.cart[k]; });
    cartSaved = JSON.stringify(cart);
  } catch (e) { /* испорченная запись — пустая корзина */ }
}
var agentPing = 0;
function agentActivity() {
  if (Date.now() - agentPing < 10000 && cartCount()) return;
  agentPing = Date.now();
  try { if (window.JetAgent && JetAgent.activity) JetAgent.activity(cartCount()); } catch (e) { /* старый агент */ }
}

function renderFooter() {
  saveCart();
  if ($('aMenu')) $('aMenu').outerHTML = orderBtn('abtn main', 'aMenu', t('menu'));
  if (isEntrance()) {
    $('foot').innerHTML = '<button class="main" id="backBtn">' + t('back') + '</button>' + avatarChatBtn();
    renderCallBar();
    return;
  }
  var n = cartCount(), w = activeCall('waiter'), b = activeCall('bill');
  $('foot').innerHTML = '<button id="callBtn"' + (w ? ' class="alarm"' : '') + '>' + t(w ? 'cancelCall' : 'call') + '</button>' +
    '<button id="billBtn"' + (b ? ' class="alarm"' : '') + '>' + t(b ? 'cancelBill' : 'bill') + '</button>' +
    avatarChatBtn() + orderBtn('main', 'cartBtn', t('cart'));
  renderCallBar();
}

// Открытый вызов стола этого типа (официант ещё не отметил «Готово»)
function activeCall(type) {
  if (!state || isEntrance()) return null;
  var me = (state.me || {}).n || 1;
  // счёт: свой («мой счёт») или всего стола; вызов официанта — общий для стола
  return (state.calls || []).filter(function (c) {
    return c.type === type && c.status !== 'done' && (type !== 'bill' || !c.scope || c.scope === me);
  })[0] || null;
}
// Состояние заказа стола в кнопке — до закрытия стола: неподанный — самый «отстающий» (ждёт подтверждения → готовится →
// готово, время — по самому старому); всё подано → «Подано», всё оплачено → «Оплачен», остались только отменённые → «Отменён».
// Стол закрыли — заказов нет, кнопки обычные
function orderStat() {
  if (!state || isEntrance()) return null;
  var all = state.orders || [], live = all.filter(function (o) { return o.status !== 'rejected'; });
  if (!all.length) return null;
  var open = live.filter(function (o) { return !o.servedAt; });
  if (!live.length) return { kind: 'void', text: t('ostVoid') };
  if (!open.length) {
    var paid = live.every(function (o) { return o.paidAt || o.items.every(function (i) { return i.paidAt; }); });
    return paid ? { kind: 'paid', text: t('stPaid') } : { kind: 'served', text: t('stServed') };
  }
  var kind = open.some(function (o) { return o.status === 'pending'; }) ? 'pending' : open.some(function (o) { return !o.readyAt; }) ? 'cooking' : 'ready';
  var from = Math.min.apply(null, open.map(function (o) { return o.cookFrom || o.confirmedAt || o.at; }));
  return { kind: kind, text: t(kind === 'pending' ? 'ostPending' : kind === 'cooking' ? 'ostCooking' : 'ostReady').replace('{m}', Math.max(1, Math.floor((Date.now() - from) / 60000))) };
}
// Кнопка заказа: корзина пуста — состояние заказа вместо «Заказ»; в корзине есть блюда — состояние маленькой строкой над текстом
function orderBtn(cls, id, idleText) {
  var st = orderStat(), n = cartCount();
  var main = n ? t('cart') + ' (' + n + ') · ' + money(cartTotal()) : idleText;
  if (!st) return '<button class="' + cls + '" id="' + id + '">' + esc(main) + '</button>';
  return '<button class="' + cls + ' ost ost-' + st.kind + (n ? ' ostsub' : '') + '" id="' + id + '">' + (n ? '<small class="osub">' + esc(st.text) + '</small>' + esc(main) : esc(st.text)) + '</button>';
}
function pendingOrders() {
  return isEntrance() ? [] : (state.orders || []).filter(function (o) { return o.status === 'pending'; });
}

// Полоса статуса вверху: «Официант вызван», «Вы попросили счёт», «Заказ отправлен»;
// официант нажал «Иду» — «Официант уже идёт к вам»
function renderCallBar() {
  var w = activeCall('waiter'), b = activeCall('bill'), o = pendingOrders();
  var going = (w && w.status === 'ack') || (b && b.status === 'ack') || o.some(function (x) { return x.ackAt; });
  var parts = [];
  if (w) parts.push(t('callOn'));
  if (b) parts.push(t('billOn'));
  if (o.length) parts.push(t('orderOn'));
  var on = parts.length > 0, text = going ? t('comingBar') : parts.join('  ·  ');
  var a = $('aCall');
  if (a) { a.className = 'abtn' + (w ? ' alarm' : ''); a.textContent = t(w ? 'cancelCall' : 'call'); }
  // та же полоса — не трогаем: подбор шрифта меряет страницу, а с большим меню это заметная задержка
  var sig = text + '|' + on + '|' + going;
  if (sig === callBarSig) return;
  callBarSig = sig;
  $('callBar').textContent = text;
  $('callBar').className = going ? 'go' : '';
  $('callBar').style.display = on ? 'block' : 'none';
  document.body.classList.toggle('calling', on);
  // несколько статусов сразу — уменьшаем шрифт, пока строка не влезет
  for (var fs = PHONE ? 18 : 28; fs >= 11; fs -= 1) {
    $('callBar').style.fontSize = fs + 'px';
    if (!on || $('callBar').scrollWidth <= $('callBar').clientWidth) break;
  }
}
var callBarSig = '';

// «от ฿120»: самая низкая цена, если бывает дороже
function fromPrice(v) { return t('priceFrom').replace('{p}', money(v)); }
function priceLabel(i) {
  if (i.ask) return '<small class="pask">' + esc(t('priceAsk')) + '</small>';
  // акция с вариантами: цена у каждого варианта своя, у самой строки ฿0
  var pv = i.fromPromo && (i.groups || [])[0];
  if (pv && pv.id === 'pv') {
    var vp = pv.opts.map(function (o) { return Number(o.price) || 0; }).filter(Boolean);
    if (!vp.length) return '';
    var vmin = Math.min.apply(null, vp);
    return Math.max.apply(null, vp) > vmin || pv.type === 'many' ? fromPrice(vmin) : money(vmin);
  }
  var prices = (i.options || []).map(function (o) { return Number(o.price) || 0; }).filter(Boolean);
  if (!prices.length) return i.price ? money(i.price) : '';
  var min = Math.min.apply(null, prices);
  return money(min) + (Math.max.apply(null, prices) > min ? '+' : '');
}

// ---------- Корзина и заказы

function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
function inCart(id) { var n = 0; for (var k in cart) if (k.split('|')[0] === id) n += cart[k]; return n; }

// Строка корзины: «блюдо|вариант|выбранное в группах через запятую»
function hasChoice(i) { return !!((i.options || []).length || (i.groups || []).length); }
function pickedOf(i, ids) {
  var out = [];
  (i.groups || []).forEach(function (g) { g.opts.forEach(function (o) { if (ids.indexOf(o.id) >= 0) out.push(o); }); });
  return out;
}
function lineOf(key) {
  var p = key.split('|'), i = MENU[p[0]];
  if (!i) return null;
  var o = p[1] ? (i.options || []).filter(function (x) { return x.key === p[1]; })[0] : null;
  if (p[1] && !o) return null;
  var mods = pickedOf(i, p[2] ? p[2].split(',') : []);
  return {
    price: (Number(o ? o.price : i.price) || 0) + mods.reduce(function (a, m) { return a + (Number(m.price) || 0); }, 0),
    name: tr(i.name) + (o ? ' · ' + tr(o.label) : ''), mods: mods.map(function (m) { return tr(m.name); }).join(' · '), tags: i.tags
  };
}

// Отметки блюда (не острое, без глютена…) хештегами под названием в заказе. Если гость выбрал варианты,
// «острое / не острое» не пишем — выбранная острота уже видна в вариантах
function tagsHtml(tags, chosen) {
  var list = (tags || []).filter(function (k) { return TAGS[k] && !(chosen && (k === 'spicy' || k === 'mild')); });
  return list.length ? '<span class="ltags">' + list.map(function (k) { return '<i>#' + esc(tr(TAGS[k]).toLowerCase()) + '</i>'; }).join('') + '</span>' : '';
}

function cartTotal() {
  return Object.keys(cart).reduce(function (s, k) { var l = lineOf(k); return s + (l ? l.price * cart[k] : 0); }, 0);
}

// Окно блюда с выбором — как в источнике меню: вариант (объём, размер), группы «выберите одно» и добавки-галочки,
// доплаты «+30 ฿», выбор по умолчанию, количество и кнопка «Добавить · сумма»
var pick = null;
function openOptions(id, detail) {
  var i = MENU[id];
  pick = { detail: !!detail, id: id, opt: (i.options || []).length ? i.options[0].key : '', mods: [], qty: 1 };
  (i.groups || []).forEach(function (g) {
    var d = g.opts.filter(function (o) { return o.def; });
    if (g.type === 'one') d = d.slice(0, 1);
    // «выберите 2–3» — гость выбирает сам, заранее ничего не отмечаем
    if (g.req && !d.length && g.opts.length && !(g.min > 1)) d = [g.opts[0]];
    d.forEach(function (o) { pick.mods.push(o.id); });
  });
  renderPick();
  $('cart').className = 'overlay show';
}
function pickKey() { return pick.id + '|' + pick.opt + '|' + pickedOf(MENU[pick.id], pick.mods).map(function (o) { return o.id; }).join(','); }
function renderPick() {
  var i = MENU[pick.id], l = lineOf(pickKey());
  sheetMode = 'opts';
  var row = function (attrs, on, many, label, price) {
    return '<button class="orow' + (on ? ' on' : '') + (many ? ' many' : '') + '" ' + attrs + '><span class="mk">' + (on && many ? '✓' : '') + '</span>' +
      '<span class="on1">' + esc(label) + '</span>' + (price ? '<span class="op">' + price + '</span>' : '') + '</button>';
  };
  // нажали на блюдо: фото крупно, полное описание и отметки; дальше — варианты и «Добавить», как при выборе
  var tagsHtml = (i.tags || []).filter(function (k) { return TAGS[k]; }).map(function (k) { return '<span>' + (TAG_ICONS[k] || '') + ' ' + esc(tr(TAGS[k])) + '</span>'; }).join('');
  $('sheet').innerHTML = (pick.detail && i.photo ? '<img class="pimg" src="' + esc(i.photo) + '" alt="">' : '') +
    '<div class="phead"><div><div class="pcat">' + esc(tr(i.cat)) + '</div><h2>' + esc(tr(i.name)) + '</h2></div>' +
      '<b class="pprice">' + (i.ask ? '<small class="pask">' + esc(t('priceAsk')) + '</small>' : money(l.price)) + '</b></div>' +
    (pick.detail && tr(i.desc) ? '<div class="pdesc">' + esc(tr(i.desc)) + '</div>' : '') +
    (i.ask ? '<div class="paskh">🙋 ' + esc(t('askHint')) + '</div>' : '') +
    (pick.detail && i.sku ? '<div class="psku">' + esc(t('codeL')) + ': ' + esc(i.sku) + '</div>' : '') +
    (pick.detail && tagsHtml ? '<div class="ptags">' + tagsHtml + '</div>' : '') +
    ((i.options || []).length ? '<div class="og">' + i.options.map(function (o) {
      return row('data-pv="' + esc(o.key) + '"', pick.opt === o.key, false, tr(o.label), money(o.price));
    }).join('') + '</div>' : '') +
    (i.groups || []).map(function (g, gi) {
      var got = g.opts.filter(function (o) { return pick.mods.indexOf(o.id) >= 0; }).length;
      var rng = g.min || g.max ? (g.min && g.max && g.min !== g.max ? t('pickRange').replace('{a}', g.min).replace('{b}', g.max) : t('pickN').replace('{a}', g.min || g.max)) + ' · ' + got : '';
      return '<div class="og"><h4>' + esc(tr(g.name)) + (g.req ? ' <span class="req">*</span>' : '') + (rng ? ' <span class="rng">' + esc(rng) + '</span>' : '') + '</h4>' + g.opts.map(function (o) {
        return row('data-pg="' + gi + '" data-po="' + esc(o.id) + '"', pick.mods.indexOf(o.id) >= 0, g.type === 'many', tr(o.name), o.price ? (i.fromPromo && g.id === 'pv' ? '' : '+') + money(o.price) : ''); // у вариантов акции — полная цена
      }).join('') + '</div>';
    }).join('') +
    (isEntrance() ? '<div class="pbar"><button class="pclose" data-close="1">✕</button></div>'
      : i.ask ? '<div class="pbar"><button class="pclose" data-close="1">✕</button><button class="big" data-askw="' + esc(i.id) + '">' + esc(t('askBtn')) + '</button></div>'
      : '<div class="pbar"><button class="pclose" data-close="1">✕</button><span class="qty"><button data-pq="-1">−</button> ' + pick.qty + ' <button data-pq="1">+</button></span>' +
      '<button class="big" data-padd="1">' + t('add') + ' · ' + money(l.price * pick.qty) + '</button></div>');
}
function pickToggle(gi, oid) {
  var g = MENU[pick.id].groups[gi], on = pick.mods.indexOf(oid) >= 0;
  if (g.type === 'one') {
    if (on && g.req) return;
    var ids = g.opts.map(function (o) { return o.id; });
    pick.mods = pick.mods.filter(function (m) { return ids.indexOf(m) < 0; });
    if (!on) pick.mods.push(oid);
  } else if (on) {
    // обязательная группа «несколько» без «от–до»: последний выбор не снимается
    if (g.req && !g.min && g.opts.filter(function (o) { return pick.mods.indexOf(o.id) >= 0; }).length < 2) return;
    pick.mods = pick.mods.filter(function (m) { return m !== oid; });
  } else {
    // «до 3» — четвёртый не добавляем
    if (g.max && g.opts.filter(function (o) { return pick.mods.indexOf(o.id) >= 0; }).length >= g.max) { toast(t('pickMax').replace('{n}', g.max)); return; }
    pick.mods.push(oid);
  }
  renderPick();
}

function renderCart() {
  sheetMode = 'cart';
  var lines = Object.keys(cart).filter(function (k) { return lineOf(k); }).map(function (k) {
    var l = lineOf(k);
    return '<div class="line"><span class="n">' + esc(l.name) + (l.mods ? '<span class="lmods">' + esc(l.mods) + '</span>' : '') + tagsHtml(l.tags, !!l.mods) + '</span>' +
      '<span class="qty"><button data-dec="' + esc(k) + '">−</button> ' + cart[k] + ' <button data-inc="' + esc(k) + '">+</button></span>' +
      '<span class="price">' + money(l.price * cart[k]) + '</span></div>';
  }).join('');
  // Уже отправленные заказы: каждое блюдо отдельной строкой с ценой, итог заказа и итог по столу
  var active = state.orders.filter(function (o) { return o.status !== 'rejected'; });
  var grand = active.reduce(function (s, o) { return s + o.total; }, 0);
  var many = manyGuests(), byGuest = {};
  active.forEach(function (o) { o.items.forEach(function (i) { var g = i.g || o.guest || 1; byGuest[g] = (byGuest[g] || 0) + i.price * i.qty; }); });
  var ordered = state.orders.map(function (o, n) {
    var og = o.guest || 1;
    return '<div class="order"><div class="ohead"><span>' + t('order') + ' ' + (n + 1) + (many ? ' · ' + esc(guestLabel(og)) : '') + '</span>' + orderStatus(o) + '</div>' +
      o.items.map(function (i) {
        // блюдо, которое официант перенёс на другого гостя (разделение счёта)
        var moved = many && (i.g || og) !== og ? ' <span class="ltags"><i>→ ' + esc(guestLabel(i.g)) + '</i></span>' : '';
        return '<div class="line"><span class="n">' + i.qty + ' × ' + esc(tr(i.name)) + (i.ml ? '<span class="lmods">' + esc(tr(i.ml)) + '</span>' : '') +
          tagsHtml((MENU[i.id] || {}).tags, !!i.ml) + moved + '</span><span class="price">' + money(i.price * i.qty) + '</span></div>';
      }).join('') +
      '<div class="total"><span>' + t('total') + '</span><span>' + money(o.total) + '</span></div></div>';
  }).join('');
  $('sheet').innerHTML = '<h2>' + t('cart') + '</h2>' + (lines || '<p class="status">' + t('empty') + '</p>') + (lines ? upCartBlock() : '') +
    (lines ? '<div class="total"><span>' + t('total') + '</span><span>' + money(cartTotal()) + '</span></div><button class="big" data-send="1">' + t('send') + '</button>' : '') +
    (queuedOrders() ? '<p class="status">⏳ ' + esc(t('queued')) + ' (' + t('queuedBar').replace('{n}', queuedOrders()) + ')</p>' : '') +
    (ordered ? '<h3>' + t('ordered') + '</h3>' + ordered + '<div class="grand"><span>' + t('tableTotal') + '</span><span>' + money(grand) + '</span></div>' : '') +
    (ordered && many ? '<h3>' + t('byGuests') + '</h3><div class="gsum">' + Object.keys(byGuest).sort(function (a, b) { return a - b; }).map(function (g) {
      return '<div class="line' + (state.me && state.me.n === Number(g) ? ' me' : '') + '"><span class="n">' + esc(guestLabel(Number(g))) + '</span><span class="price">' + money(byGuest[g]) + '</span></div>';
    }).join('') + '</div>' : '') +
    '<button class="big ghost" data-close="1">' + t('close') + '</button>';
}

// Статус заказа для гостя цветом: ждёт подтверждения → подтверждён → готовится → готово (без таймера)
function orderStatus(o) {
  // оплачен — главное для гостя: «✓ Заказ оплачен», даже если до этого было «Подано»
  var st = o.status === 'rejected' ? 'rejected' : o.paidAt ? 'stPaid' : o.servedAt ? 'stServed' : o.status === 'pending' ? 'pending'
    : o.readyAt ? 'stReady' : 'stCooking';
  return '<span class="gst gst-' + st + '">' + esc(t(st)) + '</span>';
}

// ---------- Подсказки к заказу («всплывашки»): правила приходят с сервера уже разложенными по блюдам (state.upsell).
// А — после «Добавить»: маленький персонаж с подсказкой и 1–3 блюдами, сам исчезает через 9 с;
// Б — «Часто берут вместе» в корзине; В — «Дополнить заказ?» один раз перед отправкой.
// Не навязываемся: одна подсказка на блюдо, не больше N за визит (настройка ресторана), не предлагаем то, что уже в
// корзине или заказано; «Нет, спасибо» — это правило больше не показываем; два отказа — дальше только тихий блок в корзине
var UP = upFresh(), upTimer = null;
function upFresh() { return { shown: 0, seen: {}, no: {}, noCount: 0, turn: {}, logged: {}, sheetDone: false, fromUp: false }; }
function upCfg() { return (state && state.upsell) || null; }
function upEvent(k, rule, dish, mode, price) {
  if (PREVIEW || MPREVIEW || PHONE || isEntrance()) return;
  post('/api/guest/event', { k: k, rule: rule, dish: dish || '', mode: mode, price: price || 0 }).catch(function () {});
}
function upOrdered() {
  var ids = {};
  (state.orders || []).forEach(function (o) { if (o.status !== 'rejected') o.items.forEach(function (i) { ids[i.id] = 1; }); });
  return ids;
}
// что предложить по правилу: нет в корзине и в заказах; сначала с фото; по кругу — в следующий раз другие
function upOffer(r, n) {
  var ord = upOrdered();
  var list = r.offer.filter(function (id) { var i = MENU[id]; return i && !i.ask && !inCart(id) && !ord[id]; });
  list = list.filter(function (id) { return MENU[id].photo; }).concat(list.filter(function (id) { return !MENU[id].photo; }));
  var out = [], start = (UP.turn[r.id] || 0) % Math.max(1, list.length);
  for (var k = 0; k < list.length && out.length < n; k++) out.push(list[(start + k) % list.length]);
  return out;
}
function upCard(rid, id, mode) {
  var i = MENU[id];
  return '<div class="upcard' + (inCart(id) ? ' done' : '') + '">' + (i.photo ? '<img src="' + esc(i.photo) + '" alt="" loading="lazy">' : '<div class="noph"></div>') +
    '<div class="upn">' + esc(tr(i.name)) + '</div><div class="upf"><b>' + priceLabel(i) + '</b>' +
    '<button class="upa" data-upadd="' + esc(rid + '|' + id + '|' + mode) + '" aria-label="' + esc(t('add')) + '">' + (inCart(id) ? '✓' : '+') + '</button></div></div>';
}
function upAvatar() {
  var im = state && state.avatar && state.avatar.images && (state.avatar.images.idle || state.avatar.images.talk);
  return '<div class="upav">' + (im ? '<img src="' + esc(im) + '" alt="">' : '👨‍🍳') + '</div>';
}
function upAfterAdd(id) {
  var U = upCfg();
  if (UP.fromUp) { UP.fromUp = false; return; } // добавили из подсказки — новую не показываем
  if (!U || !U.popup || PREVIEW || MPREVIEW || isEntrance() || UP.shown >= U.perVisit || UP.noCount >= 2 || UP.seen[id]) return;
  for (var k = 0; k < U.rules.length; k++) {
    var r = U.rules[k];
    if (r.nodrink || UP.no[r.id] || r.when.indexOf(id) < 0) continue;
    var offer = upOffer(r, 3);
    if (!offer.length) continue;
    UP.seen[id] = 1; UP.shown++; UP.turn[r.id] = (UP.turn[r.id] || 0) + offer.length;
    upEvent('up_show', r.id, id, 'popup');
    setTimeout(function () { upPopup(r, offer); }, 700);
    return;
  }
}
function upPopup(r, offer) {
  var el = $('upPop');
  el.innerHTML = '<div class="uphead">' + upAvatar() + '<div class="upbub">' + esc(tr(r.text) || t('upDefault')) + '</div>' +
    '<button class="upx" data-upno="' + esc(r.id) + '" aria-label="✕">✕</button></div>' +
    '<div class="uprow">' + offer.map(function (id) { return upCard(r.id, id, 'popup'); }).join('') + '</div>' +
    '<button class="upno" data-upno="' + esc(r.id) + '">' + esc(t('upNo')) + '</button>';
  el.className = 'show';
  upArm();
}
function upArm() { clearTimeout(upTimer); upTimer = setTimeout(upHide, 9000); }
function upHide() { clearTimeout(upTimer); if ($('upPop')) $('upPop').className = ''; }
$('upPop').addEventListener('pointerdown', upArm);
function upDecline(rid) {
  if (!UP.no[rid]) { UP.no[rid] = 1; UP.noCount++; upEvent('up_no', rid, '', 'popup'); }
  upHide();
}
function upAdd(v) {
  var p = v.split('|'), rid = p[0], id = p[1], mode = p[2], i = MENU[id];
  if (!i) return;
  var pr = Number(i.price) || ((i.options || [])[0] || {}).price || 0;
  upEvent('up_add', rid, id, mode, pr);
  if (hasChoice(i)) { UP.fromUp = true; upHide(); openOptions(id); return; }
  cart[id] = (cart[id] || 0) + 1;
  toast(t('added'));
  renderAll();
  if (mode === 'sheet') upSheet(true);
  else if (mode === 'cart') renderCart();
  else { upHide(); }
}
// подсказки к корзине: правила, у которых в корзине есть блюдо из «когда», и «Не забыли напитки?»
function upForCart(n, mode) {
  var U = upCfg();
  if (!U) return { rules: [], ids: [] };
  var inC = {}, ord = upOrdered();
  Object.keys(cart).forEach(function (k) { inC[k.split('|')[0]] = 1; });
  var rules = [], ids = [];
  U.rules.forEach(function (r) {
    if (UP.no[r.id]) return;
    var hit = r.when.some(function (id) { return inC[id]; });
    if (r.nodrink) hit = hit && !r.drinks.some(function (id) { return inC[id] || ord[id]; });
    if (!hit) return;
    var got = upOffer(r, n).filter(function (id) { return ids.indexOf(id) < 0; });
    if (!got.length) return;
    rules.push(r);
    got.forEach(function (id) { if (ids.length < n) ids.push(id + '|' + r.id); });
  });
  rules.forEach(function (r) { if (!UP.logged[mode + r.id]) { UP.logged[mode + r.id] = 1; upEvent('up_show', r.id, '', mode); } });
  return { rules: rules, ids: ids };
}
function upCartBlock() {
  var U = upCfg();
  if (!U || !U.cart || MPREVIEW) return '';
  var f = upForCart(3, 'cart');
  if (!f.ids.length) return '';
  var title = f.rules.length === 1 && f.rules[0].nodrink ? tr(f.rules[0].text) : t('upTogether');
  return '<div class="upcart"><h4>' + esc(title) + '</h4><div class="uprow">' +
    f.ids.map(function (x) { var p = x.split('|'); return upCard(p[1], p[0], 'cart'); }).join('') + '</div></div>';
}
// «Дополнить заказ?» — один раз перед отправкой, если есть что предложить; true — шторка показана
function upSheet(again) {
  var U = upCfg();
  if (!U || !U.sheet || MPREVIEW || PREVIEW || (!again && (UP.sheetDone || UP.noCount >= 2))) return false;
  var f = upForCart(6, 'sheet');
  if (!f.ids.length && !again) return false;
  sheetMode = 'upsell';
  var title = f.rules.length === 1 && f.rules[0].nodrink ? tr(f.rules[0].text) : t('upSheetT');
  $('sheet').innerHTML = '<div class="upsheet"><div class="uphead">' + upAvatar() + '<div class="upbub">' + esc(title) + '</div></div>' +
    '<div class="uprow">' + f.ids.map(function (x) { var p = x.split('|'); return upCard(p[1], p[0], 'sheet'); }).join('') + '</div>' +
    '<div class="total"><span>' + t('total') + '</span><span>' + money(cartTotal()) + '</span></div>' +
    '<button class="big" data-upsend="1">' + esc(t('upSend')) + '</button>' +
    '<button class="big ghost" data-upback="1">' + esc(t('upBack')) + '</button></div>';
  $('cart').className = 'overlay show';
  return true;
}

function sendOrder() {
  if (MPREVIEW) return;
  if (sending) return;
  sending = true;
  var items = Object.keys(cart).map(function (k) { var p = k.split('|'); return { id: p[0], opt: p[1] || '', mods: p[2] ? p[2].split(',') : [], qty: cart[k] }; });
  var body = { items: items, rid: newRid() };
  // нет связи — заказ встаёт в очередь и уйдёт сам; корзина очищается, как после отправки
  var queued = function () {
    enqueue('/api/guest/order', body);
    cart = {};
    $('cart').className = 'overlay';
    toast(t('queued'));
    renderAll();
  };
  if (!online) { queued(); sending = false; flushOutbox(); return; }
  post('/api/guest/order', body).then(function (o) {
    if (!o.id) return;
    cart = {};
    UP.sheetDone = false;
    seen[o.id] = o.status + '|';
    $('cart').className = 'overlay';
    toast(t('sent'));
    renderAll();
    load();
  }).catch(queued).then(function () { sending = false; });
}

function call(type, scope, item) {
  if (MPREVIEW) return;
  if (isEntrance() || PREVIEW) return;
  var body = { type: type, scope: scope || '', rid: newRid() };
  if (item) body.item = item; // «Спросить официанта» у блюда — официант видит, какое блюдо
  var queued = function () {
    var same = outbox.some(function (x) { return x.path === '/api/guest/call' && x.body.type === type && x.body.scope === body.scope; });
    if (!same) enqueue('/api/guest/call', body);
    mergeQueued();
    toast(t('queued'));
    renderFooter();
  };
  if (!online) { queued(); flushOutbox(); return; }
  post('/api/guest/call', body).then(function (c) {
    if (!c.id) return;
    seen[c.id] = c.status + '|';
    if (!state.calls.some(function (x) { return x.id === c.id; })) state.calls.push(c);
    renderFooter();
  }).catch(queued);
}

// Телефон: «Мой счёт» или «Счёт всего стола»
function billAsk() {
  sheetMode = 'bill';
  $('sheet').innerHTML = '<h2>' + t('billAsk') + '</h2><button class="big" data-bill="me">' + t('myBill') + '</button>' +
    '<button class="big ghost" data-bill="table">' + t('tableBill') + '</button><button class="big ghost" data-close="1">' + t('close') + '</button>';
  $('cart').className = 'overlay show';
}

// Гость отменил случайный вызов
function cancelCall(type) {
  if (isEntrance() || PREVIEW) return;
  var c = activeCall(type);
  if (c && c.local) { // вызов ещё не ушёл — просто убираем из очереди
    unqueue(c.q);
    mergeQueued();
    toast(t('cancelled'));
    renderFooter();
    return;
  }
  post('/api/guest/cancel', { type: type, id: c ? c.id : '' }).then(function () {
    state.calls = state.calls.filter(function (x) { return c ? x.id !== c.id : x.type !== type; });
    toast(t('cancelled'));
    renderFooter();
    askWhy(c);
  }).catch(function () { toast(t('offline')); });
}

// Почему отменили вызов (вызов уже снят): официант подошёл, но не отметил «Иду»; не дождались; уже не нужно; случайно —
// для статистики ресторана. Отменили в первые 15 с — не спрашиваем (нажали по ошибке); не ответили за 15 с — окно закрывается
var whyTimer = null, whyCall = null;
function askWhy(c) {
  if (!c || !c.id || !c.at || Date.now() - c.at < 15000) return;
  whyCall = c;
  if ($('attract').style.display === 'block') hideAttract();
  sheetMode = 'why';
  $('sheet').innerHTML = '<h2>' + t('whyQ') + '</h2>' +
    '<button class="big" data-why="came">✅ ' + t(c.type === 'bill' ? 'whyCameBill' : 'whyCame') + '</button>' +
    '<button class="big ghost" data-why="waited">⏳ ' + t('whyWaited') + '</button>' +
    '<button class="big ghost" data-why="notneeded">👌 ' + t('whyNo') + '</button>' +
    '<button class="big ghost" data-why="mistake">✋ ' + t('whyMistake') + '</button>';
  $('cart').className = 'overlay show';
  clearTimeout(whyTimer);
  whyTimer = setTimeout(function () { if (sheetMode === 'why') { $('cart').className = 'overlay'; sheetMode = 'cart'; } }, 15000);
}
function sendWhy(why) {
  clearTimeout(whyTimer);
  $('cart').className = 'overlay';
  sheetMode = 'cart';
  if (whyCall) post('/api/guest/cancel-why', { id: whyCall.id, why: why }).then(function () {}, function () {});
  whyCall = null;
  toast(t('whyThanks'));
}

// ---------- Карусель акций, рекламы и ИИ-персонажа

// Слайды на языке гостя: акция, у которой на этом языке снята галочка «показывать», пропускается
function slides() {
  return ((state && state.slides) || []).filter(function (x) {
    if (x.off && x.off.indexOf(lang) >= 0) return false;
    return !x.strict || !!(x.images || {})[lang]; // реклама — только с картинкой на этом языке
  });
}
function width() { return $('attract').clientWidth; }

// Смена слайдов из настроек менеджера («Дизайн»): направление и длительность.
// next > 0 — следующий слайд стоит в ленте первым (въезжает слева или сверху), иначе — последним
function fx() {
  var d = (state && state.display) || {}, f = d.slideFx || 'ltr';
  var vert = f === 'ttb' || f === 'btt';
  return { vert: vert, next: f === 'ltr' || f === 'ttb' ? 1 : -1, ms: d.slideMs || 600,
    unit: vert ? $('ctrack').parentNode.clientHeight : width() };
}

var qrCache = {};
function qrSvg(text) {
  if (qrCache[text]) return qrCache[text];
  try {
    var q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return (qrCache[text] = q.createSvgTag(4, 8));
  } catch (e) { return ''; }
}

function slideHtml(s, current) {
  if (!s) return '';
  if (s.type === 'avatar') return avatarHtml(current);
  return frameHtml(s) +
    (s.type === 'ad' ? '<span class="tag">' + t('ad') + '</span>' : '') +
    // Кнопка заявки на рекламе (текст, место и форма — из портала)
    (s.type === 'ad' && s.cta ? '<button class="cta ' + qrClass(s.cta.pos) + ' shape-' + (s.cta.shape || 'rect') + '" data-cta="' + esc(s.id) + '">' + esc(tr(s.cta.text)) + '</button>' : '') +
    // Акция с ценой: заказ прямо со слайда
    (s.order && !isEntrance() ? '<button class="porder" data-porder="' + esc(s.order) + '">' + (s.price > 0 ? t('orderPromo') + ' · ' + (s.from ? fromPrice(s.price) : money(s.price)) : t('orderByPromo')) + '</button>' : '') +
    (s.qr || s.phone ? '<div class="contact ' + qrClass(s.qrPos) + ' size-' + (s.qrSize || 'm') + '">' +
      (s.qr ? '<div class="qr">' + qrSvg(s.qr) + '</div><div class="small">' + t('scan') + '</div>' : '') +
      (s.phone ? '<div class="phone">📞 ' + esc(s.phone) + '</div>' : '') + '</div>' : '') +
    (tr(s.title) || tr(s.text) ? captionHtml(s) : '');
}

// Подпись слайда. У блюда из меню (блюдо дня, «в показе акций») — кнопка «Заказать · цена» справа в строке названия
function captionHtml(s) {
  var order = s.type === 'item' && !isEntrance() && (PREVIEW || MENU[s.id]);
  return '<div class="cap' + (order ? ' withbtn' : '') + '"><b>' + esc(tr(s.title)) + (s.price && !order ? ' · ' + money(s.price) : '') + '</b>' +
    '<span>' + esc(tr(s.text)) + '</span>' +
    (order ? '<button class="iorder" data-porder="' + esc(s.id) + '">' + t('orderPromo') + ' · ' + money(s.price) + '</button>' : '') + '</div>';
}

// Картинка слайда с кадром из настроек: режим, сдвиг по вертикали, масштаб
// Сдвиг выбирает, какую часть исходной картинки показать (вниз — открывается верх картинки),
// масштаб увеличивает или уменьшает вокруг этой точки
function frameHtml(s) {
  var y = 50 - (Number(s.imgY) || 0), scale = (Number(s.imgScale) || 100) / 100;
  var fit = s.fit === 'contain' ? 'contain' : 'cover';
  var style = 'object-fit:' + fit + ';object-position:50% ' + y + '%;-webkit-transform-origin:50% ' + y + '%;transform-origin:50% ' + y + '%;' +
    '-webkit-transform:scale(' + scale + ');transform:scale(' + scale + ')';
  // Размытая подложка нужна, только если картинка не закрывает область целиком — так дешевле для планшета
  var gaps = fit === 'contain' || scale < 1;
  var src = imgOf(s);
  return (gaps ? '<img class="bgblur" src="' + esc(src) + '" alt="">' : '') +
    '<img class="bg" src="' + esc(src) + '" alt="" style="' + style + '">';
}

// Картинка акции на языке гостя; если такой нет — английская или любая другая
function imgOf(s) {
  var m = s.images || {};
  return m[lang] || m.en || m.ru || m.th || m.zh || s.image;
}

// «top-right» → ряд top, столбец right; старые «middle-…» — это ряд «выше центра»
function qrClass(pos) {
  var p = String(pos || 'top-right').replace('middle', 'upper').split('-');
  return 'row-' + p[0] + ' col-' + (p[1] || 'right');
}

// Лента из трёх слайдов: следующий, текущий, предыдущий — порядок и ось по настройке смены слайдов
// Картинки слайдов на всех языках — заранее в кэш (в паузе), чтобы при смене языка картинка не догружалась
var preloaded = {};
function preloadSlides() {
  var urls = [];
  slidesAll().forEach(function (x) { var m = x.images || {}; for (var k in m) urls.push(m[k]); if (x.image) urls.push(x.image); });
  urls.filter(function (u) { return u && !preloaded[u]; }).forEach(function (u, i) {
    preloaded[u] = 1;
    setTimeout(function () { new Image().src = u; }, 2000 + i * 400);
  });
}
function slidesAll() { return (state && state.slides) || []; }

function renderCarousel() {
  preloadSlides();
  var list = slides(), n = list.length;
  $('attract').className = '';
  if (!n && !state.avatar) return;
  if (!state.avatar) avShowing = false;
  if (!n) avShowing = true;
  if (n) cIdx = ((cIdx % n) + n) % n;
  var cur = avShowing ? AV : list[cIdx];
  // Слева — следующий слайд (или персонаж, если подошло его время), справа — предыдущий: показ едет слева направо
  cNext = avatarDue() ? AV : n ? list[(cIdx + 1) % n] : null;
  cPrev = n ? (avShowing ? list[cIdx] : list[(cIdx - 1 + n) % n]) : null;
  if (cNext === cur) cNext = null;
  if (cPrev === cur) cPrev = null;
  var f = fx(), a = f.next > 0 ? cNext : cPrev, b = f.next > 0 ? cPrev : cNext;
  $('ctrack').className = f.vert ? 'vert' : '';
  $('ctrack').innerHTML = '<div class="slide">' + slideHtml(a) + '</div>' +
    '<div class="slide" id="curSlide">' + slideHtml(cur, true) + '</div>' +
    '<div class="slide">' + slideHtml(b) + '</div>';
  setTrack(0, false);
  // слайд через один — заранее в кэш, чтобы смена не ждала загрузки картинки
  if (n > 2) { var after = list[(cIdx + 2) % n]; if (after && after.image) new Image().src = imgOf(after); }
  $('cdots').innerHTML = n > 1 ? list.map(function (s, i) { return '<i class="' + (!avShowing && i === cIdx ? 'on' : '') + '"></i>'; }).join('') : '';
  styleCaptions(state.display || {});
  onSlideShown(cur);
}

function avatarDue() {
  var a = state.avatar;
  return avatarAuto() && !avShowing && Date.now() - lastAvatarAt >= (a.everyMin || 3) * 60000;
}

// Сам по расписанию персонаж приходит, пока стол ничего не заказал и гость не ответил «уже заказали»
// (через 45 минут после такого ответа — снова, это уже могут быть другие гости). По кнопке чата — всегда.
var avDismissedAt = 0;
function avatarAuto() {
  return !!state.avatar && !(state.orders || []).length && Date.now() - avDismissedAt > 45 * 60000;
}

// d — сдвиг ленты вдоль направления показа, px (0 — виден текущий слайд)
function setTrack(d, animate) {
  var tk = $('ctrack'), f = fx();
  tk.style.transition = animate ? 'transform ' + f.ms + 'ms ease-in-out' : 'none';
  tk.style.transform = (f.vert ? 'translateY(' : 'translateX(') + (d - f.unit) + 'px)';
}

// dir = 1 — следующий (лента уезжает вправо), -1 — предыдущий
function slideGo(dir) {
  if (cBusy) return;
  // Время персонажа подошло, пока показывался текущий слайд, — подставляем его следующим
  if (dir > 0 && avatarDue() && cNext !== AV) {
    cNext = AV;
    $('ctrack')[fx().next > 0 ? 'firstChild' : 'lastChild'].innerHTML = slideHtml(AV);
  }
  var target = dir > 0 ? cNext : cPrev;
  if (!target) { setTrack(0, true); return; }
  cBusy = true;
  stopSpeech();
  var f = fx();
  setTrack(dir * f.next * f.unit, true);
  setTimeout(function () {
    var n = slides().length;
    if (target === AV) avShowing = true;
    else if (dir > 0) { if (n) cIdx = avShowing && target === slides()[cIdx] ? cIdx : (cIdx + 1) % n; avShowing = false; }
    else if (avShowing) avShowing = false;
    else if (n) cIdx = (cIdx - 1 + n) % n;
    cBusy = false;
    renderCarousel();
  }, f.ms + 20);
}

var quietRender = false;
function onSlideShown(s) {
  if (quietRender) return; // тот же слайд на другом языке — не новый показ
  slideAt = Date.now();
  if ((s.type === 'ad' || s.type === 'promo') && !PREVIEW) post('/api/guest/impression', { id: s.id }).catch(function () {});
  if (s.type === 'avatar' && !PREVIEW) post('/api/guest/impression', { kind: 'avatar' }).catch(function () {});
  if (s.type === 'avatar') {
    lastAvatarAt = Date.now();
    holdUntil = Math.max(holdUntil, Date.now() + (state.avatar.durationSec || 20) * 1000);
    avatarStart();
  }
}

// Оформление подписей слайдов из настроек менеджера
function styleCaptions(ds) {
  var hex = /^#[0-9a-f]{6}$/i.test(ds.bgColor) ? ds.bgColor : '#000000';
  var rgb = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(',');
  var caps = document.querySelectorAll('#ctrack .cap');
  for (var i = 0; i < caps.length; i++) {
    caps[i].style.color = ds.textColor || '#fff';
    caps[i].style.background = 'linear-gradient(rgba(' + rgb + ',0), rgba(' + rgb + ',.88) 45%)';
    caps[i].querySelector('b').style.fontSize = (ds.titleSize || 38) / 8 + 'vw';
    caps[i].querySelector('span').style.fontSize = (ds.textSize || 22) / 8 + 'vw';
  }
}

// Стрелки карусели: вид и размер из «Дизайна» (vendor/arrows.js)
var arrowSig = '';
function applyArrows(ds) {
  var st = ARROWS.indexOf(ds.arrows) >= 0 ? ds.arrows : 'circle', box = document.querySelector('#attract .astage');
  box.style.setProperty('--arw', String((Number(ds.arrowSize) || 100) / 100));
  if (st === arrowSig) return;
  arrowSig = st;
  for (var i = 0; i < ARROWS.length; i++) box.classList.remove('arw-' + ARROWS[i]);
  box.classList.add('arw-' + st);
  var bs = box.querySelectorAll('.arrow');
  for (var j = 0; j < bs.length; j++) bs[j].innerHTML = arrowGlyph(st, Number(bs[j].dataset.cgo));
}

function renderAttract() {
  applyArrows(state.display || {});
  setHtml($('aTitle'), tableBadge());
  $('acts').innerHTML = (isEntrance() ? '' : '<button class="abtn' + (activeCall('waiter') ? ' alarm' : '') + '" id="aCall">' + t(activeCall('waiter') ? 'cancelCall' : 'call') + '</button>') +

// index — номер слайда или 'avatar'; без него — обычный старт показа (с персонажа, если так настроено)
function showAttract(index) {

function hideAttract() {

// Листание пальцем вдоль направления показа: тянут со стороны следующего слайда — следующий, обратно — предыдущий
$('attract').addEventListener('touchstart', function (e) {
  if (e.target.closest('.avpanel')) { holdUntil = Date.now() + 30000; return; }
  if (e.target.closest('button')) return;
  cDrag = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0 };
}, { passive: true });
$('attract').addEventListener('touchmove', function (e) {
  if (!cDrag || cBusy) return;
  cDrag.dx = fx().vert ? e.touches[0].clientY - cDrag.y : e.touches[0].clientX - cDrag.x;
  if (Math.abs(cDrag.dx) > 10) setTrack(cDrag.dx, false);
}, { passive: true });
$('attract').addEventListener('touchend', function () {
  if (!cDrag) return;
  var dx = cDrag.dx * fx().next; // > 0 — тянут в сторону, откуда въезжает следующий слайд
  cDrag = null;
  holdUntil = Date.now() + HOLD_AFTER_SWIPE_MS;
  if (dx > 60) slideGo(1);
  else if (dx < -60) slideGo(-1);
  else setTrack(0, true);
});

// ---------- ИИ-персонаж: говорит голосом через динамик и дублирует реплику в «пузыре»; гость отвечает кнопками

var avNode = null, avTalkTimer = null, avDoneTimer = null;

// У соседних (уезжающих) слайдов персонаж без id: управляем только текущим

function avatarStart() {

// Узел сценария: { say: {ru, en…}, buttons: [{ label: {…}, go: 'узел' | 'recommend' | 'menu' | 'waiter' | 'dish:<id>' }] }
// Узел сценария: { say: {ru, en…}, buttons: [{ label: {…}, go: 'узел' | 'recommend' | 'diet' | 'tag:<отметка>' | 'menu' | 'waiter' | 'dish:<id>' }] }
function avatarShow(id, greet) {
  var a = state.avatar, nodes = (a.dialog || {}).nodes || {}, node;
  if (id === 'recommend') node = recommendNode();
  else if (id.indexOf('tag:') === 0) node = dietListNode(id.slice(4));
  else if (id === 'diet') node = dietNode();
  else if (id === 'orderedReply') node = { say: t('needMe'), buttons: [{ label: t('menu'), go: 'menu' }] };
  else node = nodes[id];
  if (!node) {
    node = {
      say: (a.greetings || [])[0],
      buttons: [{ label: t('askRec'), go: 'recommend' }, { label: t('call'), go: 'waiter' }, { label: t('menu'), go: 'menu' }],
    };
  }
  var buttons = (node.buttons || []).slice();
  // Приветствие: случайная фраза менеджера; плюс кнопка особых пожеланий, если они включены
  var say = tr(node.say);
  // Приветствие — случайный вариант из ЛК ресторана (или из пакета персонажа) на языке гостя
  if (greet) {
    avSuggested = [];
    var gl = (a.greetings || []).filter(function (g) { return g[lang]; });
    if (!gl.length) gl = a.greetings || [];
    if (gl.length) say = tr(gl[Math.floor(Math.random() * gl.length)]) || say;
    if ((a.filters || []).length) buttons.splice(1, 0, { label: t('diet'), go: 'diet' });
    if (!isEntrance()) buttons.push({ label: t('alreadyOrdered'), go: 'ordered' });

  avNode = { buttons: buttons.filter(function (b) { return !(isEntrance() && b.go === 'waiter'); }) };

  $('avOpts').innerHTML = avNode.buttons.map(function (b, i) {
    return '<button data-av="' + i + '">' + esc(tr(b.label)) + '</button>';

// Все блюда с выбранной отметкой — лентой в панели
function dietListNode(tag) {

});
