function dietNode() {
  return {
    say: t('dietAsk'),
    buttons: (state.avatar.filters || []).map(function (f) { return { label: TAGS[f], go: 'tag:' + f }; })
      .concat([{ label: t('prev'), go: 'hello' }]),
  };
}

// Совет из меню: по отметке (без глютена, веганское…) или сначала блюда дня, потом случайные блюда.
// Уже предложенные в этом разговоре пропускаем; когда всё перебрали — начинаем заново.
// Случайный вариант фразы-рекомендации (из ЛК ресторана или пакета персонажа): название блюда — на месте {dish},
// а если его в фразе нет — в конце
function recPhrase(day, name) {
  var list = (((state.avatar || {}).phrases || {})[day ? 'dayDish' : 'recommend'] || [])
    .filter(function (o) { return o[lang]; });
  if (!list.length) return { say: (day ? t('dayRec') : t('recommend')) + ': ' + name + '!' };
  var text = list[Math.floor(Math.random() * list.length)][lang];
  return { say: text.indexOf('{dish}') >= 0 ? text.split('{dish}').join(name) : text.replace(/\s+$/, '') + ' ' + name + '!' };
}

function recommendNode(tag) {
  var pick = function () {
    var fresh = function (i) { return avSuggested.indexOf(i.id) < 0; };
    if (tag) return { list: state.menu.filter(function (i) { return (i.tags || []).indexOf(tag) >= 0 && fresh(i); }) };
    var day = state.menu.filter(function (i) { return i.dayDish && fresh(i); });
    if (day.length) return { list: day, day: true };
    var any = state.menu.filter(function (i) { return i.photo && fresh(i); });
    return { list: any.length ? any : state.menu.filter(fresh) };
  };
  var p = pick();
  if (!p.list.length && avSuggested.length) { avSuggested = []; p = pick(); }
  var dish = p.list[Math.floor(Math.random() * p.list.length)];
  if (!dish) return { say: t('noDish'), buttons: [{ label: t('call'), go: 'waiter' }, { label: t('prev'), go: 'hello' }] };
  avSuggested.push(dish.id);
  gEvent('av_rec', dish.id);
  // Цену не произносим — она на карточке блюда; фраза — случайный вариант из пакета персонажа
  // у строки акции в меню название «Акция 4: …» — вслух говорим только само название
  var nm = tr(dish.name);
  if (/^promo-/.test(dish.id)) nm = nm.replace(/^[^:]{1,20}\d+\s*:\s*/, '');
  var rp = tag ? { say: t('recommend') + ' (' + tr(TAGS[tag]) + '): ' + nm + '!' } : recPhrase(p.day, nm);
  return {
    say: rp.say,
    dish: dish.id,
    buttons: [{ label: t('showDish'), go: 'dish:' + dish.id }, { label: t('another'), go: tag ? 'tag:' + tag : 'recommend' }, { label: t('menu'), go: 'menu' }],
  };
}

function avatarAction(go) {
  holdUntil = Date.now() + 30000;
  if (!avTalked) { avTalked = true; gEvent('av_talk'); }
  if (go.indexOf('dish:') === 0) gEvent('av_dish', go.slice(5));
  if (go === 'ordered') {
    avDismissedAt = Date.now();
    holdUntil = Date.now() + 8000; // договорит и уступит место карусели
    return avatarShow('orderedReply');
  }
  if (go === 'menu') return hideAttract();
  if (go === 'waiter') { call('waiter'); return; }
  if (go.indexOf('dish:') === 0) {
    var dish = MENU[go.slice(5)];
    hideAttract();
    if (dish) { renderAll(); goCat(dish.dayDish ? DAY : tr(dish.cat) || '—'); }
    return;
  }
  avatarShow(go, go === ((state.avatar.dialog || {}).start || 'hello'));
}

var avAudio = null;
// Говорит только голос ElevenLabs: сервер озвучивает фразу (готовый MP3 хранит и отдаёт повторно).
// Голоса нет, нет интернета или файл не проигрался — персонаж молчит, гость читает текст
function speak(text) {
  var a = state.avatar;
  if (avAudio) { avAudio.pause(); avAudio = null; }
  talking(false);
  if (!a || !a.speak || !a.tts || !text) return;
  if (window.JetAgent && window.JetAgent.stop) window.JetAgent.stop();
  talking(true);
  clearTimeout(avDoneTimer);
  var au = avAudio = new Audio('/api/tts?d=' + encodeURIComponent(D) + '&t=' + encodeURIComponent(text));
  var done = function () { if (avAudio === au) { avAudio = null; talking(false); } };
  au.onended = done;
  au.onerror = done;
  avDoneTimer = setTimeout(function () { talking(false); }, 30000);
  var p = au.play();
  if (p && p.catch) p.catch(done);
}

// Теги ElevenLabs ([giggles], [whispering]…) озвучиваются, но на экране их не показываем
function plain(text) { return String(text || '').replace(/\s*\[[^\]]*\]/g, '').trim(); }

// Агент на планшете сообщает, что фраза произнесена
window.jetSpeechDone = function () { talking(false); };

function stopSpeech() {
  talking(false);
  if (avAudio) { avAudio.pause(); avAudio = null; }
  if (window.JetAgent && window.JetAgent.stop) window.JetAgent.stop();
  else if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// Пока персонаж говорит — меняем картинки «рот закрыт / открыт»
function talking(on) {
  clearInterval(avTalkTimer);
  var img = $('avImg'), a = state && state.avatar;
  if (!img || !a) return;
  img.src = a.images.idle;
  if (!on) return;
  var open = false;
  avTalkTimer = setInterval(function () {
    open = !open;
    if ($('avImg')) $('avImg').src = open ? a.images.talk : a.images.idle;
  }, 180);
}

// ---------- Касания

document.addEventListener('click', function (e) {
  if (!state) return;
  // «О системе» (нажатие на номер стола на планшете)
  if (e.target.closest('#info')) {
    var ib = e.target.closest('button');
    if ((e.target.id === 'info' && infoBg) || (ib && ib.dataset.iclose)) closeInfo();
    else if (ib && ib.dataset.isend) sendInfo();
    else infoArm();
    return;
  }
  if (e.target.closest('.tno') && !PHONE && !PREVIEW) { openInfo(); return; }
  // Форма заявки по рекламе
  if (e.target.closest('#lead')) {
    var lb = e.target.closest('button');
    if (lb && lb.dataset.lclose) closeLead();
    else if (lb && lb.dataset.lsend) sendLead();
    return;
  }
  // нажатие мимо карточки QR-кода (на затемнение) — закрыть
  if (e.target.id === 'qrBox') { qrClose(); return; }
  if (e.target.closest('#attract')) {
    var a = e.target.closest('button');
    holdUntil = Date.now() + HOLD_AFTER_SWIPE_MS;
    // Касание карточки блюда у персонажа — открыть это блюдо в меню
    var card = e.target.closest('[data-avcard]');
    if (card && !a) return avatarAction('dish:' + card.dataset.avcard);
    if (!a) return;
    if (a.dataset.alang) { lang = a.dataset.alang; quietRender = true; try { renderAttract(); renderCallBar(); } finally { quietRender = false; } }
    else if (a.dataset.cgo) slideGo(Number(a.dataset.cgo));
    else if (a.dataset.qr) { holdUntil = Date.now() + 60000; qrOpen(); }
    else if (a.dataset.avadd) avatarAdd(a.dataset.avadd);
    else if (a.dataset.porder) promoOrder(a.dataset.porder);
    else if (a.dataset.cta) openLead(a.dataset.cta);
    else if (a.dataset.av !== undefined && avNode) avatarAction(avNode.buttons[Number(a.dataset.av)].go);
    else if (a.dataset.avchat) { if (!avShowing) { avShowing = true; renderCarousel(); } }
    else if (a.id === 'aMenu') { hideAttract(); var ost = orderStat(); if (cartCount() || (ost && /^(pending|cooking|ready)$/.test(ost.kind))) { renderCart(); $('cart').className = 'overlay show'; } else qrFlash(); }
    else if (a.id === 'aCall') { if (activeCall('waiter')) cancelCall('waiter'); else { hideAttract(); call('waiter'); } }
    return;
  }
  // своя клавиатура поиска
  var kb = e.target.closest('#kbd button');
  if (kb) {
    var kd = kb.dataset;
    if (kd.k !== undefined) kbdType(mq + kd.k);
    else if (kd.kdel) kbdType(mq.slice(0, -1));
    else if (kd.kshift) { kbdShift = !kbdShift; kbdOpen(); }
    else if (kd.klang) { var ls = kbdLangs(); kbdLang = ls[(ls.indexOf(kbdLang) + 1) % ls.length]; kbdShift = false; kbdOpen(); }
    else if (kd.kok) kbdClose();
    return;
  }
  if (!e.target.closest('#kbd, #msearch')) kbdClose();
  // нажали на блюдо (не на «Добавить») — карточка блюда
  var dish = e.target.closest('[data-dish]');
  if (dish && !e.target.closest('button')) { openOptions(dish.dataset.dish, true); return; }
  var b = e.target.closest('button');
  if (!b) return;
  var d = b.dataset;
  if (d.mgroup) { mgroup = d.mgroup; cat = null; renderAll(); $('items').scrollTop = 0; return; }
  if (d.mqx) { mq = ''; $('mq').value = ''; renderAll(); if (!$('kbd').hidden) kbdOpen(); return; }
  if (d.lang) { lang = d.lang; renderAll(); }
  else if (d.cat) goCat(d.cat);
  else if (d.diet) openDiet();
  else if (d.tagf !== undefined) { cat = d.tagf ? 'tag:' + d.tagf : null; $('cart').className = 'overlay'; renderAll(); $('items').scrollTop = 0; }
  else if (d.add) { if (hasChoice(MENU[d.add])) openOptions(d.add); else { cart[d.add] = (cart[d.add] || 0) + 1; renderAll(); upAfterAdd(d.add); } }
  else if (d.upadd) upAdd(d.upadd);
  else if (d.upno) upDecline(d.upno);
  else if (d.upsend) { UP.sheetDone = true; sendOrder(); }
  else if (d.upback) { UP.sheetDone = true; renderCart(); }
  else if (d.pv) { pick.opt = d.pv; renderPick(); }
  else if (d.po) pickToggle(Number(d.pg), d.po);
  else if (d.pq) { pick.qty = Math.max(1, Math.min(99, pick.qty + Number(d.pq))); renderPick(); }
  else if (d.padd) {
    // «выберите 2–3»: пока не выбрано сколько нужно — подсказываем, не добавляем
    var short = (MENU[pick.id].groups || []).filter(function (g) {
      var got = g.opts.filter(function (o) { return pick.mods.indexOf(o.id) >= 0; }).length;
      return (g.min && got < g.min) || (g.req && !got);
    })[0];
    if (short) { toast(t('pickNeed').replace('{n}', short.min || 1).replace('{g}', tr(short.name))); return; }
    var pk = hasChoice(MENU[pick.id]) ? pickKey() : pick.id; cart[pk] = (cart[pk] || 0) + pick.qty; $('cart').className = 'overlay'; toast(t('added')); renderAll();
    upAfterAdd(pick.id);
  }
  else if (d.inc) { cart[d.inc]++; renderCart(); renderAll(); }
  else if (d.dec) { if (--cart[d.dec] <= 0) delete cart[d.dec]; renderCart(); renderAll(); }
  else if (d.send) { if (!upSheet()) sendOrder(); }
  else if (d.why) sendWhy(d.why);
  else if (d.askw) { $('cart').className = 'overlay'; call('waiter', '', d.askw); toast(t('askSent')); }
  else if (d.close) $('cart').className = 'overlay';
  else if (b.id === 'cartBtn') { renderCart(); $('cart').className = 'overlay show'; }
  else if (b.id === 'callBtn') { if (activeCall('waiter')) cancelCall('waiter'); else call('waiter'); }
  else if (b.id === 'billBtn') { if (activeCall('bill')) cancelCall('bill'); else if (PHONE) billAsk(); else call('bill'); }
  else if (d.bill) { $('cart').className = 'overlay'; call('bill', d.bill === 'me' ? 'me' : ''); }
  else if (d.qr) { hideAttract(); qrOpen(); }
  else if (d.qrclose) qrClose();
  else if (d.join) joinTable(d.join === 'skip');
  else if (b.id === 'backBtn') showAttract();
  else if (d.avchat) showAttract('avatar');
});

document.addEventListener('pointerdown', function () { lastTouch = Date.now(); if (Date.now() - agentPing > 10000) agentActivity(); }, true);

// Простой: карусель после заданной паузы (у входа — всегда), автоперелистывание.
// Неотправленная корзина очищается через N минут без касаний, язык гостя держится, пока стол не закрыли
// («Закрыть стол» у официанта), а если стол забыли закрыть — сбрасывается после долгого простоя (сроки — в ЛК → «Устройства»)
setInterval(function () {
  if (!state || PHONE) return;
  var now = Date.now(), idle = now - lastTouch, ds = state.display || {}, tm = state.timers || {}, changed = false;
  if (cartCount() && idle > (tm.cartMin || 10) * 60000) { cart = {}; $('cart').className = 'overlay'; changed = true; }
  if (lang !== defLang() && idle > (tm.langMin || 120) * 60000) { lang = defLang(); changed = true; }
  if (changed) renderAll();
  var visible = $('attract').style.display === 'block';
  if (!visible && idle > (ds.idleSec || 60) * 1000 && slides().length) showAttract();
  else if (visible && now > holdUntil && now - slideAt >= (ds.slideSec || 7) * 1000) slideGo(1);
}, 1000);

if (PREVIEW) {
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.slide) return;
    var d = e.data;
    state = {
      restaurant: { name: '', langs: d.langs || ['ru', 'en', 'th', 'zh'] }, mode: 'table', menu: [], calls: [], orders: [],
      slides: [d.slide], display: d.display || {}, avatar: null,
    };
    lang = d.lang || state.restaurant.langs[0];
    show('msg', false);
    holdUntil = Date.now() + 3600000; // в предпросмотре слайд не листается сам
    showAttract(0);
    holdUntil = Date.now() + 3600000;
  });
} else {
  load();
  setInterval(load, 5000);
  setInterval(flushOutbox, 5000);
}
</script>
