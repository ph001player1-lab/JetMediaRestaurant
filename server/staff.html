<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f7f3ee; color: #1f1a17; }
  .box { max-width: 420px; margin: 12vh auto; padding: 24px; background: #fff; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; }
  input, button { font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; }
  button { background: #1f1a17; color: #fff; border: 0; cursor: pointer; }
  .top { position: sticky; top: 0; z-index: 10; background: #fff; box-shadow: 0 1px 0 #eee; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
  header .who { flex: 1; min-width: 140px; display: flex; flex-direction: column; }
  header .who b { font-size: 17px; }
  header .who span { color: #8a7f76; font-size: 14px; }
  header .ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  header button { font-size: 14px; padding: 8px 12px; }
  .langs button { background: none; color: inherit; border: 1px solid #ddd; padding: 6px 10px; font-size: 14px; }
  #shiftBtn { background: #2e7d32; }
  #shiftBtn.off { background: #c62828; }
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; border-top: 1px solid #eee; }
  .line { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .line span { flex: 1; }
  .line button { width: 40px; padding: 8px 0; }
  .results button { display: block; width: 100%; text-align: left; margin: 4px 0; background: #efe7df; color: #1f1a17; font-size: 15px; padding: 10px; }
  .tabs button { background: none; color: inherit; font-size: 15px; padding: 10px 12px; border-radius: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { border-color: #1f1a17; font-weight: 600; }
  .ed { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; display: grid; gap: 8px; }
  .ed label { display: flex; flex-direction: column; font-size: 13px; color: #8a7f76; gap: 4px; }
  .ed label.chk { flex-direction: row; align-items: center; gap: 8px; color: inherit; font-size: 16px; }
  .ed input, .ed select, .bar select { font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
  .ed img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; }
  .ed input[type=color] { width: 96px; height: 48px; padding: 3px; }
  .ed .del { background: #efe7df; color: #c62828; justify-self: start; font-size: 15px; padding: 8px 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 12px 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  .chips button { background: #fff; color: inherit; border: 1px solid #ddd; font-size: 14px; padding: 8px 12px; white-space: nowrap; }
  .chips button.on { background: #1f1a17; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; font-size: 14px; display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; }
  .tile img, .tile .noimg { width: 100%; height: 100px; object-fit: cover; background: #eee4da; }
  .tile > div, .tile > b, .tile > span { padding: 0 8px; }
  .tile.off { opacity: .45; }
  .msearch { width: 100%; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal .ed { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; margin: 0; border-radius: 16px 16px 0 0; }
  .ghostbtn { background: #efe7df; color: #1f1a17; }
  main { padding: 0 16px 32px; max-width: 720px; margin: auto; }
  .banner { background: #fff3cd; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .banner button { margin-top: 8px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 6px solid #c8553d; }
  .card.ack, .card.confirmed { border-color: #2e7d32; }
  .card.rejected { border-color: #999; opacity: .6; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .card button { margin: 8px 8px 0 0; font-size: 16px; padding: 10px 14px; }
  #tables button { margin: 4px; background: #efe7df; color: #1f1a17; }
  .empty { color: #8a7f76; }
  .err { color: #c62828; min-height: 1em; }

let lang = localStorage.lang || 'en';
let token = localStorage.token || '';

const $ = (id) => document.getElementById(id);
const t = (k) => (T[lang] || T.en)[k] || k;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const ago = (ms) => `${Math.max(0, Math.floor((Date.now() - ms) / 60000))} min`;
const itemName = (n) => (typeof n === 'string' ? n : n[lang] || n.en || n.th || Object.values(n)[0] || '');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function texts() {
  document.querySelectorAll('[data-t]').forEach((el) => {
    el[el.tagName === 'INPUT' ? 'placeholder' : 'textContent'] = t(el.dataset.t);
  });
  document.querySelectorAll('[data-l]').forEach((b) => (b.style.fontWeight = b.dataset.l === lang ? '700' : '400'));
}

async function api(path, body) {
  const r = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : undefined);
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error), { status: r.status });
  return j;
}

// Сигнал и вибрация, пока страница открыта; на заблокированном телефоне работают push-уведомления
function beep() {
  if (audio) {
    for (const d of [0, 0.5]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(audio.destination);
      o.start(audio.currentTime + d);
      o.stop(audio.currentTime + d + 0.3);
    }
  }
  navigator.vibrate?.([300, 150, 300]);
}

async function refresh() {
  try {
    render(await api(`/api/staff/state?token=${encodeURIComponent(token)}`));
    $('login').hidden = true;
    $('work').hidden = false;
  } catch (e) {
    if (e.status === 401) logout();
  }
}

function logout() {
  if (token) api('/api/staff/logout', { token }).catch(() => {});
  clearInterval(timer);
  localStorage.removeItem('token');
  token = '';
  $('work').hidden = true;
  $('login').hidden = false;
}

async function login() {
  try {
    const r = await api('/api/staff/login', { code: $('code').value, pin: $('pin').value, lang });
    token = localStorage.token = r.token;
    localStorage.code = $('code').value;
    $('pin').value = '';
    startTimer();
    await refresh();
  } catch {
    $('err').textContent = t('wrong');
  }
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(refresh, 3000);
  navigator.wakeLock?.request('screen').catch(() => {});
}

function urlB64ToBytes(s) {
  const raw = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function enablePush() {
  if (!canPush) return alert(t(isIOS && !standalone ? 'iosHint' : 'noPush'));
  if (await Notification.requestPermission() !== 'granted') return alert(t('denied'));
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription())
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(last.vapidKey) });
  await api('/api/staff/subscribe', { token, sub: sub.toJSON(), lang });
  refresh();
}

function render(s) {
  // Вышла новая версия приложения — перезагружаемся, если ничего не редактируется
  if (appBuild && s.build !== appBuild && !$('tWork').hidden && $('modal').hidden) return location.reload();
  appBuild ??= s.build;
  last = s;
  $('rname').textContent = s.restaurant.name;
  $('who').textContent = s.me.name;
  $('shiftBtn').textContent = t(s.me.onShift ? 'shiftOn' : 'shiftOff');
  $('shiftBtn').className = s.me.onShift ? '' : 'off';
  $('pushBanner').hidden = s.me.push;
  $('pushText').textContent = t(isIOS && !standalone ? 'iosHint' : 'pushText');
  $('pushBtn').hidden = isIOS && !standalone;
  $('tabs').hidden = s.me.role !== 'manager';

  let fresh = false;
  for (const x of [...s.calls.filter((c) => c.status === 'new'), ...s.orders.filter((o) => o.status === 'pending')]) {
    if (!seen.has(x.id)) { seen.add(x.id); fresh = true; }
  }
  if (fresh && !first) beep();
  first = false;

  const btn = (kind, id, action, label) => `<button data-act="${kind}|${esc(id)}|${action}">${t(label)}</button>`;
  const by = (x) => (x.by ? ` · ${esc(x.by)}` : '');

  $('calls').innerHTML = s.calls.map((c) => `<div class="card ${c.status}">
      <b>${t('table')} ${esc(c.table)}</b> · ${t(c.type)} · ${ago(c.at)}${by(c)}
      <div>${c.status === 'new' ? btn('call', c.id, 'ack', 'going') : ''}${btn('call', c.id, 'done', 'done')}</div>
    </div>`).join('') || `<p class="empty">${t('none')}</p>`;

  $('orders').innerHTML = s.orders.map((o) => `<div class="card ${o.ackAt && o.status === 'pending' ? 'ack' : o.status}">
      <b>${t('table')} ${esc(o.table)}</b> · ${ago(o.at)} · ${t(o.status)}${by(o)}
      ${o.ackBy ? ` · ${t('going')}: ${esc(o.ackBy)}` : ''}${o.editedBy ? ` · ${t('editedBy')}: ${esc(o.editedBy)}` : ''}
      <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(itemName(i.name))}</li>`).join('')}</ul>
      <b>฿${o.total.toLocaleString('en')}</b>
      <div>
        ${o.status === 'pending' && !o.ackAt ? btn('order', o.id, 'ack', 'going') : ''}
        ${o.status === 'pending' ? btn('order', o.id, 'confirm', 'confirm') : ''}
        ${o.status !== 'rejected' ? `<button data-oedit="${esc(o.id)}">${t('edit')}</button>` : ''}
        ${o.status === 'confirmed' && !s.restaurant.pos ? btn('table', o.table, 'paid', 'paid') : ''}
        ${o.status === 'pending' ? btn('order', o.id, 'reject', 'reject') : ''}
      </div>
    </div>`).join('') || `<p class="empty">${t('none')}</p>`;

  const busy = [...new Set([...s.calls, ...s.orders].map((x) => x.table))];
  $('tables').innerHTML = busy.map((tb) => `<div>${s.restaurant.pos ? '' : `<button data-act="table|${esc(tb)}|paid">${t('table')} ${esc(tb)}: ${t('paid')}</button>`}
    <button data-act="table|${esc(tb)}|close">${t('table')} ${esc(tb)} ${t('free')}</button></div>`).join('')
    || `<p class="empty">${t('none')}</p>`;
}

document.addEventListener('click', async (e) => {
  // Звук в браузере разрешён только после касания
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  audio.resume?.();
  const tile = e.target.closest('[data-edit]');
  if (tile) return openItem(Number(tile.dataset.edit));
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.l) {
    lang = localStorage.lang = b.dataset.l;
    texts();
    if (last) render(last);
    if (mgr) renderManager();
    // язык push-уведомлений тоже меняем
    if (last?.me.push) enablePush();
  } else if (b.dataset.act) {
    const [kind, id, action] = b.dataset.act.split('|');
    await api('/api/staff/action', { token, kind, id, action });
    refresh();
  } else if (b.dataset.oedit) {
    openOrderEditor(b.dataset.oedit);
  } else if (b.dataset.oinc || b.dataset.odec) {
    const l = oedit.lines[Number(b.dataset.oinc ?? b.dataset.odec)];
    l.qty += b.dataset.oinc ? 1 : -1;
    oedit.lines = oedit.lines.filter((x) => x.qty > 0);
    renderOrderEditor();
  } else if (b.dataset.oadd) {
    addOrderLine(b.dataset.oadd);
    oedit.q = '';
    renderOrderEditor();
  } else if (b.dataset.osave) {
    if (oedit.lines.length) await api('/api/staff/action', { token, kind: 'order', id: oedit.id, action: 'edit', items: oedit.lines });
    closeItem();
    refresh();
  } else if (b.dataset.oclose) {
    closeItem();
  } else if (b.dataset.mcat !== undefined) {
    mcat = b.dataset.mcat;
    renderGrid();
  } else if (b.dataset.newitem) {
    openItem(-1);
  } else if (b.dataset.msave) {
    const r = mgr.restaurant;
    if (medit >= 0) r.menu[medit] = r.draft[0]; else r.menu.push(r.draft[0]);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.mclose) {
    closeItem();
  } else if (b.dataset.mdel) {
    mgr.restaurant.menu.splice(medit, 1);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.aisave) {
    await api('/api/manager/restaurant', { token, avatar: mgr.restaurant.avatar });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.dsave) {
    await api('/api/manager/restaurant', { token, display: mgr.restaurant.display });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.srcsave) {
    await api('/api/manager/restaurant', { token, menuSource: mgr.restaurant.menuSource });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.sync) {
    b.textContent = t('syncing');
    b.disabled = true;
    await api('/api/manager/sync', { token });
    await loadManager();
  } else if (b.dataset.tab) {
    showTab(b.dataset.tab);
  } else if (b.dataset.add) {
    const fresh = { staff: { role: 'waiter' }, promos: { active: true } }[b.dataset.add] || {};
    mgr.restaurant[b.dataset.add].push(fresh);
    renderManager();
  } else if (b.dataset.del !== undefined) {
    mgr.restaurant[b.closest('[data-list]').dataset.list].splice(Number(b.dataset.del), 1);
    renderManager();
  } else if (b.dataset.save) {
    saveManager(true);
  } else if (b.dataset.block) {
    const r = mgr.restaurant, id = b.dataset.block;
    r.blockedAds = r.blockedAds.includes(id) ? r.blockedAds.filter((x) => x !== id) : [...r.blockedAds, id];
    saveManager(false);
  } else if (b.id === 'go') {
    $('err').textContent = '';
    login();
  } else if (b.id === 'shiftBtn') {
    await api('/api/staff/shift', { token, on: !last.me.onShift });
    refresh();
  } else if (b.id === 'pushBtn') {
    enablePush();
  } else if (b.id === 'out') {
    logout();
  }
});

// ---------- Правка заказа официантом: количество, удаление, новые блюда из меню

let staffMenuCache = null, oedit = null;

async function openOrderEditor(id) {
  const o = last.orders.find((x) => x.id === id);
  if (!o) return;
  staffMenuCache ??= await api(`/api/staff/menu?token=${encodeURIComponent(token)}`);
  oedit = { id, table: o.table, lines: o.items.map((i) => ({ id: i.id, opt: i.opt || '', qty: i.qty, name: itemName(i.name), price: i.price })), q: '' };
  renderOrderEditor();
}

function renderOrderEditor() {
  const total = oedit.lines.reduce((s, l) => s + l.price * l.qty, 0);
  $('modal').innerHTML = `<div class="ed">
      <b>${t('table')} ${esc(oedit.table)} — ${t('edit')}</b>
      ${oedit.lines.map((l, i) => `<div class="line"><span>${esc(l.name)}</span>
        <button data-odec="${i}">−</button><b>${l.qty}</b><button data-oinc="${i}">+</button></div>`).join('')}
      <b>${t('total')}: ฿${total.toLocaleString('en')}</b>
      <input class="osearch msearch" placeholder="${t('addDish')}" value="${esc(oedit.q)}">
      <div class="results" id="ores"></div>
      <div class="bar"><button data-osave="1">${t('save')}</button><button class="ghostbtn" data-oclose="1">${t('close')}</button></div>
    </div>`;
  $('modal').hidden = false;
  renderOrderResults();
}

function renderOrderResults() {
  const q = oedit.q.trim().toLowerCase();
  const found = !q ? [] : staffMenuCache.filter((m) => `${m.sku || ''} ${Object.values(m.name || {}).join(' ')}`.toLowerCase().includes(q)).slice(0, 8);
  $('ores').innerHTML = found.flatMap((m) => ((m.options || []).length
    ? m.options.map((o) => `<button data-oadd="${esc(m.id)}|${esc(o.key)}">${esc(itemName(m.name))} · ${esc(itemName(o.label))} · ฿${o.price}</button>`)
    : [`<button data-oadd="${esc(m.id)}|">${esc(itemName(m.name))} · ฿${m.price}</button>`])).join('');
}

function addOrderLine(key) {
  const [id, opt] = key.split('|');
  const line = oedit.lines.find((l) => l.id === id && l.opt === opt);
  if (line) { line.qty++; return; }
  const m = staffMenuCache.find((x) => x.id === id);
  const o = opt ? m.options.find((x) => x.key === opt) : null;
  oedit.lines.push({ id, opt, qty: 1, name: itemName(m.name) + (o ? ` · ${itemName(o.label)}` : ''), price: Number(o ? o.price : m.price) || 0 });
}

// ---------- Кабинет менеджера: персонал и столы, меню, акции, внешняя реклама

let mgr = null, elang = 'en';
const LANG_FIELDS = ['cat', 'name', 'desc', 'title', 'text'];
const val = (o) => (o && typeof o === 'object' ? o[elang] || '' : o ?? '');

// «1-5, 8» → 1, 2, 3, 4, 5, 8
const parseTables = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean).flatMap((x) => {
  const m = x.match(/^(\d+)\s*-\s*(\d+)$/);
  if (!m) return [x];
  const from = Number(m[1]), to = Math.min(Number(m[2]), from + 200);
  return Array.from({ length: Math.max(0, to - from + 1) }, (_, k) => String(from + k));
});

function showTab(id) {
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === id));
  for (const s of ['tWork', 'tStaff', 'tMenu', 'tPromos', 'tAds', 'tAI', 'tDev']) $(s).hidden = s !== id;
  if (id !== 'tWork') loadManager();
}

async function loadManager() {
  mgr = await api(`/api/manager/restaurant?token=${encodeURIComponent(token)}`);
  renderManager();
}

async function saveManager(notice) {
  const r = mgr.restaurant;
  await api('/api/manager/restaurant', {
    token,
    staff: r.staff.map((m) => ({ ...m, tables: Array.isArray(m.tables) ? m.tables : parseTables(m.tables) })),
    menu: r.menu, promos: r.promos, blockedAds: r.blockedAds,
  });
  await loadManager();
  if (notice) alert(t('saved'));
}

const chk = (f, on, label) => `<label class="chk"><input data-f="${f}" type="checkbox" ${on ? 'checked' : ''}>${t(label)}</label>`;

function renderGrid() {

// Правим копию блюда: «Сохранить» переносит её в меню, «Закрыть» — отменяет
function openItem(i) {
  medit = i;
  const src = i >= 0 ? mgr.restaurant.menu[i] : { cat: mcat ? { [elang]: mcat } : {}, name: {}, desc: {} };
  mgr.restaurant.draft = [structuredClone(src)];
  renderItem();
}

function renderItem() {
  const it = mgr.restaurant.draft[0];
  $('modal').innerHTML = `<div class="ed" data-list="draft" data-i="0">
      ${img(it.photo)}${uploader('photo')}${inp('photo', it.photo, 'photo')}
      ${inp('cat', val(it.cat), 'cat')}${inp('name', val(it.name), 'dish')}${inp('desc', val(it.desc), 'desc')}
      ${inp('price', it.price ?? '', 'price', 'number')}
      ${chk('dayDish', it.dayDish, 'day')}${chk('promo', it.promo, 'promo')}${chk('hidden', it.hidden, 'hide')}
      ${it.extId ? `<span class="empty">${t('synced')}</span>` : ''}
      <div class="bar"><button data-msave="1">${t('save')}</button><button class="ghostbtn" data-mclose="1">${t('close')}</button>
        ${medit >= 0 ? `<button class="del" data-mdel="1">${t('del')}</button>` : ''}</div>
    </div>`;
  $('modal').hidden = false;
}

function closeItem() {
  $('modal').hidden = true;
  $('modal').innerHTML = '';
  medit = -1;
}

// Перед отправкой уменьшаем фото до 1280 px — планшетам не нужны тяжёлые файлы
async function uploadImage(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  const res = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-staff-token': token }, body: blob });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error);
  return j.url;
}

async function onEdit(e) {
  const el = e.target;
  if (el.classList.contains('elang')) {
    if (e.type === 'change') { elang = el.value; mcat = ''; renderManager(); }
    return;
  }
  if (el.classList.contains('osearch')) { oedit.q = el.value; renderOrderResults(); return; }
  if (el.classList.contains('msearch')) { mq = el.value; renderGrid(); return; }
  if (el.dataset.ai && mgr) {
    mgr.restaurant.avatar[el.dataset.ai] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.ai === 'characterId' && e.type === 'change') renderManager();
    return;
  }
  if (el.dataset.df && mgr) {
    mgr.restaurant.display[el.dataset.df] = el.type === 'number' ? Number(el.value) : el.value;
    renderPreview();
    return;
  }
  if (el.dataset.sf && mgr) {
    mgr.restaurant.menuSource = { ...mgr.restaurant.menuSource, [el.dataset.sf]: el.value };
    if (el.dataset.sf === 'type' && e.type === 'change') renderMenuTab();
    return;
  }
  const card = el.closest('[data-i]'), list = el.closest('[data-list]');
  if (el.type === 'file' && e.type === 'change' && el.files[0] && card && list) {
    const item = mgr.restaurant[list.dataset.list][card.dataset.i];
    item[el.dataset.upload] = await uploadImage(el.files[0]);
    if (el.dataset.upload === 'photo') item.photoManual = true;
    if (list.dataset.list === 'draft') renderItem(); else renderManager();
    return;
  }
  const f = el.dataset.f;
  if (!f || !card || !list || !mgr) return;
  const item = mgr.restaurant[list.dataset.list][card.dataset.i];
  if (f === 'photo') item.photoManual = true;
  if (el.type === 'checkbox') item[f] = el.checked;
  else if (f === 'price') item[f] = Number(el.value) || 0;
  else if (list.dataset.list !== 'staff' && LANG_FIELDS.includes(f)) item[f] = { ...(item[f] || {}), [elang]: el.value };
  else item[f] = el.value;
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);

$('code').value = localStorage.code || '';
texts();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/staff/sw.js');
if (token) { startTimer(); refresh(); }
</script>
