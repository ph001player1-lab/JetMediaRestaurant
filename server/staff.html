<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JET MEDIA Staff</title>
<link rel="icon" href="/staff/icon.svg">
<link rel="apple-touch-icon" href="/staff/apple-touch-icon.png">
<link rel="manifest" href="/staff/manifest.json">
<meta name="apple-mobile-web-app-title" content="JET Staff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1a17">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f7f3ee; color: #1f1a17; }
  .box { max-width: 420px; margin: 12vh auto; padding: 24px; background: #fff; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; }
  input, button { font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; }
  button { background: #1f1a17; color: #fff; border: 0; cursor: pointer; }
  .top { position: sticky; top: 0; z-index: 10; background: #fff; box-shadow: 0 1px 0 #eee; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
  header .who { flex: 1; min-width: 140px; display: flex; flex-direction: column; }
  header .who b { font-size: 17px; }
  header .who span { color: #8a7f76; font-size: 14px; }
  header .ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  header button { font-size: 14px; padding: 8px 12px; }
  .langs button { background: none; color: inherit; border: 1px solid #ddd; padding: 6px 10px; font-size: 14px; }
  #shiftBtn { background: #2e7d32; }
  #shiftBtn.off { background: #c62828; }
  [hidden] { display: none !important; }
  /* Мини-копия слайда в списке: планки, картинка с кадром и блок QR на своём месте */
  .mini { position: relative; background: #141110; border-radius: 8px; overflow: hidden; flex: none; }
  .mstage { position: absolute; left: 0; right: 0; overflow: hidden; background: #000; }
  .mimg, .mblur { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .mblur { object-fit: cover; filter: blur(6px) brightness(.55); transform: scale(1.15); }
  .mqr { position: absolute; background: #fff; color: #1f1a17; text-align: center; line-height: 1.1; }
  .pf input, .pf select, .pf label { box-sizing: border-box; min-width: 0; max-width: 100%; }
  .dset { align-items: end; }
  .sizehint { background: #fff3cd; border-radius: 10px; padding: 10px 14px; line-height: 1.5; margin: 8px 0; font-size: 14px; }
  .frame input[type=range], .pf input[type=range] { width: 100%; padding: 0; border: 0; }
  /* Компактные карточки акций и рекламы: слева превью в пропорции экрана планшета 800×1280 */
  .pcard { background: #fff; border-radius: 12px; padding: 10px; margin: 8px 0; display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
  .pcard .thumb { width: 120px; height: 192px; object-fit: contain; background: #111; border-radius: 8px; display: block; }
  .pcard .thumb.none { background: #eee4da; }
  .pf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 10px; }
  .pf label { display: flex; flex-direction: column; font-size: 12px; color: #8a7f76; gap: 2px; }
  .pf input:not([type=checkbox]), .pf select { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; }
  .pf .full { grid-column: 1 / -1; }
  .pf .ml { background: #faf6f1; border-radius: 8px; padding-left: 6px; }
  .pf .ml span { width: 24px; font-size: 12px; font-weight: 600; color: #6b625b; }
  .pf label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: inherit; }
  .pcard .del { background: #efe7df; color: #c62828; }
  .pf .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pf .row button { font-size: 14px; padding: 6px 12px; margin: 0; }
  .dset { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 12px; }
  .dset label { display: flex; flex-direction: column; font-size: 12px; color: #8a7f76; gap: 2px; }
  .dset input { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; }
  /* Вкладка «Дизайн»: темы — мини-планшеты 200 × 160 */
  .themes { display: flex; flex-wrap: wrap; gap: 12px; }
  .thc { width: 218px; padding: 6px 6px 8px; margin: 0; border-radius: 14px; background: #fff; color: #1f1a17; border: 3px solid transparent; cursor: pointer; font-size: 14px; }
  .thc.on { border-color: #1f1a17; font-weight: 700; }
  .thv { width: 200px; height: 160px; overflow: hidden; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .thin { width: 800px; height: 640px; transform: scale(.25); transform-origin: 0 0; display: flex; flex-direction: column; font-family: system-ui, sans-serif; text-align: left; }
  .thn { display: block; margin-top: 6px; }
  .qrgrid { display: grid; grid-template-columns: repeat(3, 26px); gap: 3px; margin: 4px 0; }
  .qrgrid button { width: 26px; height: 20px; padding: 0; margin: 0; border: 1px solid #bbb; background: #fff; border-radius: 3px; cursor: pointer; }
  .qrgrid button.on { background: #c8553d; border-color: #c8553d; }
  /* Предпросмотр слайда: настоящая страница планшета 800×1280, уменьшенная */
  .pv { position: fixed; right: 16px; bottom: 16px; z-index: 50; background: #222; padding: 8px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .pvbar { display: flex; gap: 8px; align-items: center; color: #fff; margin-bottom: 6px; font-size: 14px; }
  .pvbar b { flex: 1; }
  .pvbar select, .pvbar button { font-size: 13px; padding: 4px 8px; margin: 0; }
  .pvframe { width: 288px; height: 461px; overflow: hidden; border-radius: 10px; background: #000; }
  .pvframe iframe { width: 800px; height: 1280px; border: 0; transform: scale(.36); transform-origin: 0 0; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; border-top: 1px solid #eee; }
  .line { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .line span { flex: 1; }
  .line button { width: 40px; padding: 8px 0; }
  .results button { display: block; width: 100%; text-align: left; margin: 4px 0; background: #efe7df; color: #1f1a17; font-size: 15px; padding: 10px; }
  .tabs button { background: none; color: inherit; font-size: 15px; padding: 10px 12px; border-radius: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { border-color: #1f1a17; font-weight: 600; }
  .ed { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; display: grid; gap: 8px; }
  .ed label { display: flex; flex-direction: column; font-size: 13px; color: #8a7f76; gap: 4px; }
  .ed label.chk { flex-direction: row; align-items: center; gap: 8px; color: inherit; font-size: 16px; }
  .ed input, .ed select, .bar select { font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
  .ed img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; }
  .ed input[type=color] { width: 96px; height: 48px; padding: 3px; }
  .ed .del { background: #efe7df; color: #c62828; justify-self: start; font-size: 15px; padding: 8px 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 12px 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  .chips button { background: #fff; color: inherit; border: 1px solid #ddd; font-size: 14px; padding: 8px 12px; white-space: nowrap; }
  .chips button.on { background: #1f1a17; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; font-size: 14px; display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; }
  .tile img, .tile .noimg { width: 100%; height: 100px; object-fit: cover; background: #eee4da; }
  .tile > div, .tile > b, .tile > span { padding: 0 8px; }
  .tile.off { opacity: .45; }
  .msearch { width: 100%; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal .ed { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; margin: 0; border-radius: 16px 16px 0 0; }
  .ghostbtn { background: #efe7df; color: #1f1a17; }
  main { padding: 0 16px 32px; max-width: 1100px; margin: auto; }
  .ml { display: flex; align-items: center; gap: 6px; }
  .ml span { width: 34px; font-size: 13px; color: #8a7f76; }
  .ml input, .ml textarea { flex: 1; }
  .views button { background: #fff; color: inherit; border: 1px solid #ddd; font-size: 14px; padding: 8px 14px; }
  .views button.on { background: #1f1a17; color: #fff; }
  /* Табличный вид, как в Excel: правка в ячейках, сортировка по заголовку */
  .xlwrap { overflow: auto; max-height: 72vh; background: #fff; border-radius: 12px; }
  .xl { border-collapse: collapse; width: 100%; font-size: 14px; }
  .xl th, .xl td { border: 1px solid #eee; padding: 0; }
  .xl th { position: sticky; top: 0; background: #f7f3ee; padding: 8px 6px; text-align: left; cursor: pointer; white-space: nowrap; z-index: 1; }
  .xl td input:not([type=checkbox]), .xl td select { width: 100%; min-width: 60px; border: 0; padding: 8px 6px; font: inherit; font-size: 14px; background: transparent; box-sizing: border-box; }
  .xl td input:focus, .xl td select:focus { outline: 2px solid #c8553d; outline-offset: -2px; }
  .xl td.c { text-align: center; }
  .xl th.tagh { font-size: 11px; white-space: normal; max-width: 64px; line-height: 1.15; text-align: center; font-weight: 600; }
  .xl tr.off td { color: #aaa; }
  .xl button { font-size: 13px; padding: 6px 10px; margin: 2px; }
  .banner { background: #fff3cd; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .banner button { margin-top: 8px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 6px solid #c8553d; }
  .card.ack, .card.confirmed { border-color: #2e7d32; }
  .card.rejected { border-color: #999; opacity: .6; }
  .card.paid { border-color: #9e9e9e; background: #f4f2ef; }
  .tgroup { margin: 14px 0; }
  .thead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 4px 2px; }
  .thead b { font-size: 18px; }
  .thead .due { color: #c8553d; font-weight: 700; }
  .tline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 10px 12px; margin: 6px 0; }
  .tline span { flex: 1; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .card button { margin: 8px 8px 0 0; font-size: 16px; padding: 10px 14px; }
  #tables button { margin: 4px; background: #efe7df; color: #1f1a17; }
  .empty { color: #8a7f76; }
  .err { color: #c62828; min-height: 1em; }
</style>
</head>

<div id="login" class="box">
  <div class="langs"><button data-l="en">EN</button> <button data-l="th">ไทย</button> <button data-l="ru">RU</button></div>
  <h2 data-t="login"></h2>
  <input id="code" data-t="code" inputmode="numeric" autocomplete="off">
  <input id="pin" data-t="pin" inputmode="numeric" type="password" autocomplete="off">
  <button id="go" data-t="start"></button>
  <p class="err" id="err"></p>
</div>
<div id="work" hidden>
  <div class="top">
  <header>
    <div class="who"><b id="rname"></b><span id="who"></span></div>
    <div class="ctrl">
      <button id="shiftBtn"></button>
      <span class="langs"><button data-l="en">EN</button><button data-l="th">ไทย</button><button data-l="ru">RU</button></span>
      <button id="out" data-t="out"></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="tWork" class="on" data-t="tabWork"></button><button data-tab="tStaff" data-t="tabStaff"></button><button data-tab="tMenu" data-t="tabMenu"></button><button data-tab="tPromos" data-t="tabPromos"></button><button data-tab="tAds" data-t="tabAds"></button><button data-tab="tAI" data-t="tabAI"></button><button data-tab="tDesign" data-t="tabDesign"></button><button data-tab="tDev" data-t="tabDev"></button>
  </nav>
  </div>
  <main><section id="tWork">
    <div class="banner" id="pushBanner" hidden><span id="pushText"></span><br><button id="pushBtn" data-t="push"></button></div>
    <h3 data-t="calls"></h3><div id="calls"></div>
    <h3 data-t="orders"></h3><div id="orders"></div>
    <h3 data-t="tables"></h3><div id="tables"></div>
  </section>
  <section id="tStaff" hidden></section><section id="tMenu" hidden></section>
  <section id="tPromos" hidden></section><section id="tAds" hidden></section>
  <section id="tAI" hidden></section><section id="tDesign" hidden></section><section id="tDev" hidden></section>
  </main>
  <div class="modal" id="modal" hidden></div>
<div class="pv" id="pvPanel" hidden>
  <div class="pvbar"><b><span data-t="preview"></span></b>
    <select id="pvLang"><option value="ru">RU</option><option value="en">EN</option><option value="th">TH</option><option value="zh">ZH</option></select>
    <button id="pvClose">✕</button></div>
  <div class="pvframe"><iframe id="pvFrame" title="preview"></iframe></div>
</div>

</div>

let lang = localStorage.lang || 'en';
let token = localStorage.token || '';
let seen = new Set(), first = true, audio = null, timer = null, last = null, appBuild = null;

const $ = (id) => document.getElementById(id);
const t = (k) => (T[lang] || T.en)[k] || k;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const ago = (ms) => `${Math.max(0, Math.floor((Date.now() - ms) / 60000))} min`;
const itemName = (n) => (typeof n === 'string' ? n : n[lang] || n.en || n.th || Object.values(n)[0] || '');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function texts() {
  document.querySelectorAll('[data-t]').forEach((el) => {
    el[el.tagName === 'INPUT' ? 'placeholder' : 'textContent'] = t(el.dataset.t);
  });
  document.querySelectorAll('[data-l]').forEach((b) => (b.style.fontWeight = b.dataset.l === lang ? '700' : '400'));
}

async function api(path, body) {
  const r = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : undefined);
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error), { status: r.status });
  return j;
}

// Сигнал и вибрация, пока страница открыта; на заблокированном телефоне работают push-уведомления
function beep() {
  if (audio) {
    for (const d of [0, 0.5]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(audio.destination);
      o.start(audio.currentTime + d);
      o.stop(audio.currentTime + d + 0.3);
    }
  }
  navigator.vibrate?.([300, 150, 300]);
}

async function refresh() {
  try {
    render(await api(`/api/staff/state?token=${encodeURIComponent(token)}`));
    $('login').hidden = true;
    $('work').hidden = false;
  } catch (e) {
    if (e.status === 401) logout();
  }
}

function logout() {
  if (token) api('/api/staff/logout', { token }).catch(() => {});
  clearInterval(timer);
  localStorage.removeItem('token');
  token = '';
  $('work').hidden = true;
  $('login').hidden = false;
}

async function login() {
  try {
    const r = await api('/api/staff/login', { code: $('code').value, pin: $('pin').value, lang });
    token = localStorage.token = r.token;
    localStorage.code = $('code').value;
    $('pin').value = '';
    startTimer();
    await refresh();
  } catch {
    $('err').textContent = t('wrong');
  }
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(refresh, 3000);
  navigator.wakeLock?.request('screen').catch(() => {});
}

function urlB64ToBytes(s) {
  const raw = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function enablePush() {
  if (!canPush) return alert(t(isIOS && !standalone ? 'iosHint' : 'noPush'));
  if (await Notification.requestPermission() !== 'granted') return alert(t('denied'));
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription())
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(last.vapidKey) });
  await api('/api/staff/subscribe', { token, sub: sub.toJSON(), lang });
  refresh();
}

function render(s) {
  // Вышла новая версия приложения — перезагружаемся, если ничего не редактируется
  if (appBuild && s.build !== appBuild && !$('tWork').hidden && $('modal').hidden) return location.reload();
  appBuild ??= s.build;
  last = s;
  $('rname').textContent = s.restaurant.name;
  $('who').textContent = s.me.name;
  $('shiftBtn').textContent = t(s.me.onShift ? 'shiftOn' : 'shiftOff');
  $('shiftBtn').className = s.me.onShift ? '' : 'off';
  $('pushBanner').hidden = s.me.push;
  $('pushText').textContent = t(isIOS && !standalone ? 'iosHint' : 'pushText');
  $('pushBtn').hidden = isIOS && !standalone;
  $('tabs').hidden = s.me.role !== 'manager';

  let fresh = false;
  for (const x of [...s.calls.filter((c) => c.status === 'new'), ...s.orders.filter((o) => o.status === 'pending')]) {
    if (!seen.has(x.id)) { seen.add(x.id); fresh = true; }
  }
  if (fresh && !first) beep();
  first = false;

  const btn = (kind, id, action, label) => `<button data-act="${kind}|${esc(id)}|${action}">${t(label)}</button>`;
  const by = (x) => (x.by ? ` · ${esc(x.by)}` : '');

  $('calls').innerHTML = s.calls.map((c) => `<div class="card ${c.status}">
      <b>${esc(tbl(c.table))}</b> · ${t(c.type)} · ${ago(c.at)}${by(c)}
      <div>${c.status === 'new' ? btn('call', c.id, 'ack', 'going') : ''}${btn('call', c.id, 'done', 'done')}</div>
    </div>`).join('') || `<p class="empty">${t('none')}</p>`;

  // Суммы по столу: итого по всем счетам (кроме отклонённых) и сколько ещё к оплате
  const sums = (tb) => {
    const list = s.orders.filter((o) => o.table === tb && o.status !== 'rejected');
    const total = list.reduce((a, o) => a + o.total, 0);
    return { count: list.length, total, due: list.filter((o) => !o.paidAt).reduce((a, o) => a + o.total, 0) };
  };
  const money = (n) => `฿${n.toLocaleString('en')}`;
  const orderCard = (o) => `<div class="card ${o.paidAt ? 'paid' : o.ackAt && o.status === 'pending' ? 'ack' : o.status}">
      <b>${esc(tbl(o.table))}</b> · ${ago(o.at)} · ${o.paidAt ? `${t('paidMark')} · ${esc(o.paidBy || '')}` : t(o.status) + by(o)}
      ${o.ackBy ? ` · ${t('going')}: ${esc(o.ackBy)}` : ''}${o.editedBy ? ` · ${t('editedBy')}: ${esc(o.editedBy)}` : ''}
      <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(itemName(i.name))}</li>`).join('')}</ul>
      <b>฿${o.total.toLocaleString('en')}</b>
      <div>
        ${o.status === 'pending' && !o.ackAt ? btn('order', o.id, 'ack', 'going') : ''}
        ${o.status === 'pending' ? btn('order', o.id, 'confirm', 'confirm') : ''}
        ${o.status !== 'rejected' && !o.paidAt ? `<button data-oedit="${esc(o.id)}">${t('edit')}</button>` : ''}
        ${o.status === 'confirmed' && !o.paidAt && !s.restaurant.pos ? btn('order', o.id, 'paid', 'paid') : ''}
        ${o.status === 'pending' ? btn('order', o.id, 'reject', 'reject') : ''}
      </div>
    </div>`;
  const orderTables = [...new Set(s.orders.map((o) => o.table))];
  $('orders').innerHTML = orderTables.map((tb) => {
    const x = sums(tb);
    return `<div class="tgroup"><div class="thead"><b>${esc(tbl(tb))}</b>
        ${x.count > 1 ? `<span>${t('bills')}: ${x.count}</span>` : ''}<span>${t('total')} ${money(x.total)}</span>
        ${x.due && x.due !== x.total ? `<span class="due">${t('due')} ${money(x.due)}</span>` : ''}</div>
      ${s.orders.filter((o) => o.table === tb).map(orderCard).join('')}</div>`;
  }).join('') || `<p class="empty">${t('none')}</p>`;

  // Открытые столы: сумма и «Закрыть стол» (с подтверждением)
  const busy = [...new Set([...s.calls, ...s.orders].map((x) => x.table))];
  $('tables').innerHTML = busy.map((tb) => {
    const x = sums(tb);
    return `<div class="tline"><span><b>${esc(tbl(tb))}</b>${x.count ? ` · ${t('total')} ${money(x.total)}` : ''}
        ${x.due ? ` · <span class="due">${t('due')} ${money(x.due)}</span>` : ''}</span>
      <button data-act="table|${esc(tb)}|close" data-confirm="${esc(t('confirmClose').replace('{n}', tb))}">${t('closeTable')}</button></div>`;
  }).join('') || `<p class="empty">${t('none')}</p>`;
}

document.addEventListener('click', async (e) => {
  // Звук в браузере разрешён только после касания
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  audio.resume?.();
  const tile = e.target.closest('[data-edit]');
  if (tile) return openItem(Number(tile.dataset.edit));
  // Сортировка таблицы меню по клику на заголовок столбца
  const th = e.target.closest('th[data-sort]');
  if (th) {
    msort = { key: th.dataset.sort, dir: msort.key === th.dataset.sort ? -msort.dir : 1 };
    return renderGrid();
  }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.l) {
    lang = localStorage.lang = b.dataset.l;
    texts();
    if (last) render(last);
    if (mgr) renderManager();
    // язык push-уведомлений тоже меняем
    if (last?.me.push) enablePush();
  } else if (b.dataset.act) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    const [kind, id, action] = b.dataset.act.split('|');
    await api('/api/staff/action', { token, kind, id, action });
    refresh();
  } else if (b.dataset.oedit) {
    openOrderEditor(b.dataset.oedit);
  } else if (b.dataset.oinc || b.dataset.odec) {
    const l = oedit.lines[Number(b.dataset.oinc ?? b.dataset.odec)];
    l.qty += b.dataset.oinc ? 1 : -1;
    oedit.lines = oedit.lines.filter((x) => x.qty > 0);
    renderOrderEditor();
  } else if (b.dataset.oadd) {
    addOrderLine(b.dataset.oadd);
    oedit.q = '';
    renderOrderEditor();
  } else if (b.dataset.osave) {
    if (oedit.lines.length) await api('/api/staff/action', { token, kind: 'order', id: oedit.id, action: 'edit', items: oedit.lines });
    closeItem();
    refresh();
  } else if (b.dataset.oclose) {
    closeItem();
  } else if (b.dataset.qrpos) {
    mgr.restaurant.promos[Number(b.closest('[data-i]').dataset.i)].qrPos = b.dataset.qrpos;
    renderManager();
    sendPreview();
  } else if (b.dataset.pvpromo !== undefined) {
    const p = mgr.restaurant.promos[Number(b.dataset.pvpromo)];
    openPreview(() => slideOf('promo', p), () => mgr.restaurant.display);
  } else if (b.dataset.pvad) {
    const a = mgr.ads.find((x) => x.id === b.dataset.pvad);
    openPreview(() => slideOf('ad', a), () => mgr.restaurant.display);
  } else if (b.dataset.view) {
    const [list, view] = b.dataset.view.split('|');
    views[list] = localStorage[`${list}View`] = view;
    renderManager();
  } else if (b.dataset.medit !== undefined) {
    openItem(Number(b.dataset.medit));
  } else if (b.dataset.mcat !== undefined) {
    mcat = b.dataset.mcat;
    renderGrid();
  } else if (b.dataset.newitem) {
    openItem(-1);
  } else if (b.dataset.msave) {
    const r = mgr.restaurant;
    if (medit >= 0) r.menu[medit] = r.draft[0]; else r.menu.push(r.draft[0]);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.mclose) {
    closeItem();
  } else if (b.dataset.mdel) {
    mgr.restaurant.menu.splice(medit, 1);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.addgreet) {
    mgr.restaurant.avatar.greetings = [...(mgr.restaurant.avatar.greetings || []), {}];
    renderManager();
  } else if (b.dataset.delgreet !== undefined) {
    mgr.restaurant.avatar.greetings.splice(Number(b.dataset.delgreet), 1);
    renderManager();
  } else if (b.dataset.aisave) {
    await api('/api/manager/restaurant', { token, avatar: mgr.restaurant.avatar });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.addtbl || b.dataset.deltbl) {
    tablesDraft = tablesDraft || mgr.restaurant.tables.map((x) => ({ from: x, to: x }));
    if (b.dataset.addtbl) {
      const nums = tablesDraft.map((x) => Number((x.to.match(/(\d+)\s*$/) || [])[1])).filter((n) => Number.isInteger(n));
      tablesDraft.push({ from: '', to: `${t('table')} ${nums.length ? Math.max(...nums) + 1 : tablesDraft.length + 1}` });
    } else {
      const row = tablesDraft[b.dataset.deltbl];
      const busy = row.from && mgr.devices.some((d) => !d.entrance && d.table === row.from);
      if (busy && !confirm(t('delTableConfirm'))) return;
      tablesDraft.splice(b.dataset.deltbl, 1);
    }
    renderManager();
  } else if (b.dataset.savetbl) {
    const rows = tablesDraft || mgr.restaurant.tables.map((x) => ({ from: x, to: x }));
    const names = rows.map((x) => x.to.trim());
    if (names.some((x) => !x) || new Set(names).size !== names.length) return alert(t('dupTable'));
    await api('/api/manager/restaurant', { token, tables: rows });
    tablesDraft = null;
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.theme) {
    mgr.restaurant.display.theme = b.dataset.theme;
    await api('/api/manager/restaurant', { token, display: mgr.restaurant.display });
    await loadManager();
  } else if (b.dataset.dsave) {
    await api('/api/manager/restaurant', { token, display: mgr.restaurant.display });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.srcsave) {
    await api('/api/manager/restaurant', { token, menuSource: mgr.restaurant.menuSource });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.sync) {
    b.textContent = t('syncing');
    b.disabled = true;
    await api('/api/manager/sync', { token });
    await loadManager();
  } else if (b.dataset.tab) {
    showTab(b.dataset.tab);
  } else if (b.dataset.add) {
    const fresh = { staff: { role: 'waiter' }, promos: { active: true } }[b.dataset.add] || {};
    mgr.restaurant[b.dataset.add].push(fresh);
    renderManager();
  } else if (b.dataset.del !== undefined) {
    mgr.restaurant[b.closest('[data-list]').dataset.list].splice(Number(b.dataset.del), 1);
    renderManager();
  } else if (b.dataset.save) {
    saveManager(true);
  } else if (b.dataset.block) {
    const r = mgr.restaurant, id = b.dataset.block;
    r.blockedAds = r.blockedAds.includes(id) ? r.blockedAds.filter((x) => x !== id) : [...r.blockedAds, id];
    saveManager(false);
  } else if (b.id === 'go') {
    $('err').textContent = '';
    login();
  } else if (b.id === 'shiftBtn') {
    await api('/api/staff/shift', { token, on: !last.me.onShift });
    refresh();
  } else if (b.id === 'pushBtn') {
    enablePush();
  } else if (b.id === 'out') {
    logout();
  }
});

// ---------- Правка заказа официантом: количество, удаление, новые блюда из меню

let staffMenuCache = null, oedit = null;

async function openOrderEditor(id) {
  const o = last.orders.find((x) => x.id === id);
  if (!o) return;
  staffMenuCache ??= await api(`/api/staff/menu?token=${encodeURIComponent(token)}`);
  oedit = { id, table: o.table, lines: o.items.map((i) => ({ id: i.id, opt: i.opt || '', qty: i.qty, name: itemName(i.name), price: i.price })), q: '' };
  renderOrderEditor();
}

function renderOrderEditor() {
  const total = oedit.lines.reduce((s, l) => s + l.price * l.qty, 0);
  $('modal').innerHTML = `<div class="ed">
      <b>${esc(tbl(oedit.table))} — ${t('edit')}</b>
      ${oedit.lines.map((l, i) => `<div class="line"><span>${esc(l.name)}</span>
        <button data-odec="${i}">−</button><b>${l.qty}</b><button data-oinc="${i}">+</button></div>`).join('')}
      <b>${t('total')}: ฿${total.toLocaleString('en')}</b>
      <input class="osearch msearch" placeholder="${t('addDish')}" value="${esc(oedit.q)}">
      <div class="results" id="ores"></div>
      <div class="bar"><button data-osave="1">${t('save')}</button><button class="ghostbtn" data-oclose="1">${t('close')}</button></div>
    </div>`;
  $('modal').hidden = false;
  renderOrderResults();
}

function renderOrderResults() {
  const q = oedit.q.trim().toLowerCase();
  const found = !q ? [] : staffMenuCache.filter((m) => `${m.sku || ''} ${Object.values(m.name || {}).join(' ')}`.toLowerCase().includes(q)).slice(0, 8);
  $('ores').innerHTML = found.flatMap((m) => ((m.options || []).length
    ? m.options.map((o) => `<button data-oadd="${esc(m.id)}|${esc(o.key)}">${esc(itemName(m.name))} · ${esc(itemName(o.label))} · ฿${o.price}</button>`)
    : [`<button data-oadd="${esc(m.id)}|">${esc(itemName(m.name))} · ฿${m.price}</button>`])).join('');
}

function addOrderLine(key) {
  const [id, opt] = key.split('|');
  const line = oedit.lines.find((l) => l.id === id && l.opt === opt);
  if (line) { line.qty++; return; }
  const m = staffMenuCache.find((x) => x.id === id);
  const o = opt ? m.options.find((x) => x.key === opt) : null;
  oedit.lines.push({ id, opt, qty: 1, name: itemName(m.name) + (o ? ` · ${itemName(o.label)}` : ''), price: Number(o ? o.price : m.price) || 0 });
}

// ---------- Кабинет менеджера: персонал и столы, меню, акции, внешняя реклама

// Язык редактирования по умолчанию — язык интерфейса сотрудника
let mgr = null, elang = lang;
const LANG_FIELDS = ['cat', 'name', 'desc', 'title', 'text'];
const val = (o) => (o && typeof o === 'object' ? o[elang] || '' : o ?? '');

// «1-5, 8» → 1, 2, 3, 4, 5, 8
// Подпись стола: слово «Стол» — на языке приложения, номер — как написал менеджер; «VIP-зал» — как есть
const tbl = (x) => {
  const n = String(x || '—'), m = n.match(/^(?:стол|table|โต๊ะ|桌)\s+(.+)$/i);
  return /^\d+$/.test(n) ? `${t('table')} ${n}` : m ? `${t('table')} ${m[1]}` : n;
};
const parseTables = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean).flatMap((x) => {
  const m = x.match(/^(\d+)\s*-\s*(\d+)$/);
  if (!m) return [x];
  const from = Number(m[1]), to = Math.min(Number(m[2]), from + 200);
  return Array.from({ length: Math.max(0, to - from + 1) }, (_, k) => String(from + k));
});

function showTab(id) {
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === id));
  for (const s of ['tWork', 'tStaff', 'tMenu', 'tPromos', 'tAds', 'tAI', 'tDesign', 'tDev']) $(s).hidden = s !== id;
  if (id !== 'tWork') loadManager();
}

// Вкладка «Устройства» обновляется сама: статус связи и заряд — как в портале администратора
// (пока менеджер правит столы — не перерисовываем, чтобы не потерять ввод)
let tablesDraft = null;
setInterval(() => { if (!$('tDev').hidden && !document.hidden && !tablesDraft) loadManager(); }, 10000);

async function loadManager() {
  mgr = await api(`/api/manager/restaurant?token=${encodeURIComponent(token)}`);
  renderManager();
}

async function saveManager(notice) {
  const r = mgr.restaurant;
  await api('/api/manager/restaurant', {
    token,
    staff: r.staff.map((m) => ({ ...m, tables: Array.isArray(m.tables) ? m.tables : parseTables(m.tables) })),
    menu: r.menu, promos: r.promos, blockedAds: r.blockedAds,
  });
  await loadManager();
  if (notice) alert(t('saved'));
}

const chk = (f, on, label) => `<label class="chk"><input data-f="${f}" type="checkbox" ${on ? 'checked' : ''}>${t(label)}</label>`;
const img = (src) => (src ? `<img src="${esc(src)}" alt="">` : '');
const del = (i) => `<button class="del" data-del="${i}">${t('del')}</button>`;

      <div class="bar"><button class="ghostbtn" data-addgreet="1">+ ${t('addGreeting')}</button></div>

  // Столы: переименование и номера (черновик живёт, пока не нажали «Сохранить») и устройства ресторана
  const rows = tablesDraft || r.tables.map((x) => ({ from: x, to: x }));
  const devAt = (name) => name && mgr.devices.find((d) => !d.entrance && d.table === name);
  $('tDev').innerHTML = `<div class="ed"><b>${t('tables')}</b><span class="empty">${t('tablesEdHint')}</span>
    ${rows.map((x, i) => {
      const d = devAt(x.from);

        <button class="del" data-deltbl="${i}">✕</button></div>`;

    <div class="bar"><button class="ghostbtn" data-addtbl="1">+ ${t('addTable')}</button><button data-savetbl="1">${t('save')}</button></div></div>`

// Как подпись слайда будет выглядеть на планшете
// Место блока с QR-кодом: сетка 4 ряда × 3 столбца, как на экране планшета
const QR_ROWS = ['top', 'upper', 'lower', 'bottom'], QR_COLS = ['left', 'center', 'right'];
const qrGrid = (cur) => {
  const pos = String(cur || 'top-right').replace('middle', 'upper');
  return `<div class="qrgrid">${QR_ROWS.flatMap((r) => QR_COLS.map((c) => `<button type="button" data-qrpos="${r}-${c}"
    class="${pos === `${r}-${c}` ? 'on' : ''}" title="${t('row_' + r)}, ${t('col_' + c)}"></button>`)).join('')}</div>`;
};
const slideOf = (type, x) => ({
  type, image: x.image, title: x.title, text: x.text, phone: x.phone, qr: x.link, qrPos: x.qrPos, qrSize: x.qrSize,
  fit: x.fit, imgY: x.imgY, imgScale: x.imgScale,
});

// ---------- Мини-копия слайда: те же доли экрана, что на планшете (экран 800×1280, область показа 800×986)

function qrSvg(text, px) {
  try {
    const q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createSvgTag(2, 0).replace('<svg ', `<svg style="width:${px}px;height:${px}px;display:block" `);
  } catch { return ''; }
}

function miniSlide(s, w = 120) {
  const h = w * 1.6, k = w / 800, stage = h * 0.77;
  const y = 50 - (Number(s.imgY) || 0), scale = (Number(s.imgScale) || 100) / 100;
  const fit = s.fit === 'contain' ? 'contain' : 'cover';
  let qr = '';
  if (s.qr || s.phone) {
    const [row, col] = String(s.qrPos || 'top-right').replace('middle', 'upper').split('-');
    const side = (row === 'upper' || row === 'lower' ? 88 : 24) * k;
    const pos = [row === 'bottom' ? `bottom:${stage * 0.04}px` : `top:${stage * { top: 0.03, upper: 0.27, lower: 0.51 }[row]}px`,
      col === 'left' ? `left:${side}px` : col === 'right' ? `right:${side}px` : 'left:50%;transform:translateX(-50%)'];
    qr = `<div class="mqr" style="${pos.join(';')};padding:${12 * k}px;border-radius:${16 * k}px">
      ${s.qr ? qrSvg(s.qr, ({ s: 130, m: 196, l: 260 }[s.qrSize] || 196) * k) : ''}
      ${s.phone ? `<div style="font-size:${22 * k}px;font-weight:700;white-space:nowrap;margin-top:${6 * k}px">📞 ${esc(s.phone)}</div>` : ''}</div>`;
  }
  const img = s.image ? `${fit === 'contain' || scale < 1 ? `<img class="mblur" src="${esc(s.image)}" alt="">` : ''}
    <img class="mimg" src="${esc(s.image)}" alt="" style="object-fit:${fit};object-position:50% ${y}%;transform-origin:50% ${y}%;transform:scale(${scale})">` : '';
  return `<div class="mini" style="width:${w}px;height:${h}px"><div class="mstage" style="top:${h * 0.08}px;height:${stage}px">${img}${qr}</div></div>`;
}

// Таблица меню: правка прямо в ячейках, ✎ — полная карточка (фото, описание, отметки)
let msort = { key: '', dir: 1 };
const sortValue = { sku: (it) => it.sku || '', cat: (it) => val(it.cat), name: (it) => val(it.name), price: (it) => Number(it.price) || 0 };

function menuTable(shown) {
  if (msort.key) {
    const f = sortValue[msort.key];
    shown = shown.slice().sort(([a], [b]) => (f(a) > f(b) ? 1 : f(a) < f(b) ? -1 : 0) * msort.dir);
  }
  const th = (key, label) => `<th data-sort="${key}">${label}${msort.key === key ? (msort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const box = (f, on) => `<td class="c"><input type="checkbox" data-f="${f}" ${on ? 'checked' : ''}></td>`;
  return `<div class="bar"><button data-save="1">${t('saveAll')}</button></div>
    <div class="xlwrap"><table class="xl"><thead><tr>
      ${th('sku', t('code'))}${th('cat', t('cat'))}${th('name', t('dish'))}${th('price', t('price'))}
      <th>★</th><th>📣</th><th>⦸</th>${Object.keys(TAGS).map((k) => `<th class="tagh" title="${esc(tagName(k))}">${esc(tagName(k))}</th>`).join('')}<th></th></tr></thead>
    <tbody data-list="menu">${shown.map(([it, i]) => `<tr data-i="${i}" class="${it.hidden ? 'off' : ''}">
      <td><input data-f="sku" value="${esc(it.sku || '')}" style="width:70px"></td>
      <td><input data-f="cat" value="${esc(val(it.cat))}"></td>
      <td><input data-f="name" value="${esc(val(it.name))}" style="min-width:220px"></td>

      ${box('dayDish', it.dayDish)}${box('promo', it.promo)}${box('hidden', it.hidden)}
      ${Object.keys(TAGS).map((k) => `<td class="c"><input type="checkbox" data-tagt="${k}" ${(it.tags || []).includes(k) ? 'checked' : ''}></td>`).join('')}
      <td><button data-medit="${i}">✎</button></td></tr>`).join('')}</tbody></table></div>`;
}

// Перед отправкой уменьшаем фото до 1280 px — планшетам не нужны тяжёлые файлы
async function uploadImage(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  const res = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-staff-token': token }, body: blob });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error);
  return j.url;
}

async function onEdit(e) {
  const el = e.target;
  if (el.classList.contains('elang')) {
    if (e.type === 'change') { elang = el.value; mcat = ''; renderManager(); }
    return;
  }
  if (el.classList.contains('osearch')) { oedit.q = el.value; renderOrderResults(); return; }
  if (el.classList.contains('msearch')) { mq = el.value; renderGrid(); return; }
  if (el.dataset.greet !== undefined && mgr) {
    const g = mgr.restaurant.avatar.greetings;
    g[el.dataset.greet] = { ...g[el.dataset.greet], [el.dataset.ln || elang]: el.value };
    return;
  }
  if (el.dataset.filter && mgr && e.type === 'change') {
    const av = mgr.restaurant.avatar;
    av.filters = el.checked ? [...new Set([...(av.filters || []), el.dataset.filter])] : av.filters.filter((f) => f !== el.dataset.filter);
    return;
  }
  // Отметка особых пожеланий прямо в таблице меню
  if (el.dataset.tagt && mgr && e.type === 'change') {
    const it = mgr.restaurant.menu[el.closest('[data-i]').dataset.i];
    it.tags = el.checked ? [...new Set([...(it.tags || []), el.dataset.tagt])] : (it.tags || []).filter((x) => x !== el.dataset.tagt);
    return;
  }
  if (el.dataset.tag && mgr && e.type === 'change') {
    const it = mgr.restaurant.draft[0];
    it.tags = el.checked ? [...new Set([...(it.tags || []), el.dataset.tag])] : (it.tags || []).filter((x) => x !== el.dataset.tag);
    return;
  }
  if (el.dataset.ai && mgr) {
    if (el.dataset.ai === 'characterId') mgr.restaurant.avatar.prevCharacter = mgr.restaurant.avatar.characterId;
    mgr.restaurant.avatar[el.dataset.ai] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    if (el.dataset.ai === 'characterId' && e.type === 'change') {
      // Сменили персонажа, а приветствие было стандартным от прежнего — подставится приветствие нового
      const av = mgr.restaurant.avatar, prev = mgr.characters.find((c) => c.id === av.prevCharacter);
      if (prev && av.greetings?.length === 1 && JSON.stringify(av.greetings[0]) === JSON.stringify(prev.greeting)) av.greetings = [];
      renderManager();
    }
    return;
  }
  if ('tbl' in el.dataset && mgr) {
    tablesDraft = tablesDraft || mgr.restaurant.tables.map((x) => ({ from: x, to: x }));
    tablesDraft[el.dataset.tbl].to = el.value;
    return;
  }
  if (el.dataset.df && mgr) {
    mgr.restaurant.display[el.dataset.df] = el.type === 'number' ? Number(el.value) : el.value;
    return;
  }
  if (el.dataset.sf && mgr) {
    mgr.restaurant.menuSource = { ...mgr.restaurant.menuSource, [el.dataset.sf]: el.value };
    if (el.dataset.sf === 'type' && e.type === 'change') renderMenuTab();
    return;
  }
  const card = el.closest('[data-i]'), list = el.closest('[data-list]');
  if (el.type === 'file' && e.type === 'change' && el.files[0] && card && list) {
    const item = mgr.restaurant[list.dataset.list][card.dataset.i];
    item[el.dataset.upload] = await uploadImage(el.files[0]);
    if (el.dataset.upload === 'photo') item.photoManual = true;
    if (list.dataset.list === 'draft') renderItem(); else renderManager();
    return;
  }
  const f = el.dataset.f;
  if (!f || !card || !list || !mgr) return;
  const item = mgr.restaurant[list.dataset.list][card.dataset.i];
  if (f === 'photo') item.photoManual = true;
  if (list.dataset.list === 'promos') setTimeout(() => {
    const mini = card.querySelector('.mini');
    if (mini) mini.outerHTML = miniSlide(slideOf('promo', item));
  });
  if (el.type === 'checkbox') item[f] = el.checked;
  else if (f === 'price') item[f] = Number(el.value) || 0;
  else if (list.dataset.list !== 'staff' && LANG_FIELDS.includes(f)) item[f] = { ...(item[f] || {}), [el.dataset.ln || elang]: el.value };
  else item[f] = el.value;
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
// Любая правка — сразу в открытый предпросмотр
document.addEventListener('input', () => sendPreview());
document.addEventListener('change', () => sendPreview());

// ---------- Предпросмотр слайда: getSlide() собирает слайд из полей, панель обновляется при каждой правке

let pvGet = null, pvDisplay = () => ({});

function openPreview(getSlide, getDisplay) {
  pvGet = getSlide;
  if (getDisplay) pvDisplay = getDisplay;
  $('pvPanel').hidden = false;
  // Страницу планшета грузим только при первом открытии предпросмотра
  if (!$('pvFrame').getAttribute('src')) $('pvFrame').src = '/guest/?preview=1';
  else sendPreview();
}

function sendPreview() {
  if (!pvGet || $('pvPanel').hidden) return;
  $('pvFrame').contentWindow.postMessage({ slide: pvGet(), display: pvDisplay(), lang: $('pvLang').value }, location.origin);
}

$('pvFrame').onload = sendPreview;
$('pvLang').onchange = sendPreview;
$('pvClose').onclick = () => { $('pvPanel').hidden = true; };


$('code').value = localStorage.code || '';
texts();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/staff/sw.js');
if (token) { startTimer(); refresh(); }
