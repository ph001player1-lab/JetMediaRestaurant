<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JET MEDIA Staff</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/staff/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1a17">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f7f3ee; color: #1f1a17; }
  .box { max-width: 420px; margin: 12vh auto; padding: 24px; background: #fff; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; }
  input, button { font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; }
  button { background: #1f1a17; color: #fff; border: 0; cursor: pointer; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: #fff; position: sticky; top: 0; }
  header b { flex: 1; }
  header button { font-size: 14px; padding: 8px 12px; }
  .langs button { background: none; color: inherit; border: 1px solid #ddd; padding: 6px 10px; font-size: 14px; }
  #shiftBtn { background: #2e7d32; }
  #shiftBtn.off { background: #c62828; }
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; background: #fff; border-top: 1px solid #eee; position: sticky; top: 0; }
  .tabs button { background: none; color: inherit; font-size: 15px; padding: 10px 12px; border-radius: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { border-color: #1f1a17; font-weight: 600; }
  .ed { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; display: grid; gap: 8px; }
  .ed label { display: flex; flex-direction: column; font-size: 13px; color: #8a7f76; gap: 4px; }
  .ed label.chk { flex-direction: row; align-items: center; gap: 8px; color: inherit; font-size: 16px; }
  .ed input, .ed select, .bar select { font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
  .ed img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; }
  .ed .del { background: #efe7df; color: #c62828; justify-self: start; font-size: 15px; padding: 8px 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 12px 0; }
  main { padding: 0 16px 32px; max-width: 720px; margin: auto; }
  .banner { background: #fff3cd; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .banner button { margin-top: 8px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 6px solid #c8553d; }
  .card.ack, .card.confirmed { border-color: #2e7d32; }
  .card.rejected { border-color: #999; opacity: .6; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .card button { margin: 8px 8px 0 0; font-size: 16px; padding: 10px 14px; }
  #tables button { margin: 4px; background: #efe7df; color: #1f1a17; }
  .empty { color: #8a7f76; }
  .err { color: #c62828; min-height: 1em; }
</style>
</head>
<body>
<div id="login" class="box">
  <div class="langs"><button data-l="en">EN</button> <button data-l="th">ไทย</button> <button data-l="ru">RU</button></div>
  <h2 data-t="login"></h2>
  <input id="code" data-t="code" inputmode="numeric" autocomplete="off">
  <input id="pin" data-t="pin" inputmode="numeric" type="password" autocomplete="off">
  <button id="go" data-t="start"></button>
  <p class="err" id="err"></p>
</div>
<div id="work" hidden>
  <header>
    <b id="rname"></b><span id="who"></span>
    <button id="shiftBtn"></button>
    <span class="langs"><button data-l="en">EN</button><button data-l="th">ไทย</button><button data-l="ru">RU</button></span>
    <button id="out" data-t="out"></button>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="tWork" class="on" data-t="tabWork"></button><button data-tab="tStaff" data-t="tabStaff"></button><button data-tab="tMenu" data-t="tabMenu"></button><button data-tab="tPromos" data-t="tabPromos"></button><button data-tab="tAds" data-t="tabAds"></button>
  </nav>
  <main><section id="tWork">
    <div class="banner" id="pushBanner" hidden><span id="pushText"></span><br><button id="pushBtn" data-t="push"></button></div>
    <h3 data-t="calls"></h3><div id="calls"></div>
    <h3 data-t="orders"></h3><div id="orders"></div>
    <h3 data-t="tables"></h3><div id="tables"></div>
  </section>
  <section id="tStaff" hidden></section><section id="tMenu" hidden></section>
  <section id="tPromos" hidden></section><section id="tAds" hidden></section>
  </main>
</div>

        calls: 'การเรียก', orders: 'ออร์เดอร์', tables: 'โต๊ะ', table: 'โต๊ะ', waiter: 'เรียกพนักงาน', bill: 'เช็คบิล',

        day: 'เมนูแนะนำประจำวัน', editLang: 'ภาษาที่แก้ไข', image: 'ลิงก์รูปภาพ', title: 'หัวข้อ', text: 'ข้อความ', active: 'เปิดใช้งาน',
        shown: 'แสดงอยู่ — แตะเพื่อบล็อก', blocked: 'บล็อกแล้ว — แตะเพื่อแสดง', views: 'ครั้งที่แสดงใน 7 วัน',

        going: 'Иду', done: 'Готово', confirm: 'Подтвердить', reject: 'Отклонить', free: 'свободен', none: 'Пока пусто',
        pending: 'ждёт подтверждения', confirmed: 'подтверждён', rejected: 'отклонён', wrong: 'Неверный код ресторана или PIN',

        pinF: 'PIN (пусто — придумается)', tablesHint: 'Столы (например 1-5, 8). Пусто — все столы', cat: 'Категория',
        dish: 'Название блюда', desc: 'Описание', price: 'Цена ฿', photo: 'Ссылка на фото', promo: 'В показе акций',
        day: 'Блюдо дня', editLang: 'Язык редактирования', image: 'Ссылка на картинку', title: 'Заголовок', text: 'Текст', active: 'Включено',

let lang = localStorage.lang || 'en';
let token = localStorage.token || '';
let seen = new Set(), first = true, audio = null, timer = null, last = null;

const $ = (id) => document.getElementById(id);
const t = (k) => (T[lang] || T.en)[k] || k;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const ago = (ms) => `${Math.max(0, Math.floor((Date.now() - ms) / 60000))} min`;
const itemName = (n) => (typeof n === 'string' ? n : n[lang] || n.en || n.th || Object.values(n)[0] || '');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function texts() {
  document.querySelectorAll('[data-t]').forEach((el) => {
    el[el.tagName === 'INPUT' ? 'placeholder' : 'textContent'] = t(el.dataset.t);
  });
  document.querySelectorAll('[data-l]').forEach((b) => (b.style.fontWeight = b.dataset.l === lang ? '700' : '400'));
}

async function api(path, body) {
  const r = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : undefined);
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error), { status: r.status });
  return j;
}

// Сигнал и вибрация, пока страница открыта; на заблокированном телефоне работают push-уведомления
function beep() {
  if (audio) {
    for (const d of [0, 0.5]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(audio.destination);
      o.start(audio.currentTime + d);
      o.stop(audio.currentTime + d + 0.3);
    }
  }
  navigator.vibrate?.([300, 150, 300]);
}

async function refresh() {
  try {
    render(await api(`/api/staff/state?token=${encodeURIComponent(token)}`));
    $('login').hidden = true;
    $('work').hidden = false;
  } catch (e) {
    if (e.status === 401) logout();
  }
}

function logout() {
  if (token) api('/api/staff/logout', { token }).catch(() => {});
  clearInterval(timer);
  localStorage.removeItem('token');
  token = '';
  $('work').hidden = true;
  $('login').hidden = false;
}

async function login() {
  try {
    const r = await api('/api/staff/login', { code: $('code').value, pin: $('pin').value, lang });
    token = localStorage.token = r.token;
    localStorage.code = $('code').value;
    $('pin').value = '';
    startTimer();
    await refresh();
  } catch {
    $('err').textContent = t('wrong');
  }
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(refresh, 3000);
  navigator.wakeLock?.request('screen').catch(() => {});
}

function urlB64ToBytes(s) {
  const raw = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function enablePush() {
  if (!canPush) return alert(t(isIOS && !standalone ? 'iosHint' : 'noPush'));
  if (await Notification.requestPermission() !== 'granted') return alert(t('denied'));
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription())
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(last.vapidKey) });
  await api('/api/staff/subscribe', { token, sub: sub.toJSON(), lang });
  refresh();
}

function render(s) {
  last = s;
  $('rname').textContent = s.restaurant.name;
  $('who').textContent = s.me.name;
  $('shiftBtn').textContent = t(s.me.onShift ? 'shiftOn' : 'shiftOff');
  $('shiftBtn').className = s.me.onShift ? '' : 'off';
  $('pushBanner').hidden = s.me.push;
  $('pushText').textContent = t(isIOS && !standalone ? 'iosHint' : 'pushText');
  $('pushBtn').hidden = isIOS && !standalone;
  $('tabs').hidden = s.me.role !== 'manager';

  let fresh = false;
  for (const x of [...s.calls.filter((c) => c.status === 'new'), ...s.orders.filter((o) => o.status === 'pending')]) {
    if (!seen.has(x.id)) { seen.add(x.id); fresh = true; }
  }
  if (fresh && !first) beep();
  first = false;

  const btn = (kind, id, action, label) => `<button data-act="${kind}|${esc(id)}|${action}">${t(label)}</button>`;
  const by = (x) => (x.by ? ` · ${esc(x.by)}` : '');

  $('calls').innerHTML = s.calls.map((c) => `<div class="card ${c.status}">
      <b>${t('table')} ${esc(c.table)}</b> · ${t(c.type)} · ${ago(c.at)}${by(c)}
      <div>${c.status === 'new' ? btn('call', c.id, 'ack', 'going') : ''}${btn('call', c.id, 'done', 'done')}</div>
    </div>`).join('') || `<p class="empty">${t('none')}</p>`;

  $('orders').innerHTML = s.orders.map((o) => `<div class="card ${o.status}">
      <b>${t('table')} ${esc(o.table)}</b> · ${ago(o.at)} · ${t(o.status)}${by(o)}
      <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(itemName(i.name))}</li>`).join('')}</ul>
      <b>฿${o.total.toLocaleString('en')}</b>
      <div>${o.status === 'pending' ? btn('order', o.id, 'confirm', 'confirm') + btn('order', o.id, 'reject', 'reject') : ''}</div>
    </div>`).join('') || `<p class="empty">${t('none')}</p>`;

  const busy = [...new Set([...s.calls, ...s.orders].map((x) => x.table))];
  $('tables').innerHTML = busy.map((tb) =>
    `<button data-act="table|${esc(tb)}|close">${t('table')} ${esc(tb)} ${t('free')}</button>`).join('')
    || `<p class="empty">${t('none')}</p>`;
}

document.addEventListener('click', async (e) => {
  // Звук в браузере разрешён только после касания
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  audio.resume?.();
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.l) {
    lang = localStorage.lang = b.dataset.l;
    texts();
    if (last) render(last);
    if (mgr) renderManager();
    // язык push-уведомлений тоже меняем
    if (last?.me.push) enablePush();
  } else if (b.dataset.act) {
    const [kind, id, action] = b.dataset.act.split('|');
    await api('/api/staff/action', { token, kind, id, action });
    refresh();
  } else if (b.dataset.tab) {
    showTab(b.dataset.tab);
  } else if (b.dataset.add) {
    const fresh = { staff: { role: 'waiter' }, promos: { active: true } }[b.dataset.add] || {};
    mgr.restaurant[b.dataset.add].push(fresh);
    renderManager();
  } else if (b.dataset.del !== undefined) {
    mgr.restaurant[b.closest('[data-list]').dataset.list].splice(Number(b.dataset.del), 1);
    renderManager();
  } else if (b.dataset.save) {
    saveManager(true);
  } else if (b.dataset.block) {
    const r = mgr.restaurant, id = b.dataset.block;
    r.blockedAds = r.blockedAds.includes(id) ? r.blockedAds.filter((x) => x !== id) : [...r.blockedAds, id];
    saveManager(false);
  } else if (b.id === 'go') {
    $('err').textContent = '';
    login();
  } else if (b.id === 'shiftBtn') {
    await api('/api/staff/shift', { token, on: !last.me.onShift });
    refresh();
  } else if (b.id === 'pushBtn') {
    enablePush();
  } else if (b.id === 'out') {
    logout();
  }
});

// ---------- Кабинет менеджера: персонал и столы, меню, акции, внешняя реклама

let mgr = null, elang = 'en';
const LANG_FIELDS = ['cat', 'name', 'desc', 'title', 'text'];
const val = (o) => (o && typeof o === 'object' ? o[elang] || '' : o ?? '');

// «1-5, 8» → 1, 2, 3, 4, 5, 8
const parseTables = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean).flatMap((x) => {
  const m = x.match(/^(\d+)\s*-\s*(\d+)$/);
  if (!m) return [x];
  const from = Number(m[1]), to = Math.min(Number(m[2]), from + 200);
  return Array.from({ length: Math.max(0, to - from + 1) }, (_, k) => String(from + k));
});

function showTab(id) {
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === id));
  for (const s of ['tWork', 'tStaff', 'tMenu', 'tPromos', 'tAds']) $(s).hidden = s !== id;
  if (id !== 'tWork') loadManager();
}

async function loadManager() {
  mgr = await api(`/api/manager/restaurant?token=${encodeURIComponent(token)}`);
  renderManager();
}

async function saveManager(notice) {
  const r = mgr.restaurant;
  await api('/api/manager/restaurant', {
    token,
    staff: r.staff.map((m) => ({ ...m, tables: Array.isArray(m.tables) ? m.tables : parseTables(m.tables) })),
    menu: r.menu, promos: r.promos, blockedAds: r.blockedAds,
  });
  await loadManager();
  if (notice) alert(t('saved'));
}

const inp = (f, v, label, type = 'text') => `<label>${t(label)}<input data-f="${f}" type="${type}" value="${esc(v)}"></label>`;
const chk = (f, on, label) => `<label class="chk"><input data-f="${f}" type="checkbox" ${on ? 'checked' : ''}>${t(label)}</label>`;
const img = (src) => (src ? `<img src="${esc(src)}" alt="">` : '');
const del = (i) => `<button class="del" data-del="${i}">${t('del')}</button>`;
const langBar = () => `<div class="bar"><label>${t('editLang')} <select class="elang">${
  ['en', 'th', 'ru', 'zh'].map((l) => `<option value="${l}" ${l === elang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}</select></label></div>`;
const saveBar = (list) => `<div class="bar"><button data-add="${list}">+ ${t('add')}</button><button data-save="1">${t('save')}</button></div>`;

function renderManager() {
  const r = mgr.restaurant;
  $('tStaff').innerHTML = `<div data-list="staff">${r.staff.map((m, i) => `<div class="ed" data-i="${i}">
      ${inp('name', m.name, 'nameF')}
      <label>${t('role')}<select data-f="role"><option value="waiter">${t('roleWaiter')}</option>
        <option value="manager" ${m.role === 'manager' ? 'selected' : ''}>${t('roleManager')}</option></select></label>
      ${inp('pin', m.pin, 'pinF')}
      ${inp('tables', Array.isArray(m.tables) ? m.tables.join(', ') : m.tables, 'tablesHint')}
      ${del(i)}</div>`).join('')}</div>${saveBar('staff')}`;

  $('tMenu').innerHTML = `${langBar()}<div data-list="menu">${r.menu.map((it, i) => `<div class="ed" data-i="${i}">
      ${img(it.photo)}${inp('cat', val(it.cat), 'cat')}${inp('name', val(it.name), 'dish')}${inp('desc', val(it.desc), 'desc')}
      ${inp('price', it.price ?? '', 'price', 'number')}${inp('photo', it.photo, 'photo')}
      ${chk('dayDish', it.dayDish, 'day')}${chk('promo', it.promo, 'promo')}${del(i)}</div>`).join('')}</div>${saveBar('menu')}`;

  $('tPromos').innerHTML = `${langBar()}<div data-list="promos">${r.promos.map((p, i) => `<div class="ed" data-i="${i}">
      ${img(p.image)}${inp('image', p.image, 'image')}${inp('title', val(p.title), 'title')}${inp('text', val(p.text), 'text')}
      ${chk('active', p.active, 'active')}${del(i)}</div>`).join('')}</div>${saveBar('promos')}`;

  $('tAds').innerHTML = r.tariff === 'premium' ? `<p class="empty">${t('premium')}</p>` : mgr.ads.map((a) => {
    const blocked = r.blockedAds.includes(a.id);
    return `<div class="ed">${img(a.image)}<b>${esc(a.title)}</b>
      <span class="empty">${esc(a.advertiser)} · ${a.views} ${t('views')}</span>
      <button data-block="${esc(a.id)}" style="background:${blocked ? '#c62828' : '#2e7d32'}">${t(blocked ? 'blocked' : 'shown')}</button></div>`;
  }).join('') || `<p class="empty">${t('noAds')}</p>`;
}

function onEdit(e) {
  const el = e.target;
  if (el.classList.contains('elang')) {
    if (e.type === 'change') { elang = el.value; renderManager(); }
    return;
  }
  const f = el.dataset.f, card = el.closest('[data-i]'), list = el.closest('[data-list]');
  if (!f || !card || !list || !mgr) return;
  const item = mgr.restaurant[list.dataset.list][card.dataset.i];
  if (el.type === 'checkbox') item[f] = el.checked;
  else if (f === 'price') item[f] = Number(el.value) || 0;
  else if (list.dataset.list !== 'staff' && LANG_FIELDS.includes(f)) item[f] = { ...(item[f] || {}), [elang]: el.value };
  else item[f] = el.value;
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);

$('code').value = localStorage.code || '';
texts();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/staff/sw.js');
if (token) { startTimer(); refresh(); }
</script>
</body>
</html>
