// Запрос к серверу; изменения ждём не дольше 10 секунд (на плохом Wi-Fi иначе висит, и официант жмёт снова)
async function api(path, body) {
  const ctl = body && typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl && setTimeout(() => ctl.abort(), 10000);
  let r;
  try {
    r = await fetch(path, body
      ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: ctl?.signal }
      : undefined);
  } catch (e) {
    throw Object.assign(new Error(t('noNet')), { net: true });
  } finally {
    clearTimeout(timer);
  }
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error), { status: r.status });
  return j;
}

// Сигнал и вибрация, пока страница открыта; на заблокированном телефоне работают push-уведомления
let lastNag = Date.now();
function beep() {
  if (audio) {
    for (const d of [0, 0.5]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(audio.destination);
      o.start(audio.currentTime + d);
      o.stop(audio.currentTime + d + 0.3);
    }
  }
  navigator.vibrate?.([300, 150, 300]);
}

// Новый запрос — только когда ответил предыдущий (на медленной сети запросы не копятся).

let refreshing = null, refreshAgain = false;
function refresh() {
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = (async () => {

      render(await api(`/api/staff/state?token=${encodeURIComponent(token)}`));
      $('login').hidden = true;
      $('work').hidden = false;
    } catch (e) {
      if (e.status === 401) logout();
    }
  })().finally(() => {
    refreshing = null;
    if (refreshAgain) { refreshAgain = false; refresh(); }
  });
  return refreshing;
}

function urlB64ToBytes(s) {
  const raw = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

// Подписка на уведомления — заново на сервер при каждом открытии приложения и при «На смене»:
// браузер мог сменить адрес подписки (обновление, очистка), а сервер слал бы на старый
// fresh — выбросить старую подписку и оформить новую: служба уведомлений ответила 410/404 (подписка умерла),
// а браузер об этом не знает и отдавал бы её снова
async function syncPush(force, fresh) {
  try {
    if (!canPush || Notification.permission !== 'granted' || !last?.vapidKey) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub && fresh) { await sub.unsubscribe().catch(() => {}); sub = null; }
    sub ||= await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(last.vapidKey) });
    if (force || !syncPush.done) { await api('/api/staff/subscribe', { token, sub: sub.toJSON(), lang }); syncPush.done = true; }
  } catch { /* нет разрешения или браузер не умеет — останется баннер «Включить уведомления» */ }
}

async function enablePush() {
  if (!canPush) return alert(t(isIOS && !standalone ? 'iosHint' : 'noPush'));
  if (await Notification.requestPermission() !== 'granted') return alert(t('denied'));
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription())
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(last.vapidKey) });
  await api('/api/staff/subscribe', { token, sub: sub.toJSON(), lang });
  refresh();
}

  const callHtml = (c) => `<div class="card ${c.status}">
      <b>${esc(tbl(c.table))}</b> · ${c.type === 'bill' ? `<span class="billask">🧾 ${c.scope ? `${t('billFor')}: ${esc(gname(c.table, c.scope))}` : t('billTable')} · ${money(billDue(c.table, c.scope))}</span>`
        : t(c.type) + (c.guest > 1 ? ` · 📱 ${esc(gname(c.table, c.guest))}` : '')} · ${ago(c.at)}${by(c)}
      <div>${c.status === 'new' ? btn('call', c.id, 'ack', 'going') : ''}${btn('call', c.id, 'done', 'done')}${undoFor(c.id)}</div>
    </div>`;
  $('calls').innerHTML = (ghosts() + s.calls.map(callHtml).join('')) || `<p class="empty">${t('none')}</p>`;

  // Суммы по столу: итого по всем счетам (кроме отклонённых) и сколько ещё к оплате
  // Оплата — по строкам блюд: после разделения счёта часть заказа может быть оплачена одним гостем, часть — нет
  const linePaid = (o, i) => !!(i.paidAt || o.paidAt);
  const sums = (tb) => {
    const list = s.orders.filter((o) => o.table === tb && o.status !== 'rejected');
    let total = 0, due = 0;
    for (const o of list) for (const i of o.items) { total += i.price * i.qty; if (!linePaid(o, i)) due += i.price * i.qty; }
    return { count: list.length, total, due, paid: total - due };
  };
  // «оплачено ฿X» зелёным и «к оплате ฿Y» красным
  const payInfo = (x) => `${x.paid ? `<span class="paidok">${t('paidSum')} ${money(x.paid)}</span>` : ''}${x.due ? `<span class="due">${t('due')} ${money(x.due)}</span>` : ''}`;

  const lineG = (o, i) => i.g || o.guest || 1;
  const manyT = new Set(Object.keys(s.phones || {}));
  for (const o of s.orders) if ((o.guest || 1) !== 1 || o.items.some((i) => lineG(o, i) !== 1)) manyT.add(o.table);
  const many = (tb) => manyT.has(tb);
  const flow = { ...s.flow };
  if (flow.kitchenScreen) flow.kitchenBtn = false;
  // Статус заказа цветом: ждёт подтверждения → подтверждён → на кухне (с таймером до «Готово») → готово → оплачен
  const stOf = (o) => (o.removedAt ? 'removed' : o.cancelledAt ? 'cancelled' : o.status === 'rejected' ? 'rejected' : o.status === 'pending' ? 'pending' : o.servedAt ? 'served'
    : o.readyAt ? 'ready' : flow.kitchenScreen || o.kitchenAt ? 'cooking' : 'confirmed');
  // оплата заказа — отдельной зелёной отметкой (часть строк могла быть оплачена отдельными гостями)
  const paidMark = (o) => {
    if (o.status === 'rejected') return '';
    const all = o.items.every((i) => linePaid(o, i)), some = o.items.some((i) => linePaid(o, i));
    return all ? ` <span class="st st-paidok">✓ ${t('paidSum')}</span>` : some ? ` <span class="st st-part">${t('partPaid')}</span>` : '';
  };
  // таймер — от подтверждения до «Подано» (с экраном кухни и без): учёт времени подачи
  const timer = (o) => {
    if (o.status !== 'confirmed') return '';
    const from = o.cookFrom || o.confirmedAt || o.at; // дозаказ после «Подано» — отсчёт заново
    return ` <span class="ktimer" data-from="${from}"${o.servedAt ? ` data-to="${o.servedAt}"` : ''}>${dur((o.servedAt || Date.now()) - from)}</span>`;
  };
  const pill = (o) => `<span class="st st-${stOf(o)}">${t(`st_${stOf(o)}`)}${timer(o)}</span>`;
  const tagsOf = (i) => (i.tags || []).filter((k) => TAGS[k] && !(i.ml && (k === 'spicy' || k === 'mild'))).map((k) => `<span class="otag">#${esc(tagName(k).toLowerCase())}</span>`).join('');
  // Заказ — как ушёл на кухню: одна строка на блюдо (кто за что платит — в «Счетах гостей»)
  const dishes = (items) => Object.values(items.reduce((a, i) => {
    const k = lineKey(i);
    a[k] ? (a[k].qty += i.qty) : (a[k] = { ...i });
    return a;
  }, {}));
  // История заказа: «14:05 · Boss: изменил: +1 × Салат, −2 × Хлеб»
  const histHtml = (o) => `<ul class="ohist">${o.hist.map((h) => {
    const who = h.by || (h.k === 'ready' || h.k === 'undo' ? t('kitchenW') : h.k === 'new' ? `${t('guestN')} ${h.g || 1}${h.src === 'phone' ? ' 📱' : ''}` : '');
    const what = h.k === 'edit' ? [histLines(h.add, '+'), histLines(h.del, '−')].filter(Boolean).join(', ') : h.k === 'revert' ? `«${esc(actLabel(h.of))}»` : histLines(h.items);
    return `<li${h.k === 'cancel' || h.k === 'redo' || h.k === 'remove' || h.k === 'revert' ? ' class="hw"' : ''}>${hhmm(h.t)} · ${esc(who)}${who ? ': ' : ''}${t(`h_${h.k}`)}${what ? `: ${what}` : ''}`
      + `${h.noKitchen ? ` (${t('noKitchenW')})` : ''}${h.note ? ` — «${esc(h.note)}»` : ''}</li>`;
  }).join('')}</ul>`;
  const orderCard = (o) => `<div class="card sub sb-${stOf(o)}">
      <div class="ohead">${many(o.table) ? `<b>${o.src === 'phone' ? '📱 ' : ''}${esc(gname(o.table, o.guest || 1))}</b> · ` : ''}${ago(o.at)} ${pill(o)}${paidMark(o)}
        ${o.test ? ` <span class="due">🧪 ${t('testMark')}</span>` : ''}${o.status === 'pending' && o.ackBy ? ` · ${t('going')}: ${esc(o.ackBy)}` : ''}${o.editedBy ? ` · ${t('editedBy')}: ${esc(o.editedBy)}` : ''}</div>
      ${o.cancelledAt ? `<div class="voidnote">✕ ${t('st_cancelled')} · ${esc(o.cancelledBy || '')}${o.cancelNote ? ` — «${esc(o.cancelNote)}»` : ''}</div>` : ''}
      ${o.redo && o.redo.at === o.cookFrom && !o.servedAt && o.status === 'confirmed' ? `<div class="redonote">🔁 ${t('redoNow')}: ${histLines(Object.values(o.redo.items).map((v) => [v.name, v.qty, v.ml]))}${o.redo.note ? ` — «${esc(o.redo.note)}»` : ''}</div>` : ''}
      <ul>${dishes(o.items).map((i) => `<li>${i.qty} × ${esc(itemName(i.name))}${tagsOf(i)}${modsHtml(i)}</li>`).join('')}</ul>
      <b>฿${o.total.toLocaleString('en')}</b>
      ${o.status === 'confirmed' && flow.kitchenBtn && !o.kitchenAt && !o.paidAt ? `<div class="knote">${t('kitchenRemind')}</div>` : ''}
      <div>
        ${o.status === 'pending' ? btn('order', o.id, 'confirm', flow.kitchenScreen ? 'confirmKitchen' : 'confirm') : ''}
        ${o.status === 'confirmed' && flow.kitchenBtn && !o.kitchenAt && !o.paidAt ? btn('order', o.id, 'kitchen', 'kitchenSent') : ''}
        ${o.status === 'confirmed' && !o.servedAt ? btn('order', o.id, 'served', 'servedBtn') : ''}
        ${o.status === 'confirmed' && o.readyAt ? `<button data-oredo="${esc(o.id)}">${t('redoBtn')}</button>` : ''}
        ${o.status !== 'rejected' && !o.paidAt ? `<button data-oedit="${esc(o.id)}">${t('edit')}</button>` : ''}
        ${o.status === 'confirmed' && !o.paidAt && !s.restaurant.pos && !many(o.table) ? btn('order', o.id, 'paid', 'paid') : ''}
        ${o.status === 'pending' ? btn('order', o.id, 'reject', 'reject') : ''}
        ${s.me.role === 'manager' && o.status !== 'rejected' ? `<button class="ghostbtn" data-act="order|${esc(o.id)}|${o.test ? 'untest' : 'test'}">${t(o.test ? 'untestOrder' : 'testOrder')}</button>` : ''}
        ${o.status === 'confirmed' && !o.items.some((i) => i.paidAt) && !o.paidAt && (!o.servedAt || s.me.role === 'manager') ? `<button class="ghostbtn danger" data-ocancel="${esc(o.id)}">${t('cancelBtn')}</button>` : ''}
        ${s.me.role === 'manager' && o.status !== 'rejected' && !o.paidAt ? `<button class="ghostbtn danger" data-act="order|${esc(o.id)}|remove" data-confirm="${esc(t('removeAsk'))}">${t('removeDup')}</button>` : ''}
        ${undoFor(o.id)}
      </div>
      ${(o.hist || []).length ? `<button class="histbtn" data-ohist="${esc(o.id)}">🕘 ${t('histT')} (${o.hist.length}) ${openHist.has(o.id) ? '▾' : '▸'}</button>${openHist.has(o.id) ? histHtml(o) : ''}` : ''}
    </div>`;
  // Счета гостей: кто что ест после разделения счёта; оплату отмечают по гостю
  const guestBills = (tb) => {
    const per = {};
    for (const o of s.orders.filter((y) => y.table === tb && y.status !== 'rejected')) {
      for (const i of o.items) {
        const n = lineG(o, i), k = `${lineKey(i)}|${linePaid(o, i) ? 1 : 0}`;
        const g = (per[n] ||= { lines: {}, sum: 0, due: 0 });
        g.lines[k] ? (g.lines[k].qty += i.qty) : (g.lines[k] = { ...i, paidAt: linePaid(o, i) });
        g.sum += i.price * i.qty;
        if (!linePaid(o, i)) g.due += i.price * i.qty;
      }
    }
    return `<div class="gbills"><b>${t('billsG')}</b>${Object.keys(per).sort((a, b) => a - b).map((n) => `<div class="gbill${per[n].due ? '' : ' done'}">
        <div class="gh"><b>${esc(gname(tb, Number(n)))} · ${money(per[n].sum)}</b>
          ${per[n].due ? `<button class="ghostbtn" data-gpay="${esc(tb)}|${n}">${t('guestPaid')}</button>` : ''}</div>
        <div class="gpay">${payInfo({ paid: per[n].sum - per[n].due, due: per[n].due })}</div>
        ${Object.values(per[n].lines).map((i) => `<div class="gl${i.paidAt ? ' paidl' : ''}"><span>${i.qty} × ${esc(itemName(i.name))}${modsHtml(i)}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}
      </div>`).join('')}</div>`;
  };
  const orderTables = [...new Set(s.orders.map((o) => o.table))];
  const orderBlock = (tb) => {
    const x = sums(tb), list = s.orders.filter((o) => o.table === tb);
    // «Иду» — одна кнопка на стол: сразу по всем новым заказам и вызовам стола
    const needAck = list.some((o) => o.status === 'pending' && !o.ackAt) || s.calls.some((c) => c.table === tb && c.status === 'new');
    return `<div class="tblock"><div class="thead"><b>${esc(tbl(tb))}</b>
        ${x.count > 1 ? `<span>${t('bills')}: ${x.count}</span>` : ''}<span>${t('total')} ${money(x.total)}</span>${payInfo(x)}
        <span class="tbtns">${needAck ? `<button data-act="table|${esc(tb)}|ack">${t('going')}</button>` : ''}
        <button class="ghostbtn" data-split="${esc(tb)}">${t('split')}</button></span></div>
      ${(s.phones?.[tb] || []).length ? `<div class="phones">📱 ${t('phonesL')}: ${s.phones[tb].map((g) => `<span class="phonechip">${esc(g.name || `${t('guestN')} ${g.n}`)}
        <button data-act="guest|${esc(tb)}|off" data-n="${g.n}" data-confirm="${esc(t('phoneOffAsk').replace('{n}', g.name || `${t('guestN')} ${g.n}`))}">✕</button></span>`).join(' ')}</div>` : ''}
      ${list.map(orderCard).join('')}
      ${many(tb) ? guestBills(tb) : ''}</div>`;
  };
  $('orders').innerHTML = orderTables.map(orderBlock).join('') || `<p class="empty">${t('none')}</p>`;
  if (split && !drag) renderSplit();

  // Столы смены: свои (или все, если за официантом не закреплены), плюс занятые чужие, где есть вызовы и заказы.
  // Свободный стол — зелёное «Свободен»; закрыть стол с неоплаченным — только после предупреждения
  const busy = new Set([...s.calls, ...s.orders].map((x) => x.table));
  const shown = [...(s.myTables || []), ...[...busy].filter((tb) => !(s.myTables || []).includes(tb))];
  renderForgot(s.forgotten);
  const tableLine = (tb) => {
    const x = sums(tb);
    const ask = x.due ? t('confirmCloseDue').replace('{n}', tbl(tb)).replace('{sum}', money(x.due)) : t('confirmClose').replace('{n}', tbl(tb));
    return `<div class="tline${busy.has(tb) ? '' : ' free'}"><span><b>${esc(tbl(tb))}</b>${x.count ? ` · ${t('total')} ${money(x.total)}` : ''}
        ${x.count ? ` · ${payInfo(x)}` : ''}</span>
      <button data-onew="${esc(tb)}">${t('addOrder')}</button>
      ${busy.has(tb) ? (x.due ? `<button data-closedue="${esc(tb)}" data-ask="${esc(ask)}">${t('closeTable')}</button>`
        : `<button data-act="table|${esc(tb)}|close" data-confirm="${esc(ask)}">${t('closeTable')}</button>`)
        : `<span class="freemark">${t('tableFree')}</span>`}</div>`;
  };
  $('tables').innerHTML = shown.map(tableLine).join('') || `<p class="empty">${t('none')}</p>`;

  // Вид «Схема»: столы на схеме зала (или плитками, пока схемы нет) и «Требует внимания»; список — как раньше.
  // Нажатие на стол — карточка снизу: вызовы, заказы и кнопки стола — те же, что в списке
  const floorOn = workView === 'floor';
  $('listView').hidden = floorOn;
  $('floorView').hidden = !floorOn;
  $('viewSw').innerHTML = `<span class="vseg"><button class="${floorOn ? '' : 'on'}" data-vsw="list">${t('vList')}</button><button class="${floorOn ? 'on' : ''}" data-vsw="floor">${t('vFloor')}</button></span>`
    + (floorOn ? `<button data-onew="" data-t="newOrder">${t('newOrder')}</button>` : '');
  if (floorOn) JetFloor.view($('floorView'), floorCtx(s, flow, many));
  if (sheetTable && !(s.restaurant.tables || []).includes(sheetTable)) sheetTable = null;
  if (sheetTable) {
    const calls = s.calls.filter((c) => c.table === sheetTable), has = s.orders.some((o) => o.table === sheetTable);
    $('tsheet').innerHTML = `<div class="tshade" data-tsclose="1"></div><div class="tpanel" role="dialog" aria-label="${esc(tbl(sheetTable))}">
      <div class="thead2"><b>${esc(tbl(sheetTable))}</b><button class="ghostbtn" data-tsclose="1" aria-label="${esc(t('cancel'))}">✕</button></div>
      ${ghosts(sheetTable)}${calls.map(callHtml).join('')}${has ? orderBlock(sheetTable) : ''}${tableLine(sheetTable)}</div>`;
  }
  $('tsheet').hidden = !sheetTable;
}

const busyActs = new Set(); // действия, по которым ждём ответ сервера (защита от многократного нажатия)
document.addEventListener('click', async (e) => {
  // Звук в браузере разрешён только после касания
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  audio.resume?.();
  const tile = e.target.closest('[data-edit]');
  if (tile) return openItem(Number(tile.dataset.edit));
  // Сортировка таблицы меню по клику на заголовок столбца
  const th = e.target.closest('th[data-sort]');
  if (th) {
    msort = { key: th.dataset.sort, dir: msort.key === th.dataset.sort ? -msort.dir : 1 };
    return renderGrid();
  }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.eye) {
    const i = b.previousElementSibling;
    i.classList.toggle('masked');
    return;
  }
  if (b.dataset.l) {
    lang = localStorage.lang = b.dataset.l;
    texts();
    if (last) render(last);
    if (mgr) renderManager();
    // язык push-уведомлений тоже меняем
    if (last?.me.push) enablePush();
  } else if (b.dataset.undo) {
    if (busyActs.has('undo')) return;
    busyActs.add('undo');
    b.disabled = true;
    try { await api('/api/staff/undo', { token, id: b.dataset.undo }); } catch (err) { alert(err.message || t('noNet')); } finally { busyActs.delete('undo'); }
    refresh();
  } else if (b.dataset.vsw) {
    workView = b.dataset.vsw;
    try { localStorage.workView = workView; } catch { /* приватный режим */ }
    render(last, true);
  } else if (b.dataset.tsclose) {
    sheetTable = null;
    render(last, true);
  } else if (b.dataset.closedue) {
    // Закрыть стол с неоплаченным — своё окно: предупреждение красным и жирным
    $('modal').innerHTML = `<div class="ed"><div class="warn">${esc(b.dataset.ask)}</div>
      <div class="bar"><button class="danger" data-act="table|${esc(b.dataset.closedue)}|close">${t('closeAnyway')}</button>
      <button class="ghostbtn" data-oclose="1">${t('cancel')}</button></div></div>`;
    $('modal').hidden = false;
  } else if (b.dataset.act) {
    const key = b.dataset.act + '|' + (b.dataset.n || '');
    if (busyActs.has(key)) return; // уже отправлено — ждём ответа сервера
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    if (b.closest('#modal') && !split) closeItem();
    const [kind, id, action] = b.dataset.act.split('|');
    busyActs.add(key);
    b.disabled = true;
    try {
      await api('/api/staff/action', { token, kind, id, action, n: Number(b.dataset.n) || undefined });
    } catch (err) {
      alert(err.message || t('noNet'));
    } finally {
      busyActs.delete(key);
      b.disabled = false;
    }
    refresh();
  } else if (b.dataset.split) {
    split = { table: b.dataset.split, extra: [] };
    renderSplit();
  } else if (b.dataset.gaddcol) {
    split.extra.push(Number(b.dataset.gaddcol));
    renderSplit();
  } else if (b.dataset.gpay) {
    if (busyActs.has('gpay|' + b.dataset.gpay)) return;
    const [tb, n] = b.dataset.gpay.split('|');
    busyActs.add('gpay|' + b.dataset.gpay);
    b.disabled = true;
    try {
      await api('/api/staff/action', { token, kind: 'guestpaid', id: tb, n: Number(n) });
    } catch (err) {
      alert(err.message || t('noNet'));
    } finally {
      busyActs.delete('gpay|' + b.dataset.gpay);
    }
    refresh();
  } else if (b.dataset.gpaid) {
    await api('/api/staff/action', { token, kind: 'guestpaid', id: split.table, n: Number(b.dataset.gpaid) });
    await refresh();
  } else if (b.dataset.sclose) {
    split = null;
    closeItem();
  } else if (b.dataset.copyprompt) {
    // Задание для ИИ-генератора картинок — в буфер обмена (на старых браузерах — через выделение)
    const ta = $('aiPrompt');
    try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
    alert(t('copiedPrompt'));
  } else if (b.dataset.oedit) {
    openOrderEditor(b.dataset.oedit);
  } else if (b.dataset.onew !== undefined) {
    openNewOrder(b.dataset.onew);
  } else if (b.dataset.oinc || b.dataset.odec) {
    const l = oedit.lines[Number(b.dataset.oinc ?? b.dataset.odec)];
    l.qty += b.dataset.oinc ? 1 : -1;
    oedit.lines = oedit.lines.filter((x) => x.qty > 0);
    renderOrderEditor();
  } else if (b.dataset.opo) {
    const m = staffMenuCache.find((x) => x.id === oedit.pick.id), g = m.groups[Number(b.dataset.opg)], id = b.dataset.opo;
    const on = oedit.pick.mods.includes(id);
    if (g.type === 'one') {
      oedit.pick.mods = oedit.pick.mods.filter((x) => !g.opts.some((o) => o.id === x));
      if (!on || g.req) oedit.pick.mods.push(id);
    } else oedit.pick.mods = on ? oedit.pick.mods.filter((x) => x !== id) : [...oedit.pick.mods, id];
    renderOrderEditor();
  } else if (b.dataset.opadd) {
    const p = oedit.pick;
    const miss = missingGroups(staffMenuCache.find((x) => x.id === p.id), p.mods);
    if (miss.length) {
      oedit.pickTried = true;
      renderOrderEditor();
      return alert(t('needPickAlert').replace('{g}', miss.map((x) => itemName(x.g.name)).join(', ')));
    }
    oedit.pickTried = false;
    oedit.pickWarn = false;
    addOrderLine(`${p.id}|${p.opt || ''}`, p.mods.length ? p.mods : ['']);
    oedit.pick = null;
    oedit.q = '';
    renderOrderEditor();
  } else if (b.dataset.opcancel) {
    oedit.pick = null;
    oedit.pickTried = oedit.pickWarn = false;
    renderOrderEditor();
  } else if (b.dataset.oadd) {
    addOrderLine(b.dataset.oadd);
    oedit.q = '';
    renderOrderEditor();
  } else if (b.dataset.osave) {
    if (oedit.saving) return; // уже отправляем — повторное нажатие не создаст второй заказ
    if (!oedit.id && !oedit.table) return alert(t('pickTable'));
    if (oedit.pick) {
      oedit.pickWarn = true;
      renderOrderEditor();
      return alert(t('pickFirst').replace('{d}', itemName(staffMenuCache.find((x) => x.id === oedit.pick.id)?.name)));
    }
    if (oedit.lines.length) {
      oedit.saving = true;
      renderOrderEditor();
      try {
        if (oedit.id) await api('/api/staff/action', { token, kind: 'order', id: oedit.id, action: 'edit', items: oedit.lines, rid: oedit.rid });
        else await api('/api/staff/order', { token, table: oedit.table, items: oedit.lines, guest: oedit.guest, rid: oedit.rid });
      } catch (err) {
        oedit.saving = false;
        renderOrderEditor();
        return alert(err.message || t('noNet'));
      }
    }
    closeItem();
    refresh();
  } else if (b.dataset.ohist) {
    openHist.has(b.dataset.ohist) ? openHist.delete(b.dataset.ohist) : openHist.add(b.dataset.ohist);
    if (last) render(last);
  } else if (b.dataset.oredo || b.dataset.ocancel) {
    openVoid(b.dataset.oredo ? 'redo' : 'cancel', b.dataset.oredo || b.dataset.ocancel);
  } else if (b.dataset.rq !== undefined && voidSt) {
    const k = b.dataset.rq;
    voidSt.qty[k] = Math.max(0, Math.min(voidSt.lines[k].qty, voidSt.qty[k] + Number(b.dataset.d)));

    const inp = $('voidNote');

    const v = voidSt, note = $('voidNote').value.trim();
    if (v.kind === 'redo' && !Object.values(v.qty).some(Boolean)) return alert(t('redoPick'));
    if (busyActs.has(`void|${v.id}`)) return;
    busyActs.add(`void|${v.id}`);
    b.disabled = true;
    try {
      await api('/api/staff/action', { token, kind: 'order', id: v.id, action: v.kind, note, ...(v.kind === 'redo' ? { items: v.qty } : {}) });
      voidSt = null;
      closeItem();
    } catch (err) {
      alert(err.message || t('noNet'));
      b.disabled = false;
    } finally {
      busyActs.delete(`void|${v.id}`);
    }
    refresh();
  } else if (b.dataset.oclose) {
    voidSt = null;
    closeItem();
  } else if (b.dataset.qrpos) {
    mgr.restaurant.promos[Number(b.closest('[data-i]').dataset.i)].qrPos = b.dataset.qrpos;
    renderManager();
    sendPreview();
  } else if (b.dataset.pedit !== undefined) {
    openPromo = openPromo === Number(b.dataset.pedit) ? -1 : Number(b.dataset.pedit);
    renderManager();
  } else if (b.dataset.dellang) {
    const p = mgr.restaurant.promos[Number(b.closest('[data-i]').dataset.i)];
    const gone = p.images[b.dataset.dellang];
    delete p.images[b.dataset.dellang];
    if (p.image === gone) p.image = Object.values(p.images)[0] || p.image;
    renderManager();
  } else if (b.dataset.pvitem) {
    openPreview(() => slideOf('item', mgr.restaurant.draft[0]), () => mgr.restaurant.display);
  } else if (b.dataset.pvpromo !== undefined) {
    const p = mgr.restaurant.promos[Number(b.dataset.pvpromo)];
    openPreview(() => slideOf('promo', p), () => mgr.restaurant.display);
  } else if (b.dataset.view) {
    const [list, view] = b.dataset.view.split('|');
    views[list] = localStorage[`${list}View`] = view;
    renderManager();
  } else if (b.dataset.medit !== undefined) {
    openItem(Number(b.dataset.medit));
  } else if (b.dataset.mcat !== undefined) {
    mcat = b.dataset.mcat;
    renderGrid();
  } else if (b.dataset.newitem) {
    openItem(-1);
  } else if (b.dataset.msave) {
    const r = mgr.restaurant;
    if (medit >= 0) r.menu[medit] = r.draft[0]; else r.menu.push(r.draft[0]);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.mclose) {
    closeItem();
  } else if (b.dataset.mdel) {
    mgr.restaurant.menu.splice(medit, 1);
    closeItem();
    await saveManager(false);
  } else if (b.dataset.addline) {
    const L = aiLines();
    L[b.dataset.addline].push({});
    aiOpen.add(b.dataset.addline);
    renderManager();
  } else if (b.dataset.delline) {

    aiLines()[k].splice(Number(i), 1);
    renderManager();
  } else if (b.dataset.aisave) {
    await api('/api/manager/restaurant', { token, avatar: mgr.restaurant.avatar });
    await loadManager();
    alert(t('saved'));
  } else if (b.dataset.addtbl || b.dataset.deltbl) {
    tablesDraft = tablesDraft || mgr.restaurant.tables.map((x) => ({ from: x, to: x }));
    if (b.dataset.addtbl) {
      const nums = tablesDraft.map((x) => Number((x.to.match(/(\d+)\s*$/) || [])[1])).filter((n) => Number.isInteger(n));
      tablesDraft.push({ from: '', to: `${t('table')} ${nums.length ? Math.max(...nums) + 1 : tablesDraft.length + 1}` });
    } else {
      const row = tablesDraft[b.dataset.deltbl];
      const busy = row.from && mgr.devices.some((d) => !d.entrance && d.table === row.from);
      if (busy && !confirm(t('delTableConfirm'))) return;

  } else if (b.dataset.theme) {
    mgr.restaurant.display.theme = b.dataset.theme;
    await api('/api/manager/restaurant', { token, display: mgr.restaurant.display });

  } else if (b.dataset.tab) {
    const prev = curTab();
    showTab(b.dataset.tab);
    if (prev !== b.dataset.tab) navOpen('tab', () => showTab(prev)); // «Назад» — на прошлую вкладку
  } else if (b.dataset.add) {

    const list = b.closest('[data-list]').dataset.list, i = Number(b.dataset.del), m = mgr.restaurant[list][i];

    // Уволить: сотрудник уходит в «Уволенные» после «Сохранить»; статистику оставить или убрать
    const [choice, i] = b.dataset.fire.split('|');

  } else if (b.id === 'pushBtn') {

  } else if (b.dataset.pushtest) {
    const delay = Number(b.dataset.pushtest);
    await syncPush(true, true); // проверка — всегда на свежей подписке
    await api('/api/staff/push-test', { token, delay }).catch(() => {});
    alert(delay > 60 ? t('pushTest6Sent').replace('{t}', hms(Date.now() + delay * 1000)) : t('pushTestSent'));
    refresh();
  } else if (b.dataset.pushlog) {
    pushLogOpen = !pushLogOpen;

  } else if (b.id === 'out') {

  }
});

// выбранное в группах (начинка, острота, добавки) — мелко под блюдом
const modsHtml = (i) => (i.ml ? `<div class="mods">${esc(itemName(i.ml))}</div>` : '');
const lineKey = (i) => `${i.id}|${i.opt || ''}|${(i.mods || []).join(',')}`;

// ---------- Правка заказа официантом: количество, удаление, новые блюда из меню

let staffMenuCache = null, oedit = null;

async function openOrderEditor(id) {
  const o = last.orders.find((x) => x.id === id);

  staffMenuCache ??= await api(`/api/staff/menu?token=${encodeURIComponent(token)}`);

}

// Удаление сотрудника: оставить его статистику или убрать (как тестовую)

// Новый заказ официанта: для какого гостя стола (по умолчанию — Гость 1; «новый гость» — следующий номер)
function guestSelect() {
  if (!oedit.table) return '';
  const nums = new Set([1, ...Object.keys(last.guests?.[oedit.table] || {}).map(Number), ...(last.phones?.[oedit.table] || []).map((g) => g.n)]);
  for (const o of last.orders.filter((y) => y.table === oedit.table)) for (const i of o.items) nums.add(i.g || o.guest || 1);
  const next = Math.max(...nums) + 1;
  const label = (n) => (last.guests?.[oedit.table] || {})[n] || `${t('guestN')} ${n}`;
  return ` <select class="oguest">${[...nums].sort((a, b) => a - b).map((n) => `<option value="${n}" ${n === oedit.guest ? 'selected' : ''}>${t('forGuest')}: ${esc(label(n))}</option>`).join('')}
    <option value="${next}" ${next === oedit.guest ? 'selected' : ''}>${t('forGuest')}: ${t('newGuest')} (${next})</option></select>`;
}

// ---------- Разделение счёта: блюда стола по гостям. Блюдо перетаскивают на другого гостя (или нажимают блюдо, потом гостя);
// переносится одна штука за раз. Гость оплатил свою часть — «Оплачен»
let split = null, drag = null, splitSel = null;
function renderSplit() {
  const tb = split.table, orders = last.orders.filter((o) => o.table === tb && o.status !== 'rejected');
  const g = (o, i) => i.g || o.guest || 1;
  const nums = new Set([1, ...split.extra, ...(last.phones?.[tb] || []).map((x) => x.n)]);
  for (const o of orders) for (const i of o.items) nums.add(g(o, i));
  const name = (n) => (last.guests?.[tb] || {})[n] || `${t('guestN')} ${n}`;
  const cols = [...nums].sort((a, b) => a - b).map((n) => {
    const lines = orders.flatMap((o) => o.items.map((i, li) => ({ o, i, li })).filter((x) => g(o, x.i) === n));
    const sum = lines.reduce((a, x) => a + x.i.price * x.i.qty, 0), unpaid = lines.filter((x) => !x.i.paidAt);
    return `<div class="gcol" data-gcol="${n}"><div class="gh"><b>${esc(name(n))} · ฿${sum.toLocaleString('en')}</b>
        ${lines.length ? (unpaid.length ? `<button class="ghostbtn" data-gpaid="${n}">${t('guestPaid')}</button>` : `<span class="kstate">${t('guestPaidDone')}</span>`) : ''}</div>
      ${lines.map((x) => `<div class="chip${x.i.paidAt ? ' paid' : ''}${splitSel && splitSel.o === x.o.id && splitSel.l === x.li ? ' sel' : ''}"
        ${x.i.paidAt ? '' : `data-o="${esc(x.o.id)}" data-l="${x.li}" data-g="${n}"`}>${x.i.qty} × ${esc(itemName(x.i.name))} · ฿${(x.i.price * x.i.qty).toLocaleString('en')}${modsHtml(x.i)}</div>`).join('')}</div>`;
  });
  const next = Math.max(...nums) + 1;
  $('modal').innerHTML = `<div class="ed" style="max-width:900px"><b>${esc(tbl(tb))} — ${t('split')}</b><span class="empty">${t('splitHint')}</span>
    <div class="gcols">${cols.join('')}</div>
    <div class="bar"><button class="ghostbtn" data-gaddcol="${next}">${t('addGuest')}</button><button data-sclose="1">${t('close')}</button></div></div>`;
  $('modal').hidden = false;
}
async function splitMove(oid, line, to) {
  splitSel = null;
  await api('/api/staff/action', { token, kind: 'order', id: oid, action: 'move', line, to, qty: 1 });
  await refresh();
}
// Перетаскивание пальцем или мышью (pointer events работают и на телефоне)
document.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('#modal .chip[data-o]');
  if (!c || !split) return;
  drag = { c, x: e.clientX, y: e.clientY, moved: false, ghost: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    drag.ghost = drag.c.cloneNode(true);
    drag.ghost.className = 'chip ghost-chip';
    drag.ghost.style.width = `${drag.c.offsetWidth}px`;
    document.body.appendChild(drag.ghost);
  }
  drag.ghost.style.left = `${e.clientX - 20}px`;
  drag.ghost.style.top = `${e.clientY - 20}px`;
  document.querySelectorAll('.gcol').forEach((x) => x.classList.remove('over'));
  document.elementFromPoint(e.clientX, e.clientY)?.closest('.gcol')?.classList.add('over');
});
document.addEventListener('pointercancel', () => {
  if (!drag) return;
  drag.ghost?.remove();
  drag = null;
  document.querySelectorAll('.gcol').forEach((x) => x.classList.remove('over'));
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll('.gcol').forEach((x) => x.classList.remove('over'));
  const from = Number(d.c.dataset.g);
  if (d.moved) {
    const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('.gcol');
    const to = col && Number(col.dataset.gcol);
    if (to && to !== from) splitMove(d.c.dataset.o, Number(d.c.dataset.l), to);
    return;
  }
  // нажатие без перетаскивания: выбрать блюдо, потом нажать на гостя
  splitSel = { o: d.c.dataset.o, l: Number(d.c.dataset.l), g: from };
  renderSplit();
});
document.addEventListener('click', (e) => {
  const col = e.target.closest('#modal .gcol');
  if (!col || !splitSel || e.target.closest('.chip, button')) return;
  const to = Number(col.dataset.gcol);
  if (to !== splitSel.g) splitMove(splitSel.o, splitSel.l, to);
});

function renderOrderResults() {
  const q = oedit.q.trim().toLowerCase();
  const found = !q ? [] : staffMenuCache.filter((m) => `${m.sku || ''} ${Object.values(m.name || {}).join(' ')}`.toLowerCase().includes(q)).slice(0, 8);
  $('ores').innerHTML = found.flatMap((m) => ((m.options || []).length
    ? m.options.map((o) => `<button data-oadd="${esc(m.id)}|${esc(o.key)}">${esc(itemName(m.name))} · ${esc(itemName(o.label))} · ฿${o.price}</button>`)
    : [`<button data-oadd="${esc(m.id)}|">${esc(itemName(m.name))} · ฿${m.price}</button>`])).join('');
}

const newRid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// Обязательные группы выбора, в которых ничего не выбрано
const missingGroups = (m, mods) => (m.groups || []).map((g, gi) => ({ g, gi })).filter(({ g }) => g.req && !g.opts.some((o) => mods.includes(o.id)));
function addOrderLine(key, mods = []) {
  const [id, opt] = key.split('|');
  const m = staffMenuCache.find((x) => x.id === id);
  // блюдо с группами выбора (начинка, острота…) — сначала окно выбора, как у гостя
  if ((m.groups || []).length && !oedit.pick && !mods.length) {
    const def = (m.groups || []).flatMap((g) => { const d = g.opts.filter((o) => o.def); return (g.type === 'one' ? d.slice(0, 1) : d).map((o) => o.id); });
    oedit.pick = { id, opt, mods: def };
    return;
  }
  const picked = (m.groups || []).flatMap((g) => g.opts.filter((o) => mods.includes(o.id)));
  const ml = picked.length ? { [lang]: picked.map((o) => itemName(o.name)).join(' · ') } : undefined;
  const line = oedit.lines.find((l) => lineKey(l) === lineKey({ id, opt, mods: picked.map((o) => o.id) }));
  if (line) { line.qty++; return; }
  const o = opt ? m.options.find((x) => x.key === opt) : null;
  oedit.lines.push({
    id, opt, qty: 1, name: itemName(m.name) + (o ? ` · ${itemName(o.label)}` : ''), mods: picked.map((o) => o.id), ml,
    price: (Number(o ? o.price : m.price) || 0) + picked.reduce((a, p) => a + (Number(p.price) || 0), 0),
  });
}
function pickHtml() {
  const m = staffMenuCache.find((x) => x.id === oedit.pick.id);

let lastLine = null;

function insertTag(sel) {
  const k = sel.dataset.tagins, tag = sel.value;
  sel.value = '';
  if (!tag) return;
  const el = lastLine?.isConnected && lastLine.dataset.line === k ? lastLine : document.querySelector(`#tAI input[data-line="${k}"]`);
  if (!el) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
  const before = el.value.slice(0, a), after = el.value.slice(b);
  const ins = (before && !/\s$/.test(before) ? ' ' : '') + tag + (after && !/^\s/.test(after) ? ' ' : '');
  el.value = before + ins + after;
  el.focus();
  el.setSelectionRange(before.length + ins.length, before.length + ins.length);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

// Забытые вызовы (больше часа без ответа) и заказы (8 часов без действий) за сегодня и вчера — внизу экрана, с подсказками
function renderForgot(fg) {
  const all = [...(fg?.today || []), ...(fg?.yesterday || [])];
  if (!all.length) { $('forgot').innerHTML = ''; return; }
  const hm = (ts) => new Date(ts).toLocaleTimeString(lang === 'ru' ? 'ru-RU' : lang === 'th' ? 'th-TH' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
  const line = (f) => f.kind === 'call'
    ? `<li>${f.type === 'bill' ? '🧾' : '🔔'} <b>${esc(tbl(f.table))}</b> · ${hm(f.at)} — ${t(f.type === 'bill' ? 'fgBill' : 'fgCall')}:
        ${(f.acked ? t('fgCallAck').replace('{n}', esc(f.acked)) : f.removed ? t('fgCallGone') : t('fgCallKept')).replace('{m}', f.after || 60).replace('{h}', f.afterH || 8)}</li>`
    : `<li>🍽 <b>${esc(tbl(f.table))}</b> · ${hm(f.at)} — ${t('fgOrder')}${f.total ? ` ฿${Number(f.total).toLocaleString('en')}` : ''}: ${t('fgOrderGone').replace('{t}', hm(f.last || f.at)).replace('{h}', f.afterH || 8)}${f.by ? ` · ${esc(f.by)}` : ''}</li>`;
  const block = (title, list) => (list.length ? `<b>${title} — ${list.length}</b><ul>${list.map(line).join('')}</ul>` : '');
  const calls = all.some((f) => f.kind === 'call'), orders = all.some((f) => f.kind === 'order');
  $('forgot').innerHTML = `<div class="forgot"><h3>⚠ ${t('fgTitle')}</h3>
    ${block(t('fgToday'), fg.today || [])}${block(t('fgYesterday'), fg.yesterday || [])}
    <div class="fgtips"><b>${t('fgHow')}</b><ul>${calls ? `<li>${t('fgTipCall')}</li>` : ''}${orders ? `<li>${t('fgTipOrder')}</li>` : ''}<li>${t('fgTipPush')}</li></ul></div></div>`;
}

// Место блока с QR-кодом: сетка 4 ряда × 3 столбца, как на экране планшета
const QR_ROWS = ['top', 'upper', 'lower', 'bottom'], QR_COLS = ['left', 'center', 'right'];
const qrGrid = (cur) => {
  const pos = String(cur || 'top-right').replace('middle', 'upper');
  return `<div class="qrgrid">${QR_ROWS.flatMap((r) => QR_COLS.map((c) => `<button type="button" data-qrpos="${r}-${c}"
    class="${pos === `${r}-${c}` ? 'on' : ''}" title="${t('row_' + r)}, ${t('col_' + c)}"></button>`)).join('')}</div>`;
};
const promoModeOf = (x) => (x.orderMode === 'none' ? 'none' : (x.orderMode || (x.price > 0 ? 'price' : 'free')) === 'price' && x.price > 0 ? 'price' : 'free');
// Слайд для мини-копии и предпросмотра: картинки по языкам и кнопка заказа — как на планшете
// (акция — по центру внизу; блюдо дня или блюдо «в показе акций» — справа в строке названия)
const slideOf = (type, x) => ({
  type, image: type === 'item' ? x.photo : x.image, images: x.images || {}, title: type === 'item' ? x.name : x.title, text: x.text,
  phone: x.phone, qr: x.link, qrPos: x.qrPos, qrSize: x.qrSize, fit: x.fit, imgY: x.imgY, imgScale: x.imgScale,
  order: type === 'item' || (type === 'promo' && promoModeOf(x) !== 'none') ? 'preview' : '',
  price: type === 'item' ? Number(x.price) || 0 : type === 'promo' && promoModeOf(x) === 'price' ? x.price : 0,
});
const slideImg = (s) => (s.images && (s.images[lang] || s.images.en || s.images.ru || s.images.th || s.images.zh)) || s.image;

// ---------- Мини-копия слайда: те же доли экрана, что на планшете (экран 800×1280, область показа 800×986)

function qrSvg(text, px) {
  try {
    const q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createSvgTag(2, 0).replace('<svg ', `<svg style="width:${px}px;height:${px}px;display:block" `);
  } catch { return ''; }
}

function miniSlide(s, w = 120) {
  const h = w * 1.6, k = w / 800, stage = h * 0.77;
  const y = 50 - (Number(s.imgY) || 0), scale = (Number(s.imgScale) || 100) / 100;
  const fit = s.fit === 'contain' ? 'contain' : 'cover';
  let qr = '';
  if (s.qr || s.phone) {
    const [row, col] = String(s.qrPos || 'top-right').replace('middle', 'upper').split('-');
    const side = (row === 'upper' || row === 'lower' ? 88 : 24) * k;
    const pos = [row === 'bottom' ? `bottom:${stage * 0.04}px` : `top:${stage * { top: 0.03, upper: 0.27, lower: 0.51 }[row]}px`,
      col === 'left' ? `left:${side}px` : col === 'right' ? `right:${side}px` : 'left:50%;transform:translateX(-50%)'];
    qr = `<div class="mqr" style="${pos.join(';')};padding:${12 * k}px;border-radius:${16 * k}px">
      ${s.qr ? qrSvg(s.qr, ({ s: 130, m: 196, l: 260 }[s.qrSize] || 196) * k) : ''}
      ${s.phone ? `<div style="font-size:${22 * k}px;font-weight:700;white-space:nowrap;margin-top:${6 * k}px">📞 ${esc(s.phone)}</div>` : ''}</div>`;
  }
  const src = slideImg(s);
  const img = src ? `${fit === 'contain' || scale < 1 ? `<img class="mblur" src="${esc(src)}" alt="">` : ''}
    <img class="mimg" src="${esc(src)}" alt="" style="object-fit:${fit};object-position:50% ${y}%;transform-origin:50% ${y}%;transform:scale(${scale})">` : '';
  // кнопка заказа в тех же долях, что на планшете
  const label = s.price > 0 ? `${t('orderBtn')} · ฿${Number(s.price).toLocaleString('en')}` : t('orderByPromo');
  const btn = !s.order ? '' : s.type === 'item'
    ? `<div class="mbtn" style="right:${32 * k}px;bottom:${21 * k}px;font-size:${27 * k}px;padding:${17 * k}px ${36 * k}px;border-radius:${24 * k}px">${esc(label)}</div>`
    : `<div class="mbtn" style="left:50%;transform:translateX(-50%);bottom:${32 * k}px;font-size:${27 * k}px;padding:${17 * k}px ${48 * k}px;border-radius:${24 * k}px">${esc(label)}</div>`;
  return `<div class="mini" style="width:${w}px;height:${h}px"><div class="mstage" style="top:${h * 0.08}px;height:${stage}px">${img}${qr}${btn}</div></div>`;
}

// Картинка для планшета: слайд акции или рекламы — чтобы закрывал экран планшета с запасом на чёткость (около 1080 × 1330),
// фото блюда — до 800 px. Формат WebP: при том же виде в 2–3 раза легче JPEG; если браузер не умеет — JPEG
async function shrinkImage(src, kind = 'slide') {
  const bmp = await createImageBitmap(src);
  let k = kind === 'photo' ? 800 / Math.max(bmp.width, bmp.height) : Math.max(1080 / bmp.width, 1330 / bmp.height);
  k = Math.min(1, k, 2000 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.8));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
  return { blob, w: c.width, h: c.height };
}
const kb = (n) => (n > 1048576 ? `${(n / 1048576).toFixed(1)} МБ` : `${Math.max(1, Math.round(n / 1024))} КБ`);
// Короткая подсказка внизу экрана
function note(text) {
  let el = document.getElementById('note');
  if (!el) {
    el = Object.assign(document.createElement('div'), { id: 'note' });
    el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1a17;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90%';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.hidden = false;
  clearTimeout(note.t);
  note.t = setTimeout(() => { el.hidden = true; }, 5000);
}
async function uploadImage(file, kind) {
  const { blob, w, h } = await shrinkImage(file, kind);
  const res = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': blob.type, 'x-staff-token': token }, body: blob });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error);
  note(`✓ ${w} × ${h} px, ${kb(blob.size)}${file.size > blob.size * 1.2 ? ` (было ${kb(file.size)})` : ''}`);
  return j.url;
}

async function onEdit(e) {
  const el = e.target;
  if (el.classList.contains('elang')) {
    if (e.type === 'change') { elang = el.value; mcat = ''; renderManager(); }
    return;
  }
  // Только при вводе: на «change» (потеря фокуса при нажатии на блюдо) список не перерисовываем, иначе нажатие теряется
  if (el.classList.contains('osearch')) { if (e.type === 'input') { oedit.q = el.value; renderOrderResults(); } return; }
  if (el.classList.contains('otable')) { oedit.table = el.value; oedit.guest = 1; if (e.type === 'change') renderOrderEditor(); return; }
  if (el.classList.contains('oguest')) { oedit.guest = Number(el.value) || 1; return; }
  if (el.classList.contains('msearch')) { mq = el.value; renderGrid(); return; }
  if (el.dataset.tagins && mgr) { if (e.type === 'change') insertTag(el); return; }
  if (el.dataset.line && mgr) {
    const list = aiLines()[el.dataset.line], i = el.dataset.li;
    list[i] = { ...list[i], [el.dataset.ln]: el.value };
    if (!el.value.trim()) delete list[i][el.dataset.ln];
    return;
  }
  if (el.dataset.filter && mgr && e.type === 'change') {
    const av = mgr.restaurant.avatar;
    av.filters = el.checked ? [...new Set([...(av.filters || []), el.dataset.filter])] : av.filters.filter((f) => f !== el.dataset.filter);
    return;
  }
  // Отметка особых пожеланий прямо в таблице меню
  if (el.dataset.tagt && mgr && e.type === 'change') {
    const it = mgr.restaurant.menu[el.closest('[data-i]').dataset.i];
    it.tags = el.checked ? [...new Set([...(it.tags || []), el.dataset.tagt])] : (it.tags || []).filter((x) => x !== el.dataset.tagt);
    return;
  }
  if (el.dataset.tag && mgr && e.type === 'change') {
    const it = mgr.restaurant.draft[0];
    it.tags = el.checked ? [...new Set([...(it.tags || []), el.dataset.tag])] : (it.tags || []).filter((x) => x !== el.dataset.tag);
    return;
  }
  if (el.dataset.ai && mgr) {
    mgr.restaurant.avatar[el.dataset.ai] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    // у каждого персонажа свои фразы — показываем фразы выбранного
    if (el.dataset.ai === 'characterId' && e.type === 'change') renderManager();
    return;
  }
  // Поиск акций: прячем карточки без перерисовки, чтобы не терять фокус
  if (el.id === 'promoQ') {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll('#tPromos [data-name]').forEach((c) => { c.hidden = !!q && !c.dataset.name.includes(q); });
    return;
  }
  if (el.dataset.arch && mgr && e.type === 'change') {
    await api('/api/manager/restaurant', { token, staffArchive: [{ id: el.dataset.arch, test: el.checked }] });
    return loadManager();
  }
  if ('tbl' in el.dataset && mgr) {
    tablesDraft = tablesDraft || mgr.restaurant.tables.map((x) => ({ from: x, to: x }));
    tablesDraft[el.dataset.tbl].to = el.value;
    return;
  }
  if (el.dataset.mview && mgr && e.type === 'change') {
    mvDraft = el.dataset.mview; // пока только предпросмотр; на планшеты — кнопкой «Применить»
    renderManager();
    return;
  }
  if (el.dataset.flow && mgr) { mgr.restaurant.flow[el.dataset.flow] = el.checked; if (e.type === 'change') renderManager(); return; }
  if (el.dataset.df && mgr) {
    mgr.restaurant.display[el.dataset.df] = el.type === 'number' || el.type === 'range' || el.dataset.df === 'slideMs' ? Number(el.value) : el.value;
    if (el.dataset.df === 'arrowSize') { $('arwPct').textContent = `${el.value}%`; $('arwTab').style.setProperty('--arw', el.value / 100); }
    // смена слайдов: сохраняем сразу и показываем пример
    if (el.dataset.fxsave && e.type === 'change') {
      fxDemo();
      api('/api/manager/restaurant', { token, display: mgr.restaurant.display });
    }
    return;
  }
  const card = el.closest('[data-i]'), list = el.closest('[data-list]');
  // «показывать» у картинки языка: снята — гостям на этом языке акция не показывается (сохраняется кнопкой «Сохранить»)
  if (el.dataset.langon && e.type === 'change' && card) {
    const p = mgr.restaurant.promos[card.dataset.i], l = el.dataset.langon;
    p.langOff = el.checked ? (p.langOff || []).filter((x) => x !== l) : [...new Set([...(p.langOff || []), l])];
    return;
  }
  if (el.dataset.uplang && e.type === 'change' && el.files[0] && card) {
    const p = mgr.restaurant.promos[card.dataset.i];
    const url = await uploadImage(el.files[0], 'slide');
    p.images = { ...(p.images || {}), [el.dataset.uplang]: url };
    if (!p.image) p.image = url;
    return renderManager();
  }
  if (el.type === 'file' && e.type === 'change' && el.files[0] && card && list) {
    const item = mgr.restaurant[list.dataset.list][card.dataset.i];
    item[el.dataset.upload] = await uploadImage(el.files[0], list.dataset.list === 'promos' ? 'slide' : 'photo');
    if (el.dataset.upload === 'photo') item.photoManual = true;
    if (list.dataset.list === 'draft') renderItem(); else renderManager();
    return;
  }
  const f = el.dataset.f;
  if (!f || !card || !list || !mgr) return;
  const item = mgr.restaurant[list.dataset.list][card.dataset.i];
  if (f === 'photo') item.photoManual = true;
  if (list.dataset.list === 'promos') setTimeout(() => {
    const mini = card.querySelector('.mini');
    if (mini) mini.outerHTML = miniSlide(slideOf('promo', item));
  });
  if (el.type === 'checkbox') item[f] = el.checked;
  else if (f === 'price') item[f] = Number(el.value) || 0;
  // Многоязычные поля — у блюд; у сотрудников и акций «name» — обычная строка
  else if (!['staff', 'promos'].includes(list.dataset.list) && LANG_FIELDS.includes(f)) item[f] = { ...(item[f] || {}), [el.dataset.ln || elang]: el.value };
  else item[f] = el.value;
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
// Любая правка — сразу в открытый предпросмотр
document.addEventListener('input', () => sendPreview());
document.addEventListener('change', () => sendPreview());

// ---------- Предпросмотр слайда: getSlide() собирает слайд из полей, панель обновляется при каждой правке

let pvGet = null, pvDisplay = () => ({});

function openPreview(getSlide, getDisplay) {
  pvGet = getSlide;
  if (getDisplay) pvDisplay = getDisplay;
  $('pvPanel').hidden = false;
  // Страницу планшета грузим только при первом открытии предпросмотра
  if (!$('pvFrame').getAttribute('src')) $('pvFrame').src = '/guest/?preview=1';
  else sendPreview();
}

function sendPreview() {
  if (!pvGet || $('pvPanel').hidden) return;
  $('pvFrame').contentWindow.postMessage({ slide: pvGet(), display: pvDisplay(), lang: $('pvLang').value }, location.origin);
}

$('pvFrame').onload = sendPreview;
$('pvLang').onchange = sendPreview;
$('pvClose').onclick = () => { $('pvPanel').hidden = true; };


$('code').value = localStorage.code || '';
texts();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/staff/sw.js');
if (token) { startTimer(); refresh(); }

// ---------- Системная кнопка «Назад» (Android): не выходит из приложения, а закрывает открытое окно
// и карточку стола, возвращает на прошлую вкладку. На главном экране — «нажмите ещё раз, чтобы выйти»
const curTab = () => ['tWork', 'tStaff', 'tMenu', 'tPromos', 'tAI', 'tDesign', 'tDev', 'tFloor', 'tKitchen', 'tStats'].find((id) => !$(id).hidden) || 'tWork';
const nav = [], navQuiet = {};
let navSkip = 0, navLastBack = 0;
function navOpen(id, close) {
  nav.push({ id, close });
  try { history.pushState({ jsNav: nav.length }, ''); } catch { /* без истории — как раньше */ }
}
// окно закрыли кнопкой в приложении — убираем его шаг из истории
function navDone(id) {
  const i = nav.map((x) => x.id).lastIndexOf(id);
  if (i < 0) return;
  nav.splice(i, 1);
  navSkip++;
  history.back();
}
window.addEventListener('popstate', () => {
  if (navSkip) { navSkip--; return; }
  const top = nav.pop();
  if (top) {
    if (top.id !== 'tab' && !$(top.id).hidden) navQuiet[top.id] = true;
    top.close();
    return;
  }
  if (Date.now() - navLastBack < 2500) { history.back(); return; } // второе «Назад» подряд — выходим
  navLastBack = Date.now();
  toast(t('backAgain'));
  history.pushState({ jsGuard: 1 }, '');
});
try { history.replaceState({ jsRoot: 1 }, ''); history.pushState({ jsGuard: 1 }, ''); } catch { /* ignore */ }
for (const [id, close] of [['modal', () => closeItem()], ['tsheet', () => { sheetTable = null; if (last) render(last, true); else $('tsheet').hidden = true; }]]) {
  let open = !$(id).hidden;
  new MutationObserver(() => {
    const now = !$(id).hidden;
    if (now === open) return;
    open = now;
    if (navQuiet[id]) { navQuiet[id] = false; return; } // закрыли «Назад» — шаг уже снят
    if (now) navOpen(id, close); else navDone(id);
  }).observe($(id), { attributes: true, attributeFilter: ['hidden'] });
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2500);
}
</script>
