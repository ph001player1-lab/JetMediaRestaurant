services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: node server.mjs
    volumes:
      - ../server:/app:ro
      - data:/data
      # счётчики сетевой карты VPS (трафик за месяц, как у OVH) — только чтение
      - /proc:/host/proc:ro
    environment:
      - DATA_DIR=/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEVICE_KEY=${DEVICE_KEY}
      - PUBLIC_URL=https://app.jetmedia.dev
    restart: unless-stopped
    # сервер при остановке дописывает базу и выходит за ~1,5 с; дольше не ждём
    stop_grace_period: 5s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  data:
  caddy_data:
